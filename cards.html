nguyện là gì?", "a": "Cho rằng chỉ mãn nguyện khi mọi khát vọng thành hiện thực (giàu có, con thành đạt, địa vị, nổi tiếng…). Thực ra MÃN NGUYỆN là luôn biết ơn, trân trọng mọi thứ ở hiện tại; chính NĂNG LƯỢNG BIẾT ƠN tạo ra trạng thái mãn nguyện."}, {"q": "Thực hành mãn nguyện cụ thể ra sao?", "a": "Cảm ơn, tạ ơn cả những điều nhỏ nhặt nhất mỗi ngày: được ăn no, đọc sách hay, đang được sống, có gia đình bên cạnh, kể cả quá khứ khổ đau. Đó là thái độ TRÂN QUÝ; mãn nguyện là CHÌA KHÓA CỦA SỰ CÂN BẰNG."}, {"q": "Sự cân bằng ở từng vòng tròn bản thể là gì?", "a": "• Vòng 01 – Sự Tuyệt đối: tự thân đã là cân bằng.\n• Vòng 02 – Tâm thức: SỰ TĨNH LẶNG, mãn nguyện từ năng lượng biết ơn.\n• Vòng 03 – Thân xác: SỰ KHỎE MẠNH.\n• Ngoài 3 vòng: giàu có, gia đình hạnh phúc, quan hệ chất lượng, thành công, cống hiến."}, {"q": "Vì sao Tâm thức là không gian quan trọng nhất tạo nên vận mệnh?", "a": "Vì Luật Nhân Quả và Luật Hấp Dẫn vận hành tại đây. Vòng Tâm thức mất cân bằng → động loạn, bất lợi, khổ đau. Chỉ lo đời sống xã hội mà quên cân bằng 3 vòng thì \"có được nhưng không giữ được\", \"giàu có nhưng không an lạc\"."}, {"q": "Công thức của Sự cân bằng trong chương này?", "a": "SỰ CÂN BẰNG = MÃN NGUYỆN = HÀI LÒNG và BIẾT ƠN = TĨNH LẶNG.\nTừ đó: \"Hãy mãn nguyện trước, rồi thành công sẽ đến\".", "d": 1}]}, {"part": 1, "num": 43, "title": "Niết bàn", "summary": "Niết bàn không phải một cõi trời hay nơi đến sau khi chết, mà là trạng thái viên mãn hoàn toàn trong nội tâm, tự hiển lộ khi cực sạch nghiệp. Đừng cố chạm đến Niết bàn, hãy hóa giải khổ đau, tạp niệm qua 7 thực hành hằng ngày.", "key": "Đừng cố gắng chạm đến Niết bàn; hãy nỗ lực hóa giải khổ đau – Niết bàn sẽ tự xuất hiện.", "cards": [{"q": "Niết bàn là gì theo tác giả?", "a": "Là trạng thái viên mãn hoàn toàn trong nội tâm: cực lạc, cực an, Trí cực sạch, Tâm cực an, vắng lặng suy tưởng, im lặng tột độ. Không phải cảnh giới ngoài Vũ Trụ hay nơi chốn nào – \"MỘT TRẠNG THÁI ĐẾN TỪ BÊN TRONG\", lạc hỷ không cần duyên khởi."}, {"q": "Phật giáo và Ấn Độ giáo nói về Niết bàn thế nào và điểm chung?", "a": "• Phật giáo: diệt tận tham, sân, si → chấm dứt tạp niệm.\n• Ấn Độ giáo: Atman trở về Brahman → sự sụp đổ của bản ngã.\nBản chất chỉ có một, chỉ khác từ ngữ: \"VẠN PHÁP TỪ MỘT MÀ SINH RA\"."}, {"q": "Những từ ngữ đồng nghĩa với Niết bàn?", "a": "Giải thoát tuyệt đối, Giác ngộ tuyệt đối, trở về Thiên quốc, trở về với Thiên Chúa, sống trên Thiên đàng, hợp nhất cùng Tạo Hóa, đứa con Vũ Trụ, Chân ngã, Phật tính – đều chỉ trạng thái viên mãn hoàn toàn nội tâm."}, {"q": "Trí và Tâm đạt trạng thái Niết bàn có biểu hiện gì?", "a": "• Trí: im lặng rốt ráo, chuyên chú thực tại, sáng tạo, nhạy bén, nhìn vạn vật tươi mới không quan điểm chen ngang – khởi đầu SỰ THÔNG THÁI.\n• Tâm: bình an sâu thẳm, vượt ngoài cảm xúc, cực sạch năng lượng tồn đọng (nghiệp đã hóa giải), \"mặt hồ tĩnh lặng nguyên thủy\"."}, {"q": "Khi nào trạng thái Niết bàn đến? Vì sao dùng tư duy lại lìa xa nó?", "a": "Đến khi và chỉ khi CỰC SẠCH NGHIỆP – tự hiển lộ như Mặt trời sau mây. Không thể gồng mình, tư duy hay tích lũy kiến thức để đạt, vì Niết bàn là trạng thái DỪNG LẠI CỦA TÂM TRÍ, CHẤM DỨT CỦA TƯ DUY."}, {"q": "Ai đạt Niết bàn? Người Giác ngộ đối với an lạc thế nào?", "a": "Không ai cả – chỉ Trí, Tâm đạt trạng thái Niết bàn; \"Ta là\" chưa bao giờ tồn tại. Người Giác ngộ luôn an lạc nhưng chưa bao giờ bận tâm hay đồng hóa \"Ta là\" với an lạc đó, chỉ đơn giản thưởng thức."}, {"q": "Thước đo đi đúng hay sai đường tu tập?", "a": "Bất kể pháp môn, tôn giáo nào: ngày càng an lạc, hạnh phúc, viên mãn, thanh tịnh → ĐI ĐÚNG ĐƯỜNG. Ngày càng bất an, mê tín, đau khổ, tạp niệm → ĐI SAI ĐƯỜNG."}, {"q": "Niết bàn trong đời thường được mô tả qua những công thức nào?", "a": "• \"Trí sáng, Tâm an, Thân khỏe\" là Niết bàn.\n• \"Ăn ngon, ngủ ngon, tâm hồn thanh tịnh\" là Niết bàn.\n• Niết bàn = Viên mãn = Tự do = Giải thoát hoàn toàn.\n• Làm giàu chân chính, bớt lo cơm áo cũng là đang gần Niết bàn."}, {"q": "7 hành động hằng ngày đưa Tâm thức gần Niết bàn?", "a": "1. Thiền định sáng – tối.\n2. Cầu nguyện sau xả thiền.\n3. Thiền mọi lúc mọi nơi.\n4. Vận dụng Thân khỏe – Trí sáng – Tâm an để sáng tạo cuộc sống, làm giàu, không mê tín.\n5. Thường hằng biết ơn.\n6. Đọc lại Giáo lý ít nhất mỗi năm 1 lần.\n7. Tránh xa tiêu cực."}]}, {"part": 1, "num": 44, "title": "Giác ngộ và thuộc tính của “sự giác ngộ”", "summary": "Giác ngộ là sự thấu triệt bản chất, thực chứng bằng năng lượng nguyên thủy dồi dào chứ không bằng lý thuyết; nó tự đến khi nghiệp được hóa giải hết. Chương phân 4 mức độ Ngộ và liệt kê thuộc tính của Người Giác ngộ trong Đạo và ngoài Đời.", "key": "Chỉ có sự Giác ngộ, chứ không có ai giác ngộ.", "cards": [{"q": "Nghĩa của \"Giác\" và \"Ngộ\"?", "a": "• Giác: sự thấu triệt, sáng tỏ, quang tỏa – như \"sự bừng tỉnh\".\n• Ngộ: sự thấu hiểu tường tận bản chất cốt lõi, chấm dứt mọi nghi hoặc."}, {"q": "4 mức độ của \"Ngộ\"?", "a": "1. Tiểu ngộ: hiểu căn bản, biết thiền và quán chiếu.\n2. Trung ngộ: tự bước trên đường tu không cần Minh Sư, phân biệt giáo lý cao/thấp.\n3. Đại ngộ: chạm an lạc, thanh tịnh mọi lúc mọi nơi – gọi tắt là SỰ GIÁC NGỘ.\n4. Triệt ngộ: vượt ngoài Tánh Biết, hợp nhất Thể Tính Vũ Trụ – GIÁC NGỘ TUYỆT ĐỐI, ĐẮC ĐẠO."}, {"q": "Thực chứng của Giác ngộ nằm ở đâu?", "a": "Không ở lý thuyết, hùng luận mà ở \"năng lượng thực thụ\": sự sung mãn của năng lượng nguyên thủy quang tỏa thành hào quang, Ý thức cực sạch thuần khiết, Trí yên lặng tột độ, Tâm bình an sâu thẳm."}, {"q": "Hành trình Giác ngộ đi qua những bước nào?", "a": "GIẢI NGỘ → CHỨNG NGỘ → GIÁC NGỘ. Tức: Chưa biết → Biết → Thấu hiểu bản chất → Vận dụng rốt ráo → Trở nên \"LÀ NHƯ VẬY\" (thực chứng bằng năng lượng và nội lực)."}, {"q": "Vì sao Giác ngộ luôn đi kèm Sự thông thái?", "a": "Vì nguyên năng sung mãn kích hoạt tiến hóa nhận thức lên tầm cao Vũ Trụ. Sự thông thái đến không qua tích lũy kiến thức hay trải nghiệm: nghe hiểu, thấy hiểu – SỰ TỨC THÌ CỦA THẤU HIỂU."}, {"q": "Vì sao mọi nỗ lực, mong cầu chạm vào Giác ngộ lại lìa xa nó?", "a": "Giác ngộ là trạng thái TỰ ĐẾN khi mọi khổ đau, ô trược (nghiệp) được hóa giải. Mong cầu, ham muốn phá vỡ sự yên tĩnh của Tâm Trí. Hãy tu thiền để hóa giải khổ đau, tạp niệm; mọi sự tuyệt vời sẽ tự đến."}, {"q": "Những điều KHÔNG tạo ra hay ảnh hưởng đến Giác ngộ?", "a": "• Khai mở 7 luân xa, hỏa xà kundalini (chỉ đả thông khí huyết).\n• Ăn mặn hay ăn chay.\n• Địa vị, bằng cấp, sắc tộc, tôn giáo, thời đại…\n• Tích lũy kiến thức, hùng luận về Đạo – đều vô nghĩa nếu không dấn thân thực hành."}, {"q": "Vì sao người mới học Tâm linh hay \"huyên thuyên\" về Thiền bị xem là chưa hiểu?", "a": "Kiến thức thu lượm \"chỉ là đống rác\". Mọi sự thể hiện, định nghĩa về bản thân là hành hoạt của BẢN NGÃ muốn được khen ngợi. Tâm linh thật thụ là an lạc không cần ngôn ngữ; người Giác ngộ chỉ im lặng và mỉm cười."}, {"q": "Một số thuộc tính \"Trong Đạo\" của Người Giác ngộ?", "a": "• Năng lượng nguyên thủy dồi dào, quang tỏa.\n• Ý thức thuần khiết, làm chủ Tâm Trí hoàn toàn.\n• Trí cực sạch, Tâm cực an – tự nhiên.\n• Chân ngã tự thị hiện.\n• Chấp nhận vạn vật \"là như vậy\".\n• Ngoài khuôn khổ tôn giáo; Đức tin lớn và lòng biết ơn sâu sắc."}, {"q": "Một số thuộc tính \"Ngoài Đời\" của Người Giác ngộ?", "a": "• Uyển chuyển linh hoạt, vạn sự tùy duyên.\n• Sống thực tế, chân thành, không xã giao.\n• Không bận tâm người khác nghĩ gì.\n• Đói ăn, mệt ngủ như người thường; làm tốt nhiều vai trò.\n• Không nói chuyện Thiền lung tung; có khuynh hướng ở ẩn.\n• Sống giữa đời thường nhưng không tầm thường."}]}, {"part": 1, "num": 45, "title": "Tâm thức Vô vi và ứng dụng", "summary": "Vô vi là hành động thuận theo tự nhiên, trong trạng thái vô ngã và tĩnh lặng nội tâm: dấn thân hết sức nhưng không mong cầu kết quả, và uyển chuyển linh hoạt để thích nghi. Vô vi tương ứng Tầng III – Ý thức thuần khiết dẫn dắt hành vi – trong Kim tự tháp tiến hóa.", "key": "Dấn thân mạnh mẽ vào quá trình nhưng không mong cầu kết quả; thành cũng an vui mà bại cũng an vui.", "cards": [{"q": "\"Vô vi\" là gì?", "a": "Tư tưởng của Lão Tử: LÀM NHƯ KHÔNG LÀM, làm thuận theo quy luật Tạo Hóa/Tự nhiên. Mọi hành động tự nhiên, không chủ đích, không mong cầu, không có chủ thể (bản ngã) – diễn ra trong tĩnh mịch, cực sạch của Tâm Trí. Tương đồng \"VẠN SỰ TÙY DUYÊN\" của Phật giáo."}, {"q": "Vì sao \"Hãy để mọi thứ tự nhiên\" đồng nghĩa với chấp nhận?", "a": "Nó nghĩa là CHẤP NHẬN 2 MẶT CỦA MỘT VẤN ĐỀ, chấp nhận vạn vật như bản chất \"LÀ NHƯ VẬY\". Thái độ chấp nhận tạo sự bình thản, không so sánh hay mong cầu, và sinh ra MÃN NGUYỆN nội tâm."}, {"q": "Chìa khóa của Vô vi là gì? Có thể cố gắng để vô vi không?", "a": "Chìa khóa là BÌNH AN NỘI TÂM, không phải hành động ngoài thân. Không thể cố gắng để vô vi; chỉ cần Trí sáng, Tâm an thì mọi lời nói, hành động tự khắc là vô vi. Vô vi chính là THIỀN TRONG HÀNH ĐỘNG."}, {"q": "Khác biệt giữa \"Đắc nhân tâm\" xã giao và ứng xử Vô vi?", "a": "Mỉm cười, khen ngợi, lắng nghe… là phương thức xã giao làm bản ngã người khác được tôn vinh. Cao cấp nhất là TỰ NHIÊN, CHÂN THÀNH, BAO DUNG, VỊ THA, CẢM THÔNG, THẤU HIỂU – chìa khóa đích thực của Đắc nhân tâm. Khiêm tốn, tự ti, tự tin đều là biểu hiện bản ngã."}, {"q": "Ví dụ người chạy đua minh họa Vô vi thế nào?", "a": "Người vừa chạy vừa nhìn xem ai vượt mình, mong cầu đến đích nhanh – mang so sánh và mong cầu (2 gốc khổ đau). Người chỉ tập trung vào bước chạy của mình, \"ai thế nào kệ họ\", làm hết khả năng và mãn nguyện – đó là Vô vi."}, {"q": "3 tầng của Kim tự tháp tiến hóa tương ứng 3 tầng hành động?", "a": "Kim tự tháp Chân ngã – Bản ngã – Bản năng tương ứng:\n• Tầng I – BẢN NĂNG dẫn dắt hành vi.\n• Tầng II – BẢN NGÃ dẫn dắt hành vi (đa số nhân loại hiện nay).\n• Tầng III – CHÂN NGÃ: Ý THỨC THUẦN KHIẾT dẫn dắt hành vi (VÔ VI).", "d": 1}, {"q": "3 dạng bản năng?", "a": "1. Bản năng dưới sự kiểm soát, làm chủ của Ý thức.\n2. Bản năng dưới sự kiểm soát của bản ngã.\n(Dạng 1, 2 thấy ở con người.)\n3. Bản năng thuần túy, không bị kiểm soát – ở thực vật, động vật cấp thấp."}, {"q": "Đặc điểm dễ thấy của Tầng II – Bản ngã dẫn dắt hành vi?", "a": "• Cảm xúc, ý nghĩ, quan điểm dẫn dắt hành vi – \"NGHIỆP DẪN DẮT VẬN MỆNH\".\n• NỖI SỢ mất địa vị, ảnh hưởng.\n• Thích làm trung tâm, được khen.\n• Luôn có MỤC ĐÍCH hoặc mong cầu sau mọi hành vi.\n• Chiến tranh, cãi nhau, so sánh đều là sản phẩm bản ngã."}, {"q": "Đặc điểm của Tầng III – Vô vi?", "a": "Hành động \"VÔ MỤC ĐÍCH\", an lạc; dấn thân mạnh mẽ nhưng để kết quả đến tự nhiên; làm chủ Tâm Trí; chân thành, tự nhiên; không đồng hóa với thứ ngoài thân; hướng đến \"MANG LẠI PHÚC LẠC CHO NHÂN LOẠI\". Tột bậc là Giác ngộ Tâm linh."}, {"q": "Hai thuộc tính căn bản của Tự nhiên và 2 ứng dụng của Vô vi?", "a": "Thuộc tính: (1) KHÔNG CÓ MỤC ĐÍCH hay mong cầu sau sự tạo tác (như Mặt Trời chiếu sáng); (2) uyển chuyển linh hoạt cho SỰ THÍCH NGHI.\nỨng dụng: (1) dấn thân mạnh mẽ, không mong cầu kết quả; (2) tùy biến linh hoạt theo PHÙ HỢP và THỰC DỤNG."}, {"q": "Ví dụ quán phở minh họa vế \"không mong cầu kết quả\" thế nào?", "a": "Nhiệm vụ: lập kế hoạch, làm phở ngon và vệ sinh nhất, marketing, học quản trị… Không cần bận tâm \"một ngày bán bao nhiêu tô\" – kết quả là CÁI TẤT YẾU KHÁCH QUAN của một quá trình dấn thân đúng đắn, bền bỉ."}, {"q": "\"Thực dụng\" trong vế uyển chuyển linh hoạt nghĩa là gì?", "a": "Mọi việc làm, tìm hiểu phải \"dùng được\" ngoài cuộc sống lâu dài: học kiếm tiền, tư duy làm giàu, kinh doanh, đầu tư, nuôi dạy con, Tâm linh để an lạc. Trước khi học/làm, tự hỏi: điều này có thực dụng không? Đồng thời hành xử tùy đối tượng, không cứng nhắc."}]}, {"part": 1, "num": 46, "title": "Cha Trời – Mẹ Đất", "summary": "Cha Trời (vòng tròn 01 và 02) hiện hữu bên trong mỗi người và sinh ra Tâm thức; Mẹ Đất (vòng tròn 03) tạo ra thân xác. Năng lượng Biết ơn giúp thân xác câu thông với Mẹ Đất, năng lượng Đức tin giúp Tâm thức câu thông với Cha Trời.", "key": "Cha không ở ngoài bầu trời kia – Cha ở bên trong mỗi chúng ta.", "cards": [{"q": "Cha Trời và Mẹ Đất tương ứng với vòng tròn nào?", "a": "• CHA (Thượng Đế): vòng tròn số 01 và 02 – hiện hữu bên trong mỗi người, sinh ra Tâm thức.\n• MẸ ĐẤT: vòng tròn số 03 – Thân xác; tạo ra, nuôi lớn thân xác và là nơi thân xác trở về (Tứ đại)."}, {"q": "Vì sao nên gọi \"Mẹ Đất\" thay vì \"Địa Cầu\"?", "a": "\"Địa Cầu\" giống từ ngữ chỉ một tạo vật, đồ vật. Mẹ Đất sinh ra, nuôi lớn thân xác, cung cấp thức ăn, nước, chỗ trú; không gì trên thân xác mà không thuộc về Người – nên gọi bằng tên thiêng liêng hơn."}, {"q": "Làm gì khi thân xác mệt mỏi, bệnh tật?", "a": "Tìm về THIÊN NHIÊN: đi chân trần, nằm xuống đất, ôm cây, ngâm mình trong biển, tắm suối, ăn uống thứ thuộc về tự nhiên – và nói lời TẠ ƠN, CẦU NGUYỆN. Mẹ Đất sẽ chữa lành."}, {"q": "Cách cầu nguyện với Cha Trời đúng?", "a": "Nhắm mắt lại, hướng vào BÊN TRONG – đừng nhìn lên bầu trời. Cầu nguyện với sự THÀNH KÍNH, ĐỨC TIN và BIẾT ƠN, tin Cha vô điều kiện; không bỡn cợt, nói mà không tin – vì mọi vi tế nội tâm không qua mắt được Cha."}, {"q": "Năng lượng nào câu thông với Mẹ Đất, năng lượng nào với Cha Trời?", "a": "• Năng lượng BIẾT ƠN giúp Thân xác câu thông với Mẹ Đất.\n• Năng lượng ĐỨC TIN giúp Tâm thức câu thông với Cha Trời.", "d": 1}, {"q": "Lập trường của tác giả về tôn giáo trong chương này?", "a": "Sư phụ không lập ra tôn giáo hay tổ chức Tâm linh nào; chỉ giúp kết nối với Cha Trời – Mẹ Đất ngay tại bản thể mỗi người. \"Giao cảm bằng năng lượng\" chứ không phải \"đọc ngôn từ trơ trọi\"."}, {"q": "3 vòng tròn bản thể được gọi tên thế nào trong chương Cha Trời – Mẹ Đất?", "a": "• (01) Sự Tuyệt đối.\n• (02) Tâm thức Vũ Trụ – Thế giới Tâm thức.\n• (03) Hữu hình Thế giới – Thế giới các hạt vật chất.\nCha Trời ứng vòng 01–02; Mẹ Đất ứng vòng 03.", "d": 1}]}, {"part": 1, "num": 47, "title": "Đắc Đạo", "summary": "Đắc Đạo là an trú bền vững trong trạng thái Giác ngộ (Triệt ngộ), ra vào trạng thái \"vô hiện hữu\" một cách tùy thích. Kinh nghiệm ra vào trạng thái Giác ngộ quý hơn chính trạng thái ấy, như cách kiếm tiền quý hơn số tiền đang giữ.", "key": "Giác ngộ là \"phong độ\", Đắc Đạo là \"đẳng cấp\".", "cards": [{"q": "Nghĩa của \"Đắc\" và \"Đạo\"?", "a": "• Đắc: đạt được, giữ vững, thường trụ, nắm rõ.\n• Đạo: sự tuyệt đối trong thiên hình vạn trạng, Chân như, Thể tính của vạn vật (vòng tròn số 01)."}, {"q": "Phân biệt Giác ngộ và Đắc Đạo?", "a": "• Giác ngộ: \"phong độ nhất thời\" – mới chạm khoảnh khắc phủ định tuyệt đối, TẠM TRÚ trong Chân như.\n• Đắc Đạo: \"đẳng cấp là mãi mãi\" – THƯỜNG TRÚ bền vững trong Trí cực sạch, Tâm cực an, Ý thức thuần khiết."}, {"q": "Lộ trình tu tập dẫn đến Đắc Đạo?", "a": "GIẢI NGỘ → CHỨNG NGỘ → GIÁC NGỘ → ĐẮC ĐẠO. Giác ngộ có 4 tầng: Tiểu ngộ → Trung ngộ → Đại ngộ → Triệt ngộ; Đắc Đạo là tầng cao nhất – TRIỆT NGỘ."}, {"q": "Định nghĩa Đắc Đạo bằng hình ảnh \"ra vào\"?", "a": "Đắc Đạo là ra vào trạng thái \"vô hiện hữu\", hợp nhất với Cội nguồn, phủ định tuyệt đối một cách tùy thích và chủ động. Như bài toán giải đi giải lại hàng nghìn lần – vô cùng thành thục, điêu luyện."}, {"q": "Bài học \"Ở Đời\" và \"Ở Đạo\" trong pháp thoại?", "a": "• Ở Đời: cách và kinh nghiệm kiếm nhiều tiền quan trọng hơn số tiền đang nắm giữ (triệu phú tự thân phá sản khác người nghèo phá sản).\n• Ở Đạo: kinh nghiệm ra vào trạng thái Giác ngộ quan trọng hơn rất nhiều lần chính trạng thái Giác ngộ."}, {"q": "Vì sao cần mạnh dạn ra vào, mất rồi quay lại trạng thái an lạc?", "a": "Trạng thái Trí cực sáng – Tâm cực an không phải lúc nào cũng giữ được; khi mất đi thì \"cái cách để quay lại\" quý hơn thành tựu. Lên xuống liên tục tạo nên SỰ GIÀ GIẶN CỦA LINH HỒN trước khi an trú bền vững."}, {"q": "Đắc Đạo có phụ thuộc tuổi tác, xuất gia hay tôn giáo không?", "a": "Không. Đắc Đạo diễn ra BÊN TRONG NỘI TÂM, không nằm ở bình diện thân xác hay thế giới bên ngoài (tiền bạc, địa vị…); thể hiện ở việc luôn giữ vững trạng thái \"bình lặng tuyệt đối\"."}, {"q": "Người Đắc Đạo sống thế nào sau khi Đắc Đạo?", "a": "Vẫn như người bình thường: đói ăn, khát uống, mệt ngủ, lao động chân chính nuôi gia đình. Khác biệt chỉ trong Tâm thức: bình lặng tuyệt đối, an yên tự tại; uyển chuyển linh hoạt, thuận theo tự nhiên, không bận tâm người khác nghĩ gì."}, {"q": "Ai là người Đắc Đạo và ai nhận ra được?", "a": "\"Không ai cả\" – người Đắc Đạo là ĐẤNG KHÔNG TÊN, VÔ ĐỊNH NGHĨA, chấm dứt mọi định nghĩa \"Ta là\". Chỉ người Đắc Đạo mới biết chính xác ai Đắc Đạo, vì nó nằm ở bình diện năng lượng nguyên thủy, không ở ngôn ngữ."}, {"q": "Lời cuối của Sư phụ khép lại Phần I dặn điều gì?", "a": "Đừng cố phân tích hay ghi nhớ ngôn từ về Giác ngộ tuyệt đối; hãy để ngôn từ lướt qua tâm hồn. SỰ THÀNH KÍNH và TÍN TÂM giúp thấm thấu tinh hoa vô hình. Phần II là các bài tập Thiền và ứng dụng cụ thể."}]}, {"part": 2, "num": 1, "title": "Sơ đồ tổng quan pháp thiền “Tất Cả Chỉ Là Ý Nghĩ”", "summary": "Sơ đồ tổng quan Pháp Thiền \"Tất Cả Chỉ Là Ý Nghĩ\" gồm 2 phạm trù với 7 phương tiện thực hành, dẫn đệ tử qua 4 giai đoạn tiến hóa Ý thức, cuối cùng trú ngụ trong trạng thái \"Trước khi Vũ Trụ hình thành\".", "key": "Cốt lõi của Phạm trù II là tín tâm tuyệt đối vào tâm pháp: \"Cái gì nhận ra được thì không phải là Ta\".", "cards": [{"q": "Sơ đồ thực hành Pháp Thiền khái quát những phạm trù nào?", "a": "• Phạm trù I – Nằm trong Ý thức: Giai đoạn Khai Tâm và Tỉnh thức/Tỉnh thức cao độ; gồm 4 phương tiện.\n• Phạm trù II – Nằm ngoài Ý thức: Ý thức đã tiến hóa vượt ngưỡng, dành cho Thượng căn; gồm 3 phương tiện."}, {"q": "4 phương tiện thực hành của Phạm trù I?", "a": "1. Phương pháp \"Quán\" (nhận biết): Dọn rác, 5 bước Tỉnh thức, Quán Tâm – Quán Trí.\n2. \"Trực diện với hiện hữu\".\n3. \"Tự vấn\": Đó là Ta sao? Ai đang hiện hữu? Cái gì gọi là Ta?\n4. \"Thuận theo tự nhiên\" (sự buông xả của Ý thức)."}, {"q": "3 phương tiện thực hành của Phạm trù II?", "a": "5. \"Phủ định tuyệt đối\": dùng chân ngôn như \"Nằm ngoài mọi hiện hữu\", \"Cái gì nhận ra được thì không phải là Ta\".\n6. \"Trầm mặc\": ngồi im lặng một mình đối diện câu hỏi \"không lời giải đáp\" (trước khi Vũ Trụ hình thành, chết ngay lúc này...).\n7. Cầu nguyện và Biết ơn."}, {"q": "Mục đích của các cách thực hành trong Phạm trù I?", "a": "Gia tăng sự sáng của Ý thức (khả năng nhận biết dao động trong Tâm Trí), tiến đến làm chủ Tâm Trí và thuyên giảm các trược năng lượng thô trong Tâm thức."}, {"q": "4 giai đoạn tiến hóa Ý thức qua thực hành Pháp Thiền?", "a": "1. Khai Tâm: tách Ý thức khỏi sự dẫn dắt của Tâm Trí.\n2. Ý thức tách rời hoàn toàn nhờ \"chứng kiến liên tục\"; nghiệp lực tan, Trí dần im lặng.\n3. Trí thanh tịnh hoàn toàn, Tâm tĩnh lặng nguyên thủy, Ý thức thuần khiết.\n4. Vượt ra ngoài Ý thức, trú ngụ trong trạng thái \"Trước khi Vũ Trụ hình thành\"."}, {"q": "Ai có thể cảm thụ được Phạm trù II?", "a": "Không dành cho tất cả đệ tử. Chỉ những ai tín tâm sâu sắc, lòng nhiệt thành và Đức tin to lớn. Ai cảm thụ được tâm pháp \"Cái gì nhận ra được thì không phải là Ta\" sẽ cảm thụ hết lời Sư phụ dạy – đó là lúc ấn chứng tiến hóa Tâm linh."}, {"q": "Theo sơ đồ, các kỹ thuật thiền ứng với giai đoạn nào?", "a": "• GĐ I – Khai Tâm: Dọn rác Tâm Trí → 5 bước tỉnh thức (gia tăng khả năng tỉnh thức, tách Ý thức khỏi dao động nội tâm).\n• GĐ II–III – Tỉnh thức cao độ: Quán Tâm, Quán Trí → Quán về \"Cái gọi là Ta\".\n• GĐ IV – Vượt ra ngoài Ý thức: Thuận theo tự nhiên và Sự phủ định mọi hiện hữu.", "d": 1}, {"q": "Đặc điểm Giai đoạn II–III và Giai đoạn IV theo sơ đồ?", "a": "• II–III: Ý thức tách khỏi hình tướng, thành \"nhân chứng\"; Tâm Trí thanh tịnh, im lặng, được làm chủ hoàn toàn; bắt đầu ý thức về sự tồn tại của \"Cái gọi là Ta\".\n• IV: mọi hình tướng, tên gọi, hiện hữu trở nên vô nghĩa; Tánh Biết và Ý thức tan biến, hợp nhất cõi Im lặng tuyệt đối; Giác Ngộ mở ra.", "d": 1}, {"q": "Cuối cùng của Pháp là gì?", "a": "• Hợp nhất thể với trạng thái \"Trước khi Vũ Trụ hình thành\"\n• Hợp nhất thể với \"Không có\"\n• Hợp nhất thể với \"Không tồn tại\"", "d": 1}]}, {"part": 2, "num": 2, "title": "Chín tâm pháp nền tảng", "summary": "Chương trình bày 9 Tâm Pháp cốt lõi làm nền cho toàn bộ Pháp Thiền, từ \"Tất cả chỉ là ý nghĩ – Ta nằm ngoài mọi ý nghĩ\" đến \"Nhập vào trạng thái trước khi Vũ Trụ hình thành\"; trong đó Tâm Pháp VI \"Cái gì nhận ra được thì không phải là Ta\" là trung tâm.", "key": "Ta nằm ngoài mọi ý nghĩ – ta chưa bao giờ là những điều ta nghĩ.", "cards": [{"q": "Liệt kê 9 Tâm Pháp nền tảng.", "a": "I. Tất cả chỉ là ý nghĩ – Ta nằm ngoài mọi ý nghĩ\nII. Nhìn thẳng/Đối diện/Trực diện với mọi hiện hữu\nIII. Bất tận của sự bất tận... (Sự Tuyệt đối)\nIV. An trú trong tĩnh tại, thị hiện \"tính cách Vũ Trụ\"\nV. Cầu nguyện và thực hành cầu nguyện\nVI. Cái gì nhận ra được thì không phải là Ta\nVII. Còn Ta thì còn cái khác Ta\nVIII. Nằm ngoài mọi hiện hữu – Không tồn tại – Không có\nIX. Nhập vào trạng thái trước khi Vũ Trụ hình thành"}, {"q": "\"Tất cả chỉ là ý nghĩ\" có nghĩa là gì?", "a": "Mọi quan điểm, khổ đau, thành kiến, suy diễn, nặng nề, mệt mỏi trong cuộc sống đều do \"ý nghĩ\" tạo thành. Ý nghĩ tiêu cực → quan điểm, hành xử, kết quả tiêu cực; ý nghĩ tích cực → tích cực. \"Cực sạch mọi ý nghĩ\" → Tâm Trí im lặng, cái nhìn khách quan không phán xét."}, {"q": "Cơ chế một ý nghĩ chi phối hành động?", "a": "Lặp đi lặp lại một ý nghĩ → gia tăng \"năng lượng sống\" của nó → đủ mạnh thì hình thành niềm tin, khát vọng, mong muốn mãnh liệt → kiểm soát hành vi, thái độ của thân xác → hành động diễn ra. Kỹ thuật này gọi là tự kỷ ám thị hay NLP."}, {"q": "Vì sao bận tâm \"người khác nghĩ gì về mình\" là sai lầm?", "a": "Đó chỉ là ý nghĩ cá nhân, \"đống rác\" trong đầu người đó. Bận tâm vào nó làm hao tổn năng lượng nguyên thủy, khiến ta tìm cách làm vừa lòng và sợ bị nghĩ xấu, làm bản ngã cường điệu và nội tâm thêm khổ."}, {"q": "Ý thức khác Ý nghĩ thế nào? Tỉnh thức là gì?", "a": "Ý nghĩ là sản phẩm của Trí. Ý thức là công cụ chứng kiến, nhận ra sự xuất hiện của mọi ý nghĩ và tự thân nằm ngoài mọi ý nghĩ. Rèn khả năng nhận ra từng ý nghĩ thì Ý thức sáng suốt, làm chủ Tâm Trí – đó là Sự Tỉnh thức."}, {"q": "\"Nghiệp nặng\" theo Tâm Pháp I là gì?", "a": "Khi lớp màn ý nghĩ dày đặc (tạp niệm quá nhiều), như mây đen che trời: Ý thức mất dần khả năng làm chủ Tâm Trí; \"Nghiệp – năng lượng của dòng chảy ý nghĩ\" dẫn dắt ngược lại hành vi, đau khổ chồng chất. Nặng nhất là mất hẳn khả năng làm chủ Tâm Trí."}, {"q": "Câu \"Tôi chính là những gì tôi nghĩ\" cần sửa thành gì?", "a": "\"Ta nằm ngoài mọi ý nghĩ. Ta kiểm soát mọi ý nghĩ để trở thành phương tiện sáng tạo và trải nghiệm cuộc sống. Chứ ta chưa bao giờ là những điều ta nghĩ.\" Câu gốc tạo ra sự đồng hóa \"Ta là\" với suy nghĩ – gốc của khổ đau và bản ngã."}, {"q": "Tâm Pháp II: \"Nhìn thẳng, đối diện, trực diện\" là gì?", "a": "Thành thật nhận ra sự có mặt của mọi chuyển động nội tâm, dù là gì. Không che ý nghĩ tiêu cực bằng ý nghĩ tích cực (\"rác chồng thêm rác\"), không né tránh. Chăm chú nhận biết – \"sự sáng của Ý thức\" chiếu rọi sẽ hóa giải khối năng lượng tồn đọng, hóa giải nghiệp lực."}, {"q": "Tâm Pháp III và VIII nói về điều gì?", "a": "Đều nói đến \"Sự Tuyệt đối\" trong thiên hình vạn trạng. Tâm Pháp III đại diện \"Vòng tròn số 01\", nói về Tánh Không, Chân như, sự phủ định tuyệt đối mọi tồn tại. Tâm Pháp VIII: \"Nằm ngoài mọi hiện hữu\" dùng làm chú; \"Không tồn tại, Không có\" phục vụ Trầm mặc với cái chết."}, {"q": "Tâm Pháp IV mô tả điều gì và dùng thế nào?", "a": "Mô tả đời sống người Giác ngộ: bình thường (đói ăn, mệt nghỉ) nhưng nội tâm an lạc, thường trú chứ không tạm trú. Là ấn chứng và kim chỉ nam: nếu nội tâm ngày càng nặng nề, bấn loạn – trái với Tâm Pháp IV – tức là đã đi sai đường."}, {"q": "4 nguồn năng lượng chữa lành và vai trò của cầu nguyện (Tâm Pháp V)?", "a": "1. Sự sáng Ý thức\n2. Năng lượng Tình yêu\n3. Năng lượng Biết ơn\n4. Đức tin\nThiền định tăng nguồn 1; cầu nguyện mỗi ngày nuôi 3 nguồn còn lại, nên lợi ích \"gấp 3 lần\" Thiền định. Cầu nguyện thể hiện biết ơn, thành kính với Tạo Hóa."}, {"q": "Vì sao Tâm Pháp VI là trung tâm của Pháp Thiền?", "a": "\"Cái gì nhận ra được thì không phải là Ta\" phủ định mọi đồng hóa, gán ghép, tạo trạng thái \"vô định nghĩa\" về Ta, làm bản ngã sụp đổ. Là pháp bảo, câu cửa miệng, dùng làm chú niệm liên tục; ngộ được coi như đắc pháp."}, {"q": "Tâm Pháp VII \"Còn Ta thì còn cái khác Ta\" dạy gì?", "a": "Mọi biên dựng Tâm Trí xoay quanh chữ \"Ta\": còn Ta thì còn muốn thần thông, cảnh giới cao, giác ngộ... \"Hết Ta rồi\" thì ai muốn? Ngộ được thì hết vướng bận, chấp nhận mọi thứ như bản chất của nó. Người Giác ngộ: \"rất an lạc nhưng không có ai an lạc\"."}]}, {"part": 2, "num": 3, "title": "Tổng hợp những nguyên lý cốt lõi của “Thiền”", "summary": "\"Nguyên lý\" là trật tự vận hành của sự vật; Thiền cũng có nguyên lý, nắm được thì thiền mọi lúc mọi nơi. Chương nêu 7 nguyên lý làm nền cho mọi kỹ thuật thiền của Pháp.", "key": "Trước khi hành động đúng thì phải hiểu đúng.", "cards": [{"q": "\"Nguyên lý\" là gì?", "a": "• \"Nguyên\": nguyên bản, nguyên vẹn – bản chất của sự vật, hiện tượng.\n• \"Lý\": sự diễn đạt, mô tả cái bản chất đó.\n→ Nguyên lý là một trật tự nhất định vận hành của sự vật hiện tượng; nắm và hành động theo trật tự đó thì tự nhiên thành công (vd: nguyên lý Giàu có, Bán hàng).", "d": 1}, {"q": "Vì sao phải nắm nguyên lý của Thiền?", "a": "Nắm được nguyên lý thì thực hành đơn giản, thiền được mọi lúc mọi nơi. Không nắm nguyên lý thì chỉ bắt chước hình thức bên ngoài, không tiến bộ, không tạo ra an lạc và trí huệ."}, {"q": "2 điều kiện để \"hiểu đúng\"?", "a": "1. Được Minh Sư khai thị (Ý thức tiến hóa bậc cao hướng dẫn).\n2. Tự thân trải nghiệm (chứng ngộ): hành động mạnh mẽ để trải nghiệm qua mọi lý thuyết."}, {"q": "7 nguyên lý của Thiền trong Pháp \"Tất Cả Chỉ Là Ý Nghĩ\"?", "a": "1. Đi từ sự chứng kiến đến vượt ra ngoài sự chứng kiến\n2. Thiền là trải nghiệm của Ý thức\n3. Hành trình gia tăng \"sự sáng của Ý thức\"\n4. Đưa Ý thức nằm ngoài mọi hiện hữu\n5. Sự chữa lành tự động của Tâm Trí\n6. Phủ định tuyệt đối mọi hình tướng\n7. Tiệm ngộ và Đốn ngộ"}, {"q": "Từ 7 nguyên lý sinh ra những kỹ thuật thiền nào?", "a": "Dọn rác Tâm Trí, 5 bước Tỉnh thức, Quán Tâm – Quán Trí, Quán về \"Cái gọi là Ta\", Trầm mặc với \"Cái chết\"... đều dựa trên 7 nguyên lý."}, {"q": "Thứ bậc từ Tạo Hoá đến hành động theo sơ đồ?", "a": "1. Tạo Hoá (Thượng Đế)\n2. Quy luật Vũ Trụ\n3. Nguyên lý\n4. Quy trình\n5. Checklist (hành động thực thi)", "d": 1}]}, {"part": 2, "num": 4, "title": "Thiền và tư thế", "summary": "Bán già và Kiết già là hai tư thế chuẩn của Tọa Thiền, nhưng bản chất của Thiền không nằm ở tư thế mà ở hành trình nội tâm – đưa Ý thức hướng nội rồi vượt thoát chính sự chú ý đó.", "key": "Thiền không chú trọng ngồi bao lâu mà chú trọng chất lượng mỗi lần tọa thiền.", "cards": [{"q": "Phân biệt tư thế Bán già và Kiết già?", "a": "• Bán già: một chân đặt lên đùi chân kia; phổ biến nhất, ai cũng ngồi được.\n• Kiết già: bàn chân trái lên đùi phải, bàn chân phải lên đùi trái; vững chãi nhưng không phải ai cũng ngồi được.\nCả hai: thẳng lưng, thẳng đầu, tay đặt chồng, hai ngón cái chạm nhau, thả lỏng."}, {"q": "Vì sao Bán già và Kiết già được gọi là tư thế \"chuẩn\"?", "a": "Giúp ngồi được lâu nhất, khí huyết lưu thông dễ nhất và dễ đưa sự chú ý vào nội tâm. Ngoài ra có thể ngồi tự do, dựa tường, ngồi ghế đều được."}, {"q": "Bản chất của Thiền nằm ở đâu?", "a": "Ở hành trình nội tâm và trải nghiệm của Ý thức (Vòng tròn 01 và 02), không ở tư thế thân xác. Mục đích: điều ngự Tâm Trí đến \"yên tĩnh tuyệt đối\", cao hơn là đưa Ý thức vượt thoát mọi tồn tại của vật chất và năng lượng."}, {"q": "4 trạng thái căn bản của Ý thức?", "a": "1. Hướng ngoại\n2. Bị cuốn trôi theo suy tưởng của Trí, cảm xúc của Tâm (phổ biến nhất)\n3. Hướng nội – khởi đầu của Thiền định, dễ thức tỉnh Tâm linh nhất\n4. Sự buông xả của Ý thức (chấp nhận mọi thứ \"là như vậy\")"}, {"q": "Lộ trình luyện Thiền thành thói quen?", "a": "Tọa thiền tư thế chuẩn, tăng dần thời lượng → thiền mở mắt → thiền nhắm mắt → vừa đi vừa thiền → vừa nhìn mắt người khác, vừa nói chuyện, vừa thuyết trình vừa thiền → thiền mọi lúc, mọi nơi."}, {"q": "Thế nào là \"chất lượng\" trong Thiền định?", "a": "Mỗi lần tọa thiền gột rửa được ô trược bám dính Tâm thức: Trí thanh tịnh, Tâm bình an, nhẹ nhàng, im lặng hơn. Chất lượng phản ánh khả năng thấu hiểu lời dạy; không hiểu thì \"ngồi 100 năm\" cũng không chuyển hóa."}, {"q": "3 vòng tròn cấu tạo theo sơ đồ là gì?", "a": "(01) \"Sự Tuyệt đối\" – vòng trong cùng\n(02) \"Thế giới Nội tâm\" (Thế giới Tâm thức)\n(03) \"Thân xác\" (Thế giới các hạt vật chất) – vòng ngoài cùng", "d": 1}]}, {"part": 2, "num": 5, "title": "“Dọn rác tâm trí”", "summary": "\"Dọn rác Tâm Trí\" là phương pháp \"nhận ra\" và \"ghi xuống\" mọi ý nghĩ, cảm xúc theo từng phạm trù cho đến khi không còn gì để ghi; chìa khóa không phải việc ghi mà là khả năng nhận biết – sự sáng của Ý thức hóa giải tạp niệm.", "key": "\"Nhận biết\" dao động nội tâm mới là chìa khóa, chứ không phải việc \"ghi xuống\".", "cards": [{"q": "Chuẩn bị cho bài \"Dọn rác Tâm Trí\"?", "a": "1. Ngồi nơi yên tĩnh, tắt hết thiết bị điện tử.\n2. Ngồi thả lỏng (dựa ghế, hoặc bán già/kiết già).\n3. Mở mắt, không nhắm (tránh hôn trầm).\n4. Chuẩn bị giấy bút."}, {"q": "7 phạm trù thực hành \"nhận ra và ghi xuống\"?", "a": "I. Ngay lúc này\nII. Tương lai\nIII. Quá khứ\nIV. Gia đình (ba mẹ, vợ/chồng, từng đứa con)\nV. Sự nghiệp\nVI. Bản thân\nVII. Một người mà \"mình rất ghét\" (nếu có)\nMỗi phạm trù ghi cho đến khi không còn gì để ghi."}, {"q": "2 nguyên lý của Dọn rác Tâm Trí?", "a": "1. Sự chữa lành tự động của Tâm Trí: qua sinh khởi tạp niệm, khổ đau, năng lượng thô trược được phóng thích và tan về nguyên năng.\n2. Khả năng \"vô cấu nhiễm\" của Ý thức: Ý thức không nhiễm bẩn vào hình tướng, có khả năng nhận ra, chứng kiến mọi dao động."}, {"q": "Mục đích thật sự của việc \"ghi xuống\"?", "a": "Không phải để làm tạp niệm biến mất, mà là mẹo để Ý thức không bị cuốn trôi, gia tăng khả năng nhận biết và quan sát nội tâm. Khả năng quan sát nhạy bén đến đâu, tạp niệm thuyên giảm đến đó."}, {"q": "Vì sao liên tục \"nhận ra\" lại hóa giải tạp niệm?", "a": "\"Liên tục nhận ra\" là Ý thức liên tục chiếu rọi sự sáng của nó lên hình tướng. Sự sáng của Ý thức là 1 trong 4 nguồn năng lực \"bất khả tư nghị\" (cùng Tình yêu, Biết ơn, Đức tin) có khả năng chữa lành và xóa nghiệp."}, {"q": "Tâm Trí miên man, nặng nề báo hiệu điều gì?", "a": "Tâm Trí đang giải phóng năng lượng tồn đọng ô uế, tìm cách trở về sự im lặng; báo hiệu \"Tâm Trí đang bị ô nhiễm năng lượng\". Lúc ấy hãy dừng việc lại và bắt đầu \"dọn rác\"."}, {"q": "\"Dọn rác chủ động\" với một người/việc thực hiện thế nào?", "a": "Chủ động nhắc đến người/việc đang vướng bận, ghi hết mọi ý nghĩ, cảm xúc liên quan cho đến khi nhắc tới mà Tâm Trí cực sạch, thanh tịnh. Đó là lúc \"Nghiệp liên đới\" với người/việc đó được hóa giải hết."}, {"q": "Bài dọn rác buổi sáng và buổi tối?", "a": "• Sáng: tĩnh lặng 30 phút–1 giờ, quan sát và ghi đến khi Tâm Trí im lặng rồi mới bắt đầu ngày mới.\n• Tối: 30 phút–1 giờ trước ngủ, chủ yếu ghi những gì tương tác trong ngày, đến khi im lặng thì đi ngủ.\nĐệ tử Nhập môn thực hành mỗi ngày 3–6 tháng."}, {"q": "Một số trải nghiệm tích cực thường thấy?", "a": "• Tạp niệm thuyên giảm, quan sát nội tâm sắc hơn\n• Làm chủ cảm xúc, điềm tĩnh hơn\n• Yêu thích hướng nội, ở một mình\n• Không bận tâm người khác nghĩ gì\n• Cảm nhận được năng lượng người khác\n• Thông minh, tập trung hơn; cảm nhận \"phút giây hiện tại\""}, {"q": "2 trải nghiệm tiêu cực thường gặp và nguyên nhân?", "a": "1. Càng ghi càng nhiều tạp niệm, nặng nề: do bị cuốn theo suy tưởng thay vì nhận biết sự có mặt của nó.\n2. Không có tín tâm, hoài nghi, so sánh, xem thường: thực hành không tác dụng, \"cổng kết nối\" đóng lại. Chỉ cần tín tâm thì tự động kết nối."}, {"q": "Sơ đồ \"Lăng kính Tâm Trí\" trong Dọn rác vận hành thế nào?", "a": "\"Chàng trai\" (hay \"Ta là\") hướng về từng phạm trù (Ngay lúc này, Tương lai, Quá khứ, Gia đình, Sự nghiệp, Bản thân, Người mình ghét, việc/ai đó vướng bận) qua lăng kính Tâm Trí, tự hỏi:\n• Ý nghĩ / Cảm xúc / Hình ảnh gì hiện hữu?\n• Có hình dung hay nghĩ ngợi điều gì không?\n→ Bất cứ gì xuất hiện: \"Nhận ra\" và \"Ghi xuống\"!", "d": 1}]}, {"part": 2, "num": 6, "title": "Thực hành: 5 bước tỉnh thức", "summary": "\"5 bước tỉnh thức\" là bước kế thừa Dọn rác: tự hỏi \"Ngay lúc này, điều gì đang hiện hữu trong Tâm Trí?\", nhận ra và trả lời thành thật, lặp lại đến khi không còn gì để nhận ra – lúc nhập định. Pháp này bắt đầu với thiền mở mắt rồi mới đến nhắm mắt.", "key": "Nhận ra cho đến khi không còn gì để nhận ra nữa – ấy là lúc nhập định.", "cards": [{"q": "5 bước tỉnh thức gồm những bước nào?", "a": "1. Tự hỏi: \"Ngay lúc này, điều gì đang hiện hữu trong Tâm Trí?\"\n2. \"Nhận ra\" và \"Trả lời\"\n3. Quay lại bước 01\n4. Quay lại bước 02\n5. Kéo dài đến bất tận"}, {"q": "Ý nghĩa của Bước 01?", "a": "Câu hỏi đưa Ý thức hướng nội, thay vì bị cuốn trôi theo suy tưởng thì bắt đầu nhận ra, chứng kiến từng ý nghĩ, cảm xúc. Giúp gia tăng khả năng nhận biết hình tướng và tách Ý thức khỏi chuyển động nội tâm."}, {"q": "Điều quan trọng nhất của Bước 02 \"Nhận ra và Trả lời\"?", "a": "Sự thành thật. Chỉ nhận ra thì vẫn bị cuốn trôi; phải trả lời rõ ràng điều đang hiện hữu, kể cả tiêu cực. Ví dụ: \"lúc này, đang đố kỵ\", \"đang lo lắng cho tương lai\", \"đang sợ hãi\" – không chối bỏ, né tránh."}, {"q": "\"Kéo dài đến bất tận\" là đến khi nào?", "a": "Đến khi \"không còn gì để nhận ra và trả lời được nữa\" – Tâm Trí cực sạch. Khi ấy sự nhận ra và khả năng nhận ra cũng biến mất: đó là lúc nhập định, Ý thức trở về cội nguồn, năng lượng nguyên thủy được kích hoạt."}, {"q": "Khi gặp hình tướng mơ hồ, ảo ảnh Tâm linh trong Tiềm thức thì làm gì?", "a": "Lúc ấy 5 bước tỉnh thức không còn hiệu quả. Hãy tín tâm tuyệt đối và lặp lại Tâm Pháp \"Cái gì nhận ra được thì không phải là Ta\" – Ý thức sẽ tự vượt thoát ra ngoài vật chất và năng lượng."}, {"q": "3 sự lầm tưởng về \"Mắt Trí Huệ\"? Bản chất thật là gì?", "a": "Lầm tưởng nó là:\n1. Ấn đường (giữa hai chân mày)\n2. Tuyến tùng giữa não\n3. Luân xa thứ 6\nThực chất \"Mắt Trí Huệ\" chính là Ý thức – công cụ \"nhận biết đơn thuần\" (Tính Biết)."}, {"q": "Phân biệt thiền mở mắt và thiền nhắm mắt?", "a": "• Mở mắt: hai cặp mắt (mắt thịt và Mắt Trí Huệ) cùng mở; khó hơn nhưng là tiền đề để thiền mọi lúc mọi nơi, ít hao năng lượng khi sinh hoạt. Pháp này bắt đầu bằng mở mắt.\n• Nhắm mắt: đóng cửa chú ý ra ngoài, dễ nhập định, tăng và bảo tồn năng lượng tốt hơn, nhưng dễ hôn trầm.\nCần luân phiên cả hai."}, {"q": "Các bước tọa thiền 5 bước tỉnh thức?", "a": "1. Ngồi bán già/kiết già, thả lỏng, thẳng lưng, mở (hoặc nhắm) mắt suốt buổi.\n2. Ngồi lặng im 5 phút, không dùng kỹ thuật nào.\n3. Áp dụng 5 bước tỉnh thức đến khi \"không còn gì để nhận ra\"."}, {"q": "6 bài tập \"5 bước tỉnh thức\" nâng cao?", "a": "1. Khi nhìn vào mắt người khác\n2. Ở chốn đông người\n3. Khi giao tiếp, thuyết trình\n4. Khi lái xe, đi đường\n5. Khi nghe nhạc DJ, Remix, nhạc có lời, sôi động, dance, rock...\n6. Mọi lúc, mọi nơi", "d": 1}, {"q": "Mục đích các bài tập nâng cao 02–05 của 5 bước tỉnh thức?", "a": "• 02 (đông người): kiểm chứng, gia tăng định lực Tỉnh thức khi tiếp xúc đời sống xã hội.\n• 03 (giao tiếp): Tâm Trí im lặng, giao tiếp tự nhiên, chân thành, không xã giao hay phán xét.\n• 04 (lái xe): Ý thức hướng nội liên tục, không bị kéo theo suy tưởng.\n• 05 (nghe nhạc): huân tập thói quen hướng nội liên tục.", "d": 1}]}, {"part": 2, "num": 7, "title": "Thực hành: Quán Tâm, quán Trí", "summary": "Quán Tâm, Quán Trí là kế thừa của 5 bước tỉnh thức: khi sự nhận biết dao động nội tâm diễn ra tự động không cần câu hỏi, liên tục nhận ra và hiểu rằng \"Đó không phải là Ta\".", "key": "Hướng nội liên tục là con đường duy nhất của sự tỉnh thức.", "cards": [{"q": "Định nghĩa \"Quán\", \"Tâm\", \"Trí\"?", "a": "• Quán: nhận ra, nhận biết, quan sát, chứng kiến.\n• Tâm: vùng không gian chứa năng lượng Tâm thức, biểu hiện cảm xúc, tình cảm, trạng thái.\n• Trí: công cụ sản sinh ý nghĩ, hình ảnh qua tư duy, tưởng tượng."}, {"q": "Thế nào là Quán Tâm và Quán Trí?", "a": "• Quán Trí: liên tục nhận ra ý nghĩ, ý niệm, ý muốn, sự tư duy.\n• Quán Tâm: liên tục nhận ra cảm xúc, trạng thái, tình cảm, thái độ.\nKèm hiểu rằng \"Đó không phải là Ta\". Hai cái đi đôi nên gọi tắt là Quán Tâm Trí."}, {"q": "Quan hệ giữa 5 bước tỉnh thức và Quán Tâm Trí?", "a": "Thực hành 5 bước lâu ngày tạo thói quen hướng nội liên tục; khi sự nhận biết dao động nội tâm diễn ra tự động, không cần câu hỏi nữa – đó là đang Quán Tâm Trí. 5 bước càng rốt ráo, chuyển sang Quán Tâm Trí càng dễ."}, {"q": "Cái gì đang quan sát Tâm Trí?", "a": "Ý thức – chiếc gạch nối giữa Vòng tròn 01 \"Sự Tuyệt đối\" và Vòng tròn 02 \"Tâm thức\" (Tâm Trí, thế giới nội tâm); công cụ nhận biết, chứng kiến của linh hồn và kiểm soát sự vận hành của Tâm Trí.", "d": 1}, {"q": "Khi nào không còn Quán Tâm Trí nữa?", "a": "Khi sự chú ý bị hướng ra bên ngoài: phán xét, đánh giá người khác hay sự việc, hơn thua, ghen ăn tức ở. Khi đó năng lượng hao tổn; còn khi quán Tâm Trí thì nội lực giữ vững, nội tâm ổn định."}, {"q": "Bài tập Thiền Quán Tâm Trí mở mắt?", "a": "1. Ngồi bán già/kiết già, mở mắt suốt buổi.\n2. Lặng im 5 phút.\n3. Ráo riết nhận ra mọi ý nghĩ, cảm xúc, dòng suy tư, hình ảnh – luôn nhớ \"cái gì nhận ra được đều là một dạng hình tướng\".\nThực hành 30 phút–1 giờ mỗi ngày."}, {"q": "Nếu Quán Tâm Trí mà rơi vào hôn trầm thì sao?", "a": "Nghĩa là sự sáng của Ý thức còn thấp, nhận biết chưa sắc nét. Cần quay lại thực hành 5 bước tỉnh thức cho điêu luyện hơn trước khi chuyển sang thực hành cao cấp này."}, {"q": "6 bài tập Thiền Quán Tâm Trí?", "a": "1. Mở mắt, nơi yên tĩnh, tư thế chuẩn\n2. Nhắm mắt, nơi yên tĩnh, tư thế chuẩn\n3. Mở/nhắm mắt ở nơi ồn ào, náo nhiệt, đông người\n4. Mở mắt khi thuyết trình, giao tiếp\n5. Mở/nhắm mắt khi nghe nhạc DJ, Remix, sôi động\n6. Mọi lúc, mọi nơi", "d": 1}, {"q": "Mục đích các bài tập Quán Tâm Trí 02–05?", "a": "• 02 (nhắm mắt): Ý thức dồn 100% vào chuyển động nội tâm, không hướng ra hình tướng ngoài thân.\n• 03 (đông người): kiểm chứng, gia tăng định lực tỉnh thức.\n• 04 (giao tiếp): Tâm Trí im lặng, hành xử tự nhiên, chân thành, không phán xét.\n• 05 (nghe nhạc): luyện nhận biết dao động nội tâm khi âm thanh tác động.", "d": 1}]}, {"part": 2, "num": 8, "title": "Thực hành thiền: “Quán về cái gọi là Ta”", "summary": "Quán về \"Cái gọi là Ta\" (Tự vấn) dành cho Ý thức đã tách rời Tâm Trí: nhận ra hình tướng rồi tự hỏi \"Chẳng lẽ đó là Ta sao?\", \"Ai đang hiện hữu?\" để phá vỡ cấu trúc [\"Ta là\" + \"bất cứ điều gì đó\"] của bản ngã.", "key": "Hạnh phúc nhưng không còn ai hạnh phúc; an lạc nhưng không còn ai an lạc.", "cards": [{"q": "Điều kiện để thực hành Thiền Tự vấn?", "a": "Ý thức đã tách rời hoàn toàn khỏi Tâm Trí, không còn bị hình tướng dẫn dắt, nhận biết dao động vô cùng sắc sảo (Thượng căn). Muốn vậy phải rốt ráo Dọn rác, 5 bước tỉnh thức, Quán Tâm Trí trong thời gian dài."}, {"q": "Nếu tự vấn không tạo ra tỉnh thức thì dùng chú nào?", "a": "Niệm liên tục một trong 3 câu:\n1. Nằm ngoài mọi hiện hữu\n2. Cái gì nhận ra được thì không phải là Ta\n3. Đó không phải là Ta"}, {"q": "Phật giáo gọi Thiền Tự vấn là gì? Ví dụ tiêu biểu?", "a": "Tham thoại đầu, tham thoại hay công án. Ví dụ: Bát-Nhã-Đa-La hỏi Bồ-Đề-Đạt-Ma: \"Trước khi Trời Đất sinh ra, Ta là ai? Khi Trời Đất sinh ra rồi, Ai là Ta?\"; Tăng Xán hỏi Đạo Tín: \"Ai trói ngươi?\" – \"Chẳng ai cả\" – \"Vậy sao lại muốn giải thoát?\""}, {"q": "Cấu trúc hình thành \"Cái gọi là Ta\" là gì?", "a": "[\"TA LÀ\" + \"BẤT CỨ ĐIỀU GÌ ĐÓ\"] – hình thành bởi sự đồng hóa và tổ hợp các hình tướng trong nội tâm. Mọi kỹ thuật thiền và Tâm Pháp của Pháp đều là sự phủ định tuyệt đối cấu trúc này."}, {"q": "Quán vị ngữ và quán chủ ngữ khác nhau thế nào?", "a": "• Nhận biết vị ngữ [bất cứ điều gì đó] = Quán Tâm Trí (quán hình tướng), hỏi \"Chẳng lẽ đó là Ta sao?\".\n• Khi vị ngữ tan, Tâm Trí thanh tịnh, hỏi \"Cái gì gọi là Ta? Ai đang hiện hữu?\" – tác động thẳng vào chủ ngữ [Ta là]."}, {"q": "Cốt tủy câu hỏi của Quán về \"Cái gọi là Ta\" khác 5 bước tỉnh thức ra sao?", "a": "5 bước và Quán Tâm Trí xoay quanh \"Điều gì đang hiện hữu trong Tâm Trí?\"; Quán về \"Cái gọi là Ta\" xoay quanh \"AI? Ai đang hiện hữu?\" – đi sâu hơn, đưa Ý thức thẳng vào sự tồn tại của bản ngã."}, {"q": "Ví dụ áp dụng câu hỏi \"Ai?\"", "a": "• Bất an → Ai đang bất an?\n• Tạp niệm → Ai đang nghĩ ngợi?\n• Lo lắng → Ai đang lo lắng?\n• Muốn Giác ngộ → Ai muốn Giác ngộ?\n• Muốn thành Phật → Ai muốn thành Phật?"}, {"q": "Bài tập Quán về \"Cái gọi là Ta\" mở mắt?", "a": "1. Ngồi bán già/kiết già, mở mắt.\n2. Lặng im 5 phút.\n3. Nhận ra mọi ý nghĩ, cảm xúc, dòng suy tư, hình ảnh → tự hỏi \"Chẳng lẽ, đó là Ta sao?\". Biến thể: \"Là Ta?\", \"Ai đang hiện hữu?\", \"Ta?\" – liên tục."}, {"q": "Quán về \"Cái gọi là Ta\" dẫn đến đâu?", "a": "Thấu triệt rằng bản ngã chỉ là sự tổ hợp hình tướng mà Ý thức đồng hóa. Tự ngã sụp đổ, tạo tính toàn thể, nhất nguyên; hợp nhất với Tạo Hóa – lời nói, hành động tự nhiên mà không có người nói, người làm."}, {"q": "Theo sơ đồ, kỹ thuật nào tác động vào \"Ta là\", kỹ thuật nào vào \"Bất cứ điều gì đó\"?", "a": "• \"Ta là\": Quán về \"Cái gọi là Ta\" – Ai đang hiện hữu? Cái gì gọi là Ta?\n• \"Bất cứ điều gì đó\": Dọn rác Tâm Trí, 5 bước tỉnh thức, Quán Tâm Quán Trí, Trực diện với mọi hiện hữu (từ khoá: \"nhận biết\" mọi hình tướng trong nội tâm).", "d": 1}, {"q": "6 bài tập Thiền Quán về \"Cái gọi là Ta\"?", "a": "1. Mở mắt, nơi yên tĩnh, tư thế chuẩn\n2. Nhắm mắt, nơi yên tĩnh (mở mắt khó hơn nên luôn tập trước)\n3. Mở/nhắm mắt nơi ồn ào, đông người\n4. Mở mắt khi thuyết trình, giao tiếp\n5. Mở/nhắm mắt khi nghe nhạc DJ, Remix, sôi động\n6. Mọi lúc, mọi nơi", "d": 1}, {"q": "Mục đích bài tập 04 và 05 của Quán về \"Cái gọi là Ta\"?", "a": "• 04 (giao tiếp): nhận biết \"sự hoạt động của bản ngã\"; chứng ngộ thì \"trò chuyện nhưng không biết ai đang trò chuyện\", mọi lời nói, hành động \"từ Hư Không mà vọng về\".\n• 05 (nghe nhạc): luyện \"Ý thức về sự tồn tại và có mặt của Cái gọi là Ta\" khi âm thanh tác động.", "d": 1}]}, {"part": 2, "num": 9, "title": "Thuận theo tự nhiên – “Là như vậy”", "summary": "Thiền \"Thuận theo tự nhiên\" là sự buông xả của Ý thức: nhận ra mọi hình tướng rồi chấp nhận chúng như bản chất \"đang là như vậy\" bằng câu chú; ngoài đời là \"tùy duyên\" – dấn thân hết sức nhưng không mong cầu kết quả.", "key": "\"Hiện tại, bản chất vốn có của nó – đang là như vậy.\"", "cards": [{"q": "Sự buông xả của Ý thức gồm 2 vế nào?", "a": "• Vế 01: \"Nhận ra\" sự có mặt của hình tướng trong nội tâm.\n• Vế 02: \"Chấp nhận\" sự có mặt đó như bản chất vốn có \"là như vậy\".\nChỉ có vế 2 mà không có vế 1 thì Ý thức bị cuốn trôi – là vô minh, không còn tỉnh thức."}, {"q": "Phân biệt buông xả và \"chấp\" khi nhận biết một ý nghĩ/cảm xúc?", "a": "• Nhận biết rồi chấp nhận, thừa nhận sự có mặt của nó → Sự buông xả của Ý thức.\n• Nhận biết rồi tìm cách vượt ra, chặn đứng → Ý thức mắc kẹt trong hình tướng, một hình thái của chấp, làm nội tâm nặng nề."}, {"q": "Điểm chung của mọi kỹ thuật thiền trong Pháp là gì?", "a": "Đều bắt đầu bằng \"Nhận ra\":\n• Nhận ra + dùng chú\n• Nhận ra + tín tâm \"Cái gì nhận ra được thì không phải là Ta\"\n• Nhận ra + ghi xuống (Dọn rác)\n• Nhận ra + trả lời (5 bước)\n• Nhận ra + tự vấn\n• Nhận ra + chấp nhận (Buông xả)"}, {"q": "Phân biệt \"Tùy duyên\" và \"Sự buông xả của Ý thức\"?", "a": "Cùng là chấp nhận vạn vật \"là như vậy\":\n• Với hình tướng ở thế giới ngoài thân → gọi là Tùy duyên.\n• Với hình tướng ở thế giới nội tâm → gọi là Sự buông xả của Ý thức."}, {"q": "3 bước kỹ thuật thiền \"Thuận theo tự nhiên\"?", "a": "1. Nhận ra sự có mặt của mọi hình tướng trong nội tâm.\n2. Lặp lại liên tục chú: \"Hiện tại, bản chất vốn có của nó – đang là như vậy\".\n3. Kéo dài bất tận đến khi Trí định, Tâm an, cực sạch hình tướng."}, {"q": "Vì sao cần câu chú ở Bước 02?", "a": "Chú phát khởi trong Tâm thức mới tạo sự buông xả thật sự. Nếu chỉ hiểu \"chấp nhận\" mà không dùng chú trợ lực thì Ý thức dễ bị cuốn trôi theo suy tưởng và trạng thái nội tâm. Không có Bước 01 thì niệm chú vô nghĩa."}, {"q": "Hình ảnh Vũ Trụ và Người Mẹ minh họa điều gì?", "a": "Vũ Trụ rộng lớn vì không chối bỏ, không chê bai, không so sánh, chấp nhận tất cả. Người Mẹ không quyết định được hình hài con nên chấp nhận và yêu con như \"bản chất vốn có của nó – là như vậy\" – thái độ khoan thứ, bao dung."}, {"q": "Ý nghĩa của \"Chấp nhận\"?", "a": "• Không mong cầu điều gì\n• Không còn tranh đấu\n• Thái độ của sự tha thứ\n• Sự thả lỏng của tâm hồn\n• Sự lắng dịu của Tâm Trí\n• Sự tôn trọng"}, {"q": "\"Tùy duyên\" có phải là không làm gì?", "a": "Không. Không phải lười biếng hay \"để sung tự rơi vào miệng\", mà là làm hết những việc cần làm, nỗ lực tốt nhất cho quá trình, còn thành quả để đến tự nhiên. \"Lượng đủ thì chất đổi\" – hãy tập trung vào quá trình."}, {"q": "Khi nào nên nỗ lực, khi nào nên chấp nhận?", "a": "Nếu dùng Ý thức cá nhân can thiệp mà thay đổi được thì nỗ lực hành động; nếu không thì chấp nhận \"là như vậy\" (ví dụ: chồng nát rượu nói hoài không đổi). Ai muốn thay đổi phải tự ý thức; \"Giải ngộ\" cần Minh Sư, \"Chứng ngộ\" phải tự thân."}, {"q": "6 bài tập Thiền \"Thuận theo tự nhiên\"?", "a": "1. Mở mắt, nơi yên tĩnh – huân tập hướng nội khi mở mắt\n2. Nhắm mắt, nơi yên tĩnh\n3. Mở/nhắm mắt nơi ồn ào, đông người – gia tăng định lực\n4. Mở mắt khi thuyết trình, giao tiếp – nhận biết \"sự hoạt động của bản ngã\"\n5. Khi nghe nhạc DJ, Remix, sôi động\n6. Mọi lúc, mọi nơi", "d": 1}, {"q": "Bài tập 05 \"Thuận theo tự nhiên\" (nghe nhạc) luyện điều gì?", "a": "Luyện khả năng \"nhận biết hình tướng trong nội tâm\" và chấp nhận sự xuất hiện đó bằng câu chú mở cửa buông xả: \"Hiện tại, bản chất vốn có của nó – đang là như vậy\". Cốt lõi: Buông xả = Chấp nhận.", "d": 1}]}, {"part": 2, "num": 10, "title": "Trực diện với hiện hữu", "summary": "\"Trực diện với hiện hữu\" là đối diện trực tiếp, không né tránh với mọi thứ trong nội tâm – con đường duy nhất của tiến hóa Ý thức; ngoài đời, nó chính là sự \"dấn thân\".", "key": "Đời vạn lối, Đạo chỉ một đường – con đường đối diện với nội tâm và đi sâu vào nó.", "cards": [{"q": "\"Trực diện với hiện hữu\" nghĩa là gì?", "a": "Đối diện trực tiếp với mọi thứ đang diễn ra trong nội tâm: không né tránh, không chạy trốn, không thay thế bằng hình tướng khác. Thành thật nhận diện và gọi tên ý nghĩ, cảm xúc đang có. Nó tạo ra sự trưởng thành của Ý thức."}, {"q": "Ví dụ \"đứng trước đám đông\" minh họa điều gì?", "a": "Người lần đầu đứng trước đám đông có nhiều ý nghĩ loạn xạ, sợ hãi. Cách duy nhất để chúng tan đi là đối diện, trực diện nhiều lần. Sự nhận biết và trực diện như \"ánh sáng tỉnh thức\" quét sạch những gì nó nhìn thấy."}, {"q": "Lộ trình thực hành trực diện từ cơ bản đến nâng cao?", "a": "Ở một mình đối diện với \"đống rác nội tâm\" → nâng lên đối diện chúng ở nơi đông người, náo nhiệt. Đối diện cái thô trược trước, \"mây đen\" tan rồi đến \"mây trắng\": hành trình từ Dọn rác đến Quán về \"Cái gọi là Ta\"."}, {"q": "\"Trực diện với hiện hữu\" ứng dụng ngoài đời là gì?", "a": "Là \"Dấn thân\" – tự thân trải nghiệm, tiến sâu vào điều muốn sáng tỏ, đối diện mọi khó khăn không nao núng. Dấn thân tạo \"cái hiểu\" sâu sắc; không dấn thân thì lý thuyết chỉ nằm ở dạng \"ghi nhớ\"."}, {"q": "Nguyên tắc dấn thân đúng?", "a": "\"Hiểu rõ trước – dấn thân mạnh mẽ sau\" (hoặc vừa dấn thân vừa tìm hiểu bản chất). Nhắm mắt làm bừa thì không phải dấn thân mà chỉ là \"một con trâu\". Sự thấu hiểu đến từ 3 nguồn: tự thân thấu hiểu, Minh Sư chỉ dạy, trải nghiệm rồi tự ngộ."}, {"q": "Ứng dụng trực diện trong Thiền định?", "a": "Khi khổ đau, sân si, đố kỵ xuất hiện: không ngại, không thay điều tiêu cực bằng tích cực, mà nhận biết rõ sự có mặt của nó – \"ánh sáng của Ý thức\" chiếu rọi. Dọn rác, 5 bước tỉnh thức, Quán Tâm Trí đều dựa trên nguyên lý này."}]}, {"part": 2, "num": 11, "title": "Thực hành thiền với “Chân ngôn” (chú)", "summary": "Chân ngôn là câu ngắn mang hàm nghĩa và năng lượng tạo thức tỉnh Tâm linh; Pháp có 5 chân ngôn, đệ tử đã tỉnh thức cao độ chọn một để niệm liên tục với tín tâm tuyệt đối.", "key": "Chân ngôn trợ lực tỉnh thức cho bất cứ ai có tín tâm tuyệt đối khi hành trì nó.", "cards": [{"q": "\"Chân ngôn\" (chú) là gì?", "a": "Một câu ngắn, cụm từ ngắn mang hàm nghĩa và năng lượng tạo ra sự thức tỉnh Tâm linh cao độ. Nương tựa vào nó, Ý thức được dìu dắt từ đồng hóa với hình tướng đến siêu vượt ra hình tướng."}, {"q": "Giải nghĩa \"Nam Mô A-Di-Đà Phật\" theo sách?", "a": "• Nam Mô (Namah): kính lễ, quy y, nương nhờ.\n• A-di-đà (Amitābha): vô lượng quang – \"năng lượng nguyên thủy\" sinh ra khi hợp nhất với trạng thái trước khi Vũ Trụ hình thành, không phải một thực thể ngoài Vũ Trụ.\n• Phật (Buddha): Tỉnh thức, Giác ngộ."}, {"q": "Trong Pháp, \"Nam Mô A-Di-Đà Phật\" có thể dịch thế nào?", "a": "\"Hợp nhất với Sự Tuyệt đối. Trở về với Vô hiện hữu.\" Tương đương: \"Trở về với Thiên Chúa\" (Công giáo), \"Trở về với Brahman\" (Upanishad), \"Đắc Đạo\" (Lão tử), \"Ơn Trên thị hiện qua con\" (dân gian Việt)."}, {"q": "5 Chân ngôn của Pháp Thiền \"Tất Cả Chỉ Là Ý Nghĩ\"?", "a": "1. Nằm ngoài mọi hiện hữu\n2. Không tồn tại\n3. Ta nằm ngoài Thân xác & Tâm Trí\n4. Cái gì nhận ra được thì không phải là Ta\n5. Hợp nhất với trạng thái trước khi Vũ Trụ hình thành"}, {"q": "Nền tảng cần có trước khi thiền với Chân ngôn?", "a": "1. Đã Khai tâm, hiểu bản chất Tâm linh và ý nghĩa chân ngôn.\n2. Đã thực hành Dọn rác, 5 bước tỉnh thức, Quán Tâm Trí đến mức tỉnh thức cao độ, đang \"chứng kiến\".\n3. Tín tâm tuyệt đối, không lý luận bàn cãi."}, {"q": "Cách dùng các chân ngôn khi tọa thiền?", "a": "Nhận ra một ý nghĩ, cảm xúc, dòng suy tư, hình ảnh → niệm \"Cái gì nhận ra được thì không phải là Ta\", liên tục. Nên dùng 1 trong 5 câu. \"Nằm ngoài hiện hữu\" và \"Cái gì nhận ra được...\" phổ biến nhất; \"Trước khi Vũ Trụ hình thành\", \"Không tồn tại\" dùng để trầm mặc nhiều hơn."}, {"q": "6 bài tập Thiền với Chân ngôn?", "a": "1. Mở mắt, nơi yên tĩnh, tư thế chuẩn\n2. Nhắm mắt, nơi yên tĩnh, tư thế chuẩn\n3. Khi thuyết trình, giao tiếp\n4. Mở/nhắm mắt nơi ồn ào, náo nhiệt\n5. Khi nghe nhạc DJ, Remix, sôi động\n6. Mọi lúc, mọi nơi – huân tập thói quen hướng nội liên tục", "d": 1}]}, {"part": 2, "num": 12, "title": "“Trầm mặc” với trạng thái trước khi Vũ Trụ hình thành", "summary": "Trầm mặc với \"trạng thái trước khi Vũ Trụ hình thành\" là thực hành cuối cùng, dẫn đến Đại Giác Ngộ; chương cuối tóm tắt ứng dụng Pháp vào đời: \"Đạo tạo ra Đời\", Luật Hấp Dẫn, Nhân Quả, Sự Giàu có, và tinh thần \"Thông Đạo – Thạo Đời\".", "key": "Sự thấu hiểu Đạo tột cùng chỉ là: sống như một người bình thường trong một trạng thái nội tâm bình an tuyệt đối.", "cards": [{"q": "\"Trầm mặc\" là gì và dành cho ai?", "a": "Ngồi im lặng một mình, đối diện những câu hỏi \"không lời giải đáp\". Gần như là thực hành cuối cùng của Pháp, dành cho Ý thức đã hướng nội lâu ngày, sự sáng Ý thức đã chín muồi và vi tế."}, {"q": "4 chân ngôn để Trầm mặc thấu thị?", "a": "1. Hợp nhất với trạng thái \"Trước khi Vũ Trụ hình thành\"\n2. Chết ngay lúc này!\n3. Ta không tồn tại!\n4. Ta đã chết!"}, {"q": "Đặc điểm của \"trạng thái trước khi Vũ Trụ hình thành\"?", "a": "Là bản nguyên vạn vật, nơi mọi hình tướng sinh ra và trở về; hợp nhất được là Đại Giác Ngộ, trở về với Thượng Đế. Bình an tuyệt đối, năng lượng nguyên thủy tuôn chảy; vượt ngoài nhân quả, hấp dẫn, sống chết; mọi thứ diễn ra theo trật tự tự động toàn hảo."}, {"q": "Tâm pháp \"Đạo tạo ra Đời\" nghĩa là gì?", "a": "Mục đích học Đạo là Trí sáng, Tâm an, Thân khỏe, rồi dùng chúng tạo ra cuộc sống viên mãn. Tâm linh (vòng tròn 01) là gốc: Tâm linh viên mãn thì mọi khía cạnh viên mãn theo, bất ổn thì sụp đổ theo. Tinh thần Di Lặc: \"Đại Gia – Giác ngộ\"."}, {"q": "Ứng dụng trực giác – cảm ứng năng lượng thế nào?", "a": "Vạn vật có cấu tạo 3 vòng tròn (Sự Tuyệt đối – Tâm thức – Thân xác) nên đều có \"rung động Tâm thức\" riêng. Ý thức nhận biết tần số đó qua quan sát nội tâm: tiếp xúc mà bất an, khó chịu → chấm dứt liên đới; bình thản, nhẹ nhàng → tiếp tục. \"Năng lượng không biết nói dối\".", "d": 1}, {"q": "Cách chuyển hóa nghiệp thức quá khứ và tương lai?", "a": "Nhắc đến người/việc (quá khứ hoặc sắp tới) mà Tâm Trí còn miên man, bất an, lo sợ, mong cầu → dùng các phương pháp thiền hóa giải cho đến khi nhắc đến mà Trí thanh tịnh, Tâm an. Khi đó nghiệp thức được hóa giải, việc tương lai sẽ thuận lợi."}, {"q": "Vì sao \"nghĩ tích cực\" chưa đủ để ứng dụng Luật Hấp Dẫn?", "a": "Nghĩ tích cực chỉ kéo dài ngắn ngủi rồi tạp niệm trở lại – như \"lấy đống rác mới đè lên đống rác cũ\". Phải đưa Trí về thanh tịnh, Tâm an lạc, làm chủ Tâm Trí hoàn toàn thì năng lượng Tâm thức mới đổi triệt để, mới làm chủ được Luật Hấp Dẫn."}, {"q": "Phân biệt \"nhân vô hình\" và \"nhân hữu hình\"?", "a": "• Nhân vô hình: ý nghĩ, ý niệm, cảm xúc sinh khởi trong Tâm Trí.\n• Nhân hữu hình: hành động, lời nói của thân xác – phụ thuộc vào nhân vô hình trước đó.\n\"Lưới Trời\" hoạt động ngay trong thế giới nội tâm; làm chủ Tâm Trí là làm chủ Nhân Quả."}, {"q": "Công thức \"nạp năng lượng cho hiện hữu\"?", "a": "\"Liên tục nghĩ đến\" điều gì thì năng lượng dịch chuyển đến đó, nuôi dưỡng nhân vô hình. Đủ mạnh sẽ thành Khát vọng, Niềm tin, Đam mê, Động lực hành động và đi xuống Tiềm thức. Cần thiền để kiểm soát Tâm Trí, nếu không công thức này gây mệt mỏi."}, {"q": "Vì sao \"Lượng đủ, chất đổi\" khuyên chỉ chọn 1–2 việc?", "a": "Năng lượng nguyên thủy có giới hạn, chỉ sinh ra khi ngủ cực sâu và khi hợp nhất với trạng thái trước khi Vũ Trụ hình thành. Quá nhiều mục tiêu làm hao tổn, không việc nào kiệt xuất. Hãy làm 1–2 việc đến mức master, tập trung vào quá trình."}, {"q": "3 nguyên lý của Sự Giàu có?", "a": "1. Sự giàu có bên trong tạo ra sự giàu có bên ngoài (nhân vô hình: đầy đủ, mãn nguyện, nuôi bằng Biết ơn và Cầu nguyện).\n2. Sự giàu có = Giá trị.\n3. Sự giàu có = Đầu tư.\nHiểu nguyên lý 01 là hiểu Đạo; 02, 03 là hiểu Đời."}, {"q": "6 điều cốt tủy cuối cùng của học Đạo, Tâm linh và Thiền định?", "a": "1. Ý thức cực sạch thuần khiết\n2. Trí sáng\n3. Tâm an\n4. Thân khỏe\n5. Chăm sóc bản thân, gia đình, tạo giá trị cho Đời\n6. Sống thuận theo tự nhiên, biết ơn Tạo Hóa\nTrả lời: Đạo Tự Nhiên; Pháp \"Tất Cả Chỉ Là Ý Nghĩ\"; slogan \"Thông Đạo – Thạo Đời\"."}, {"q": "Phần thực hành của Chương 12 \"Trầm mặc\" là gì?", "a": "Hãy ở một nơi yên tĩnh, hợp nhất thể với trạng thái \"Trước khi Vũ Trụ hình thành\" (minh hoạ: tọa thiền, nhắm mắt, im lặng một mình).", "d": 1}]}];
const LS='tcclyn-v1';
let S={};try{S=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){S={}}
S.marks=S.marks||{};
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
let ci=Math.min(S.ch||0,DATA.length-1), order=[], pos=0, shuffled=false, onlyRev=false;
const key=(c,i)=>c+':'+i;
const mark=(c,i)=>S.marks[key(c,i)];

function chProgress(c){const n=DATA[c].cards.length;let k=0;for(let i=0;i<n;i++)if(mark(c,i)==='k')k++;return[k,n]}
function renderIdx(){
  const nav=$('idx');nav.innerHTML='';let part=0;
  DATA.forEach((d,c)=>{
    if(d.part!==part){part=d.part;const h=document.createElement('h2');h.textContent=part===1?'Phần I · Hệ thống Minh triết & Giáo lý':'Phần II · Thực hành & Ứng dụng';nav.appendChild(h)}
    const [k,n]=chProgress(c);
    const b=document.createElement('button');b.className='ch'+(c===ci?' on':'');
    b.innerHTML=`<span class="n">${String(d.num).padStart(2,'0')}</span><span class="t"></span><span class="p${k===n?' done':''}">${k}/${n}</span>`;
    b.querySelector('.t').textContent=d.title;
    b.onclick=()=>{go(c);nav.classList.remove('open');$('menuBtn').setAttribute('aria-expanded','false');window.scrollTo({top:0})};
    nav.appendChild(b);
  });
  let K=0,N=0;DATA.forEach((d,c)=>{const[k,n]=chProgress(c);K+=k;N+=n});
  $('ovTxt').textContent=`Đã nhớ ${K}/${N} thẻ`;$('ovBar').style.width=(N?K/N*100:0)+'%';
}
function buildOrder(){
  const n=DATA[ci].cards.length;order=[...Array(n).keys()];
  if(onlyRev)order=order.filter(i=>mark(ci,i)!=='k');
  if(shuffled)for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  pos=0;
}
function go(c){ci=c;S.ch=c;save();buildOrder();renderHead();renderIdx();renderCard()}
function renderHead(){
  const d=DATA[ci];
  $('chead').innerHTML=`<div class="eyebrow">${d.part===1?'Phần I':'Phần II'} · Chương ${String(d.num).padStart(2,'0')}</div><h2></h2><p class="sum"></p>${d.key?'<blockquote></blockquote>':''}`;
  $('chead').querySelector('h2').textContent=d.title;
  $('chead').querySelector('.sum').textContent=d.summary||'';
  if(d.key)$('chead').querySelector('blockquote').textContent=d.key;
}
function renderCard(){
  const d=DATA[ci],st=$('stage'),dots=$('dots');
  dots.innerHTML='';
  d.cards.forEach((_,i)=>{const b=document.createElement('button');const m=mark(ci,i);b.className=(m||'')+(order[pos]===i?' cur':'');b.setAttribute('aria-label','Thẻ '+(i+1));b.onclick=()=>{const p=order.indexOf(i);if(p<0){onlyRev=false;$('onlyReview').setAttribute('aria-pressed','false');buildOrder();pos=order.indexOf(i)}else pos=p;renderCard()};dots.appendChild(b)});
  if(!order.length){st.innerHTML=`<div class="empty">Chương này không còn thẻ cần ôn. Tắt “Chỉ thẻ cần ôn” để xem lại toàn bộ, hoặc chọn chương tiếp theo.</div>`;$('ctrl').hidden=true;$('count').textContent='';return}
  $('ctrl').hidden=false;
  const i=order[pos],c=d.cards[i],m=mark(ci,i);
  const stt=(c.d?'<span class="st dg">Từ sơ đồ</span> ':'')+(m==='k'?'<span class="st k">Đã nhớ</span>':m==='r'?'<span class="st r">Cần ôn</span>':'');
  st.innerHTML=`<div class="card" id="card" tabindex="0" role="button" aria-label="Lật thẻ">
    <div class="face front"><div class="tag"><span>Câu hỏi ${i+1}</span><span>${stt}</span></div><div class="q"></div><div class="hint">Chạm để xem đáp án</div></div>
    <div class="face back"><div class="tag"><span>Đáp án ${i+1}</span><span>${stt}</span></div><div class="a"></div><div class="hint">Chạm để xem lại câu hỏi</div></div></div>`;
  st.querySelector('.q').textContent=c.q;st.querySelector('.a').textContent=c.a;
  const card=$('card');card.onclick=()=>card.classList.toggle('flip');
  $('count').textContent=`Thẻ ${pos+1}/${order.length}`;
  $('prev').disabled=pos===0;$('next').disabled=false;
  $('next').textContent=pos===order.length-1?'Chương sau →':'→';
}
function setMark(v){if(!order.length)return;S.marks[key(ci,order[pos])]=v;save();renderIdx();next()}
function next(){if(pos<order.length-1){pos++;renderCard()}else if(ci<DATA.length-1){go(ci+1);window.scrollTo({top:0})}else renderCard()}
$('prev').onclick=()=>{if(pos>0){pos--;renderCard()}};
$('next').onclick=next;$('again').onclick=()=>setMark('r');$('know').onclick=()=>setMark('k');
$('shuffle').onclick=e=>{shuffled=!shuffled;e.target.setAttribute('aria-pressed',shuffled);buildOrder();renderCard()};
$('onlyReview').onclick=e=>{onlyRev=!onlyRev;e.target.setAttribute('aria-pressed',onlyRev);buildOrder();renderCard()};
$('reset').onclick=()=>{DATA[ci].cards.forEach((_,i)=>delete S.marks[key(ci,i)]);save();buildOrder();renderIdx();renderCard()};
$('menuBtn').onclick=e=>{const o=$('idx').classList.toggle('open');e.target.setAttribute('aria-expanded',o)};
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('nav'))return;
  if(e.key===' '){e.preventDefault();$('card')&&$('card').classList.toggle('flip')}
  else if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')$('prev').click();
  else if(e.key==='1')setMark('r');else if(e.key==='2')setMark('k');});
go(ci);
</script>
