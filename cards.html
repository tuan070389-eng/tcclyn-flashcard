<!doctype html>
<html lang="vi"><head>
<title>Tất Cả Chỉ Là Ý Nghĩ – Học thẻ</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ý Nghĩ">
<meta name="theme-color" content="#2f6f62">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}[hidden]{display:none!important}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;font:500 12px var(--f-ui);color:var(--muted);text-decoration:none}
.tabbar a.on{color:var(--jade)}
.tabbar svg{width:22px;height:22px}
</style>
<style>
/* Layout: chapter index on the left like a sutra binding, one card in the middle, quiet ink-and-jade palette */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --sunk:#e8ebe6; --ink:#1d2421; --muted:#5e6a64; --line:#d5dbd5;
  --jade:#2f6f62; --jade-soft:#dcebe6; --amber:#9a6416; --amber-soft:#f4e7d2;
  --f-display:"Iowan Old Style","Palatino","Noto Serif",Georgia,serif;
  --f-ui:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1c2320; --sunk:#232b28; --ink:#e6ebe7; --muted:#9aa7a0; --line:#2f3934;
  --jade:#7cc3b2; --jade-soft:#1f3631; --amber:#e0a855; --amber-soft:#3a2d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1c2320; --sunk:#232b28; --ink:#e6ebe7; --muted:#9aa7a0; --line:#2f3934;
  --jade:#7cc3b2; --jade-soft:#1f3631; --amber:#e0a855; --amber-soft:#3a2d1a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
header.top h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3vw,30px);margin:0;letter-spacing:-.01em;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.overall{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:140px;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);width:0;transition:width .3s}

/* chapter index */
nav.idx{position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
nav.idx h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:600}
nav.idx h2:first-child{margin-top:0}
.ch{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;font-size:13.5px}
.ch:hover{background:var(--sunk)}
.ch.on{background:var(--jade-soft)}
.ch .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.ch .t{min-width:0}
.ch .p{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ch .p.done{color:var(--jade);font-weight:600}
.menu-btn{display:none}

/* study pane */
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.chead .eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--jade);font-weight:600}
.chead h2{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,2.6vw,28px);line-height:1.25;margin:4px 0 10px;text-wrap:balance}
.chead .sum{color:var(--muted);max-width:68ch;margin:0}
.chead blockquote{font-family:var(--f-display);font-style:italic;margin:12px 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--jade);max-width:66ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools .count{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

.stage{perspective:1600px}
.card{position:relative;min-height:340px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px clamp(20px,4vw,44px);display:flex;flex-direction:column;box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(0,0,0,.25);overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--surface)}
.face .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.face .tag .st{letter-spacing:.04em;text-transform:none;font-weight:600;padding:1px 8px;border-radius:999px}
.st.dg{border:1px solid var(--line);color:var(--muted)}
.face .tag>span:last-child{display:flex;gap:6px}
.st.k{background:var(--jade-soft);color:var(--jade)} .st.r{background:var(--amber-soft);color:var(--amber)}
.face .q{font-family:var(--f-display);font-size:clamp(20px,2.4vw,26px);line-height:1.35;margin:auto 0;padding-block:18px;text-wrap:balance}
.face .a{font-size:16.5px;line-height:1.65;margin:auto 0;padding-block:14px;white-space:pre-line;max-width:62ch}
.face .hint{font-size:12px;color:var(--muted)}
.ctrl{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 16px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.again{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.btn.know{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.keys{font-size:12px;color:var(--muted)}
.keys kbd{font-family:var(--f-ui);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;background:var(--surface)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots button{width:22px;height:6px;border-radius:3px;border:0;background:var(--sunk);padding:0}
.dots button.k{background:var(--jade)} .dots button.r{background:var(--amber)}
.dots button.cur{outline:2px solid var(--ink);outline-offset:1px}

@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-flex}
  .overall{width:100%}
  .overall .bar{flex:1}
  #ovTxt{white-space:nowrap}
  nav.idx{display:none;position:static;max-height:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
  nav.idx.open{display:block}
  .card{min-height:380px}
  .ctrl{grid-template-columns:1fr 1fr}
  .ctrl .nav{order:2}
  .keys{display:none}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.bar i{transition:none}}
</style>
</head><body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Tất Cả Chỉ Là Ý Nghĩ</h1>
      <div class="sub">Flashcard ý chính theo từng chương · Pháp Thiền của Aloha Tuấn</div>
    </div>
    <div class="overall"><button class="chip menu-btn" id="menuBtn" aria-expanded="false">Chọn chương</button><span id="ovTxt"></span><div class="bar"><i id="ovBar"></i></div></div>
  </header>

  <nav class="idx" id="idx" aria-label="Danh sách chương"></nav>

  <main>
    <section class="chead" id="chead"></section>
    <div class="tools">
      <button class="chip" id="shuffle" aria-pressed="false">Xáo thẻ</button>
      <button class="chip" id="onlyReview" aria-pressed="false">Chỉ thẻ cần ôn</button>
      <button class="chip" id="reset">Học lại chương</button>
      <span class="count" id="count"></span>
    </div>
    <div class="dots" id="dots"></div>
    <div class="stage" id="stage"></div>
    <div class="ctrl" id="ctrl">
      <button class="btn nav" id="prev" aria-label="Thẻ trước">←</button>
      <button class="btn again" id="again">Ôn lại</button>
      <button class="btn know" id="know">Đã nhớ</button>
      <button class="btn nav" id="next" aria-label="Thẻ sau">→</button>
    </div>
    <div class="keys"><kbd>Space</kbd> lật thẻ · <kbd>←</kbd><kbd>→</kbd> chuyển thẻ · <kbd>1</kbd> ôn lại · <kbd>2</kbd> đã nhớ</div>
  </main>
</div>

<script>
const DATA = [{"part": 1, "num": 1, "title": "Sự hình thành của Vũ Trụ", "summary": "Vũ trụ sinh ra từ \"Sự Tuyệt đối\" và được cấu tạo theo nguyên lý 3 vòng tròn; vạn vật kể cả con người đều mang cấu tạo ấy. Thành tựu tu tập là sự dồi dào của \"năng lượng nguyên thuỷ\", có được khi Ý thức vượt ra ngoài mọi hình tướng – bằng cách \"nhận ra\" mọi dao động thay vì dùng tích cực đè nén tiêu cực.", "key": "\"Cái gì nhận ra được thì không phải là Ta.\"", "cards": [{"q": "\"Sự Tuyệt đối\" là gì?", "a": "Là \"trạng thái trước khi Vũ Trụ hình thành\" – nơi chấm dứt mọi hình tướng, năng lượng, vật chất và ý thức; một trạng thái \"KHÔNG CÓ\", \"KHÔNG TỒN TẠI\". Phật giáo gọi là Tánh Không, Chân Như, Niết Bàn; Ấn Độ giáo gọi là Brahman; Lão Tử gọi là ĐẠO."}, {"q": "Vì sao tác giả khuyên dùng chữ \"Cội nguồn\"/\"Tạo hoá\" thay vì chỉ hiểu \"Thượng Đế\" theo nghĩa thông thường?", "a": "Vì chữ \"Thượng Đế\" dễ khiến người ta hình dung sai về một đấng có hình tướng, xác thân (như cụ già râu tóc bạc). \"Cội nguồn\" không gợi hình hài cụ thể. Vẫn có thể dùng chữ Thượng Đế như sự sùng kính, tạ ơn."}, {"q": "Sơ đồ \"3 vòng tròn\" cấu tạo Vũ Trụ gồm những gì?", "a": "• Vòng 01 – \"Sự Tuyệt đối\": cái hằng hữu sâu nhất, Cội nguồn sinh ra \"năng lượng nguyên thuỷ\".\n• Vòng 02 – \"Tâm thức Vũ Trụ\" (Thế giới Tâm thức): lấp đầy bởi \"năng lượng Tâm thức\"; nơi Luật Nhân Quả, Luật Hấp Dẫn vận hành.\n• Vòng 03 – \"Hữu hình Thế giới\" (Thế giới các hạt vật chất): cảm nhận bằng 5 giác quan.", "d": 1}, {"q": "Theo nguyên lý 3 vòng, vật vô tri (hòn đá) và thực vật có Tâm thức không?", "a": "Có. Vạn vật đều có Tâm thức riêng và Sự Tuyệt đối bên trong. Đá quý có năng lượng Tâm thức thanh nhẹ, tác động tích cực lên người. Thực vật có \"Tâm thức thụ động\" – lớn nhanh trong năng lượng tình yêu, trân quý; dễ bệnh khi chủ nhân thô trược."}, {"q": "Khác biệt giữa động vật và con người ở vòng tròn Tâm thức?", "a": "Động vật: Ý thức tiến hoá thấp, Tâm thức \"thụ động\", sống bằng \"bản năng\". Con người: Ý thức cao hơn nhưng vẫn ở tầng thấp của Vũ Trụ; \"bản ngã\" kiểm soát cuộc sống. Tiến hoá là \"bản ngã\" lên \"Chân ngã\", tính cách cá nhân lên tính cách Vũ Trụ."}, {"q": "Tác giả nhìn nhận Thân xác như thế nào?", "a": "Thân xác là món quà quý giá Thượng Đế ban tặng, công cụ quyền năng cho sự trải nghiệm; mọi hoạt động tự động của nó là trật tự định sẵn của Tạo Hoá. Kẻ tu hành xem thường, tự huỷ hoại thân xác là vô minh, vô ơn và thoái bộ tâm linh."}, {"q": "2 lần sinh hoá của \"năng lượng nguyên thuỷ\"?", "a": "1. Sinh hoá lần I (Nhất Nguyên – Hợp nhất): năng lượng tiên thiên – tình yêu, biết ơn, hạnh phúc, tự nhiên, sự thông thái, vị tha, chân thành, tĩnh lặng thuần khiết…\n2. Sinh hoá lần II (Nhị Nguyên – Đối lập), chia:\n• Năng lượng (-): đau khổ, bức xúc, nặng nề, đố kỵ, ganh ghét, giận dữ, độc ác, bấn loạn, tạp niệm…\n• Năng lượng (+): khát vọng, đam mê, dấn thân, cần cù, khiêm tốn, niềm tin, ý chí vươn lên, chính trực…", "d": 1}, {"q": "\"Năng lượng nguyên thuỷ\" sinh ra trong những trường hợp nào?", "a": "1. Ngủ sâu không mộng mị – Ý thức dừng lại (\"Thiền thụ động\").\n2. Nhập định trong Thiền – Ý thức vượt ra ngoài sự chứng kiến, \"nằm ngoài mọi hiện hữu\".\nKhông thể nạp từ thức ăn hay \"thu\" từ ngoài Vũ Trụ – đó chỉ là năng lượng thứ cấp."}, {"q": "\"Ấn chứng đích thực\" của Người Giác ngộ là gì?", "a": "Sự dồi dào của \"năng lượng nguyên thuỷ\" (Nội lực tu hành) – không phải văn tự, ngôn ngữ hay hùng luận. Nó đem lại an lạc sâu thẳm, nhận thức vượt ngưỡng, hạnh phúc, tình yêu, hào quang, giọng nói nội lực, phước báu thuận lợi."}, {"q": "Cách nhanh nhất để đưa Ý thức vượt ra ngoài mọi hình tướng?", "a": "Một TÍN TÂM SÂU SẮC vào Tâm Pháp cốt tuỷ của Pháp Thiền \"Tất Cả Chỉ Là Ý Nghĩ\": \"CÁI GÌ NHẬN RA ĐƯỢC THÌ KHÔNG PHẢI LÀ TA\"."}, {"q": "Dấu hiệu cạn kiệt và dồi dào \"năng lượng nguyên thuỷ\"?", "a": "• Cạn kiệt (tỉnh thức kém): chán nản, miên man nghĩ ngợi, stress, dễ nổi nóng, nặng đầu, bị cảm xúc và ý nghĩ dẫn dắt.\n• Dồi dào: rất tỉnh táo, sáng tạo, Trí im lặng, Tâm bình thản, nhận biết dao động sắc nét, thích ở một mình, mẫn cảm năng lượng, dễ cảm thông, tự thấu hiểu kinh sách."}, {"q": "3 chất xúc tác mạnh nhất đưa con người đến tu tập Tâm linh?", "a": "1. Sự đau khổ nội tâm.\n2. Tự ý thức nhờ nền tảng Trí tuệ trước đó (căn cơ).\n3. May mắn gặp được một Minh sư.\nCon đường về Cội nguồn là \"cuộc hành hương nội tâm\", không phải lên Himalaya hay đi tìm Minh sư."}, {"q": "3 trạng thái nội tâm căn bản và cách xử lý đúng?", "a": "Tiêu cực – Tích cực – Sự im lặng. Sai lầm: lấy tích cực che lấp, đè nén tiêu cực (như NLP). Đúng: \"nhận ra\" sự có mặt của mọi ý nghĩ tiêu cực lẫn tích cực – đó là cách chuyển hoá năng lượng về nguyên thuỷ và đưa nội tâm đến \"im lặng thuần khiết\"."}, {"q": "Cốt lõi của thành công gồm 2 yếu tố nào?", "a": "1. Kiểm soát và làm chủ Tâm Trí hoàn toàn.\n2. Thay đổi rung động \"năng lượng Tâm thức\" từ thô trược lên thanh nhẹ – Luật Hấp Dẫn tự mang phúc lạc đến (gọi là HOÁ GIẢI NGHIỆP).\nNLP, gieo thói quen tốt… chỉ là \"bề nổi\"; ý nghĩ tích cực chỉ nên dùng như công cụ dưới sự kiểm soát của Ý thức."}, {"q": "Sơ đồ \"chuyển động ngược về Cội nguồn\" diễn ra thế nào?", "a": "Ngược chiều sinh hoá: năng lượng tiêu cực (-) và tích cực (+) → Nhị Nguyên → cùng năng lượng Nhất Nguyên → trở về \"năng lượng nguyên thuỷ\" → \"Sự Tuyệt đối\". Vạn vật đều có khuynh hướng trở về \"nơi sinh ra\"; con người trở về Cội nguồn trong giấc ngủ cực sâu và trong Thiền định, khi mọi hình tướng của Tâm Trí bị triệt tiêu.", "d": 1}, {"q": "Dạng sống có cấu tạo \"2 vòng tròn\" là gì?", "a": "Chỉ gồm Vòng 01 \"Sự Tuyệt đối\" và Vòng 02 \"Tâm thức\" (Thế giới Tâm thức) – dạng sống không có thân xác, tồn tại dưới dạng \"năng lượng Tâm thức\" trong \"Vũ Trụ Tâm thức\" (các \"tầng trời Tâm thức\"). Không có cảm giác, xúc chạm; tiến hoá bằng cách \"gột rửa năng lượng Tâm thức\".", "d": 1}]}, {"part": 1, "num": 2, "title": "Sự tương quan giữa Con người, Vũ Trụ, Trời Đất", "summary": "Con người là \"Tiểu Vũ Trụ\" có cùng cấu tạo 3 vòng với Đại Vũ Trụ; vòng càng sâu càng quyết định vòng bên ngoài. Vì vậy phải \"Thông Đạo trước, Thạo Đời sau\": ưu tiên đời sống Tâm linh, rồi Tâm Trí, sức khoẻ, sau cùng mới đến tiền bạc, địa vị – vốn chỉ là công cụ để trải nghiệm.", "key": "\"Càng sâu bên trong thì càng ảnh hưởng ra bên ngoài\" – hãy Thông Đạo trước, Thạo Đời sau.", "cards": [{"q": "Vì sao con người được gọi là \"Tiểu Vũ Trụ\"?", "a": "Vì con người và \"Đại Vũ Trụ\" có cùng nguyên lý cấu tạo 3 vòng, nên khám phá nội tâm cũng là khám phá \"Tâm thức Vũ Trụ\". Tương ứng: Sự tuyệt đối = Đại Thiên Thế Giới; Tâm thức Vũ Trụ = Trung Thiên Thế Giới; vật chất = Hữu hình thế giới. Mỗi tần số rung của năng lượng Tâm thức là một tầng trời."}, {"q": "4 đời sống của con người theo nguyên lý 3 vòng tròn?", "a": "1. Vòng 01: đời sống Tâm linh (thiền, cầu nguyện, trầm mặc).\n2. Vòng 02: đời sống tinh thần, tư tưởng (du lịch, âm nhạc, học tư duy).\n3. Vòng 03: đời sống sức khoẻ thân xác.\n4. Ngoài 3 vòng: sự nghiệp, tiền bạc, địa vị, quan hệ, bằng cấp…"}, {"q": "Tiền bạc, địa vị có vai trò gì với người tu tập?", "a": "Chỉ là CÔNG CỤ để trải nghiệm cuộc sống tốt hơn – \"cầm lên được, bỏ xuống được\"; không đồng hoá \"Ta là\" + tiền bạc. Không phải từ bỏ mà làm chủ chúng. Giàu có vật chất giúp nội tâm thảnh thơi, nên \"làm giàu chính đáng\" cũng là một hình thức tu tập."}, {"q": "7 điều kiện của người \"trưởng thành nội tâm\"?", "a": "1. Kiểm soát Tâm Trí hoàn toàn.\n2. Trí sáng, chuyên chú thực tại, nhìn xa.\n3. Tâm an lạc, vị tha, bao dung, chân thành.\n4. Năng lượng Tâm thức thanh nhẹ.\n5. Thấu hiểu tương quan Đạo – Đời.\n6. Chủ động kiếm tiền, làm giàu, giúp đời.\n7. Chủ động tiến hoá Tâm linh."}, {"q": "\"Tuổi\" đích thực của vòng tròn Tâm thức là gì?", "a": "Không phụ thuộc tuổi thân xác mà là SỰ THĂNG HOA CỦA \"NĂNG LƯỢNG TÂM THỨC\" – sự trưởng thành của linh hồn, \"tiến hoá của bản ngã\". Người lớn tuổi mà nội tâm hơn thua là \"Người già\" chứ không phải \"Người lớn\"."}, {"q": "4 cấp độ của \"ẩn tu\"?", "a": "1. Tiểu Ẩn: tìm nơi yên tĩnh để thực hành.\n2. Trung Ẩn: cư sĩ giữa đời (quan trường, thương trường) vẫn trong sạch.\n3. Đại Ẩn: giữa phồn hoa náo nhiệt vẫn thanh tịnh.\n4. Tàng Ẩn: triệt ngộ, \"tuỳ duyên bất biến\", là Minh sư mà không ai biết.\nChọn theo sự phù hợp hoàn cảnh."}, {"q": "\"Tinh thần Di Lặc\" là gì?", "a": "Thông điệp thế kỷ XXI: viên mãn cả Đạo và Đời (còn gọi Đại Gia – Giác Ngộ). Nụ cười an nhiên tượng trưng thông tuệ ở Đạo; vàng bạc trên người tượng trưng viên mãn vật chất. Thời \"chọn Đạo quên Đời\" đã qua."}, {"q": "Phân biệt Tri kiến (Chánh kiến) và Tà kiến?", "a": "• Tri kiến: hiểu đúng bản chất, nguyên lý của vấn đề.\n• Tà kiến: quan điểm cá nhân tạo từ bản ngã, dẫn đến mê tín, niềm tin mù quáng.\nVí dụ \"Phật\": không phải thực thể có hình tướng, mà là từ chỉ trạng thái an lạc, bình an – \"vô hiện hữu\"."}, {"q": "Làm sao nhận diện một người tu đúng hay sai?", "a": "Nhìn KẾT QUẢ. Chiều thuận: Hiểu đúng → tạo ra Hành động đúng → tạo ra Kết quả đúng. Suy ngược: Kết quả đúng nghĩa là Hành động đúng, nghĩa là Hiểu đúng; Kết quả sai nghĩa là Hành động sai, nghĩa là Hiểu sai.\n• Đúng: Tâm Trí được làm chủ, minh mẫn, đời sống viên mãn.\n• Sai: tạp niệm, sân si, thích thể hiện, huyên thuyên.", "d": 1}, {"q": "Nguyên lý tác động qua lại giữa 3 vòng tròn?", "a": "\"CÀNG SÂU BÊN TRONG THÌ CÀNG ẢNH HƯỞNG RA BÊN NGOÀI\". Ví dụ Tâm động loạn → thân dễ bệnh, nét mặt xấu đi. Cổ nhân khái quát: \"Tướng tuỳ Tâm sinh, Tướng tuỳ Tâm diệt\" – thần thái trên thân xác tuỳ thuộc năng lượng Tâm thức. Cốt lõi là gột rửa năng lượng Tâm thức (\"rửa sạch nghiệp trước\")."}, {"q": "4 trường hợp Tâm thức hợp nhất với \"Sự Tuyệt đối\"?", "a": "1. Giấc ngủ sâu không mộng mị (\"Thiền tự nhiên\").\n2. Nhập cực định – Ý thức dừng lại.\n3. Vô ngã tuyệt đối – không biết đến \"cái gọi là Ta\" nhưng vẫn thức.\n4. Đức tin tuyệt đối – qua cầu nguyện và tín tâm."}, {"q": "\"Thông Đạo trước, Thạo Đời sau\" nghĩa là gì?", "a": "• Thông Đạo: thấu hiểu 3 vòng tròn (Tâm linh, Thiền, nguyên lý vận hành) để Trí sáng, Tâm an, Thân khoẻ – xây công cụ lợi hại.\n• Thạo Đời: giỏi các \"vệ tinh\" như kiếm tiền, kinh doanh, quan hệ.\nSai lầm: thạo Đời trước, đến già mới hướng Đạo."}, {"q": "Thứ tự ưu tiên thời gian \"đúng\" cho đời sống?", "a": "Đúng:\n1. Tâm linh (ít nhất 2 giờ/ngày thiền, trầm mặc).\n2. Tâm Trí (Tâm thức).\n3. Thân xác (sức khoẻ).\n4. Sau cùng – vệ tinh bên ngoài: tiền bạc, địa vị, chức vụ, quyền lợi, tài sản.\nĐa số làm ngược lại: vệ tinh bên ngoài → Thân xác → Tâm Trí → Tâm linh sau cùng. Đời trục trặc: hãy \"toạ thiền\" hướng nội.", "d": 1}, {"q": "Những lựa chọn bên ngoài nào cũng là \"hình thức trợ giúp tu hành\"?", "a": "1. Làm giàu chính đáng.\n2. Chọn lọc bạn bè, mối quan hệ; gần bậc tỉnh thức.\n3. Chọn vùng đất có linh khí tốt (Thánh địa).\n4. Chọn nghề thiện lành, tránh nghề tạo \"nghiệp xấu\" (giết mổ, cho vay nặng lãi, hàng giả, lừa đảo…)."}, {"q": "\"Vệ tinh bên ngoài\" trong sơ đồ 3 vòng gồm những gì?", "a": "Những thứ bao quanh 3 vòng tròn: kinh tế, chính trị, bằng cấp, tiền bạc, vật chất, địa vị, sở hữu tài sản, sự công nhận xã hội… Chúng chỉ là CÔNG CỤ để trải nghiệm, là \"thế giới bên ngoài\", không quyết định sự thăng hoa nội tâm; học giỏi chúng là \"Thạo Đời\", đến sau \"Thông Đạo\".", "d": 1}]}, {"part": 1, "num": 3, "title": "Cấu tạo thế giới Tâm thức", "summary": "Vòng tròn Tâm thức vận hành bằng \"năng lượng Tâm thức\", gồm 3 công cụ Ý thức – Trí – Tâm cùng thực thể \"bản ngã\". Trí sinh ý nghĩ, Tâm chứa năng lượng của ý nghĩ nên muốn đổi trạng thái Tâm phải đổi cách nghĩ của Trí; Tâm thức còn phân tầng Thượng thức và Tiềm thức.", "key": "\"Trí sáng\" xuất hiện trước, \"Tâm an\" xuất hiện sau – muốn thay thái độ, phải thay ý nghĩ trước.", "cards": [{"q": "\"Năng lượng Tâm thức\" là gì? Cho ví dụ.", "a": "Năng lượng sinh hoá từ \"năng lượng nguyên thuỷ\", không phải năng lượng vật lý, sinh học hay lượng tử, khoa học không đo được. Ví dụ: tình yêu, niềm tin, vị tha, hận thù, độc ác. Nó vận hành ở Trung thiên thế giới (cõi ở giữa)."}, {"q": "Khi qua đời, linh hồn đi đâu theo tác giả?", "a": "Không bay lên trời giữa các vì sao. Các dạng năng lượng sống của \"thế giới nội tâm\" dịch chuyển vào \"Vũ Trụ Tâm thức\" – tồn tại song song với Vũ Trụ vật chất – và tiếp tục tiến hoá: \"sự tiến hoá tiếp diễn của linh hồn\"."}, {"q": "3 công cụ trong vòng tròn Tâm thức và chức năng?", "a": "1. Ý thức: công cụ nhận biết, \"vô cấu nhiễm\"; chứng kiến và kiểm soát Tâm Trí, thân xác.\n2. Trí: công cụ tư duy, sáng tạo chủ động, sinh ý nghĩ; ghi nhớ.\n3. Tâm: chứa năng lượng, sinh cảm xúc, tình cảm, trạng thái, thái độ.\nTrí + Tâm = Tâm Trí, như ăngten thu phát năng lượng."}, {"q": "\"Bản ngã\" là gì và tiến hoá tột cùng ra sao?", "a": "Thực thể sống vô hình tồn tại song song với 3 công cụ: những ảo tưởng, định nghĩa, gán ghép về \"cái gọi là Ta\" – thuộc tính thiên bẩm của loài người. Tiến hoá theo Ý thức; tột cùng là sự sụp đổ của nó, tiến lên \"chủng tộc Minh Sư\"."}, {"q": "Vì sao khi rời thân xác chỉ còn từ \"Tâm thức\" là đúng?", "a": "Khi còn thân xác, vòng tròn 02 được gọi: Thế giới nội tâm, Tâm Trí, Tâm thức, Tâm, Thức, Nội tâm. Rời thân xác, Tâm Trí ngừng hoạt động; năng lượng chuyển thành \"năng lượng Tâm thức\", sắp xếp theo nguyên lý \"rung động thấp bao bên ngoài, thanh nhẹ ở bên trong\"."}, {"q": "Mối liên đới giữa Tâm và Trí?", "a": "Mỗi ý nghĩ Trí sinh ra mang \"năng lượng sống\" với tần số riêng, được chứa ở Tâm (\"bình chứa năng lượng\") rồi kết tinh thành cảm xúc, thái độ. Vì vậy muốn thay đổi trạng thái của Tâm phải thay đổi cách nghĩ của Trí."}, {"q": "Ví dụ Người A và Người B về \"sự giàu có\" minh hoạ điều gì?", "a": "Người A nuôi ý nghĩ tiêu cực (giàu là đáng ghét, vô đạo đức…) → cảm xúc ghét, mất niềm tin. Người B nghĩ tích cực (yêu quý, ngưỡng mộ sự giàu có) → hưng phấn, khát vọng, dễ thành công đột phá. Thái độ là kết tinh năng lượng của các ý nghĩ."}, {"q": "Ý nghĩ tiêu cực, tích cực và \"cực sạch ý nghĩ\" tác động lên Tâm thế nào?", "a": "• Tiêu cực: rung động chậm, nặng nề → bức xúc, sân si.\n• Tích cực: rung động nhanh, vi tế → vui vẻ, khát vọng.\n• Cực sạch ý nghĩ: Tâm thanh tịnh, im lặng, thuần khiết – vượt cả tích cực lẫn tiêu cực."}, {"q": "Vì sao câu \"Tâm thanh tịnh thì Trí sẽ sáng\" bị ngược?", "a": "Vì sự biến đổi của Tâm phụ thuộc hoàn toàn vào Trí. Đúng là \"TRÍ SÁNG – TÂM AN\": Trí sạch ý nghĩ thì tự nhiên Tâm an. Hiểu và kiểm soát tương quan Tâm–Trí cũng là làm chủ Luật Hấp Dẫn."}, {"q": "Phân biệt Thượng thức và Tiềm thức?", "a": "Nguyên lý \"nhẹ nổi lên trên, nặng chìm xuống dưới\".\n• Thượng thức: khối năng lượng yếu, mới hình thành (ý nghĩ huyên thuyên, cảm xúc nhất thời) → hoá giải bằng Dọn Rác / 5 Bước Tỉnh Thức.\n• Tiềm thức (A-lại-da, Tạng thức): khối năng lượng mạnh, tính cách cố hữu, bản ngã vi tế → dùng Tâm Pháp cao cấp, quán \"Cái gọi là Ta\"."}, {"q": "Sơ đồ liên đới Trí – Tâm vận hành ra sao?", "a": "1. TRÍ tạo ra \"hiện hữu vô hình\" (ý nghĩ, ý niệm…).\n2. Năng lượng của các \"hiện hữu\" cộng lại tạo thành TÂM – nơi chứa đựng năng lượng của hiện hữu.\n3. TÂM sinh ra: cảm xúc, tình cảm, trạng thái nội tâm, thái độ.", "d": 1}, {"q": "Công thức hình thành Thái độ, Cảm xúc?", "a": "THÁI ĐỘ, CẢM XÚC = β01 + β02 + β03 + … + βn (hoặc d01 + d02 + … + dn).\nMỗi ý nghĩ mà \"lăng kính Tâm Trí\" sinh khởi mang một tần số năng lượng riêng; tổng năng lượng các ý nghĩ ấy tích trữ tại Tâm kết tinh thành thái độ, cảm xúc. Người A (ý nghĩ tiêu cực về giàu có: β) và người B (tích cực: d) vì thế có thái độ khác hẳn.", "d": 1}, {"q": "Theo bảng 2 tầng, Tiềm thức chứa gì và vai trò ra sao?", "a": "• Tầng I – Thượng thức: chứa \"Hiện hữu\" mới tạo hoặc năng lượng yếu; bề mặt đầu tiên của Trí để tiếp nhận, hấp thu năng lượng từ bên ngoài.\n• Tầng II – Tiềm thức: chứa hiện hữu và năng lượng tích trữ lâu ngày qua nhiều đời kiếp (Nghiệp Kiết Sử) – nguyên nhân cốt tuỷ của động loạn, tạp niệm; nơi Nhân Quả, Luật Hấp Dẫn chủ yếu vận hành.", "d": 1}]}, {"part": 1, "num": 4, "title": "Ý thức và chức năng của Ý thức", "summary": "Ý thức là \"sự nhận biết\" thuần tuý – cầu nối giữa vòng tròn 01 và 02, không tư duy, không sinh cảm xúc, vô cấu nhiễm. Thức tỉnh Tâm linh là gia tăng sự sáng của Ý thức, và mọi phương pháp thiền quán đều sinh ra từ việc đưa Ý thức vào nhận biết.", "key": "Thiền là đi từ nhận biết đến vượt ra ngoài sự nhận biết.", "cards": [{"q": "Ý thức là gì và nằm ở đâu?", "a": "Còn gọi \"Mắt trí huệ\", \"con mắt thứ 3\" – chiếc gạch nối: VÔ HIỆN HỮU – Ý THỨC – HIỆN HỮU (giữa \"Không\" và \"Có\"), cầu nối giữa vòng tròn 01 và 02, giữa \"linh hồn nguyên thuỷ\" và \"thế giới\". Không có Ý thức thì không nhận biết được Vũ Trụ. Không nằm ở ấn đường trên thân xác.", "d": 1}, {"q": "3 chức năng thiên bẩm của Ý thức?", "a": "1. Sự nhận biết – chứng kiến mọi hình tướng trong nội tâm, thân xác, thế giới.\n2. Làm chủ và kiểm soát Tâm Trí và Thân xác.\n3. Cảm ứng năng lượng – Trực giác."}, {"q": "Đặc tính \"vô cấu nhiễm\" của Ý thức nghĩa là gì?", "a": "Ý thức không nhiễm bẩn vào hình tướng, vật chất hay năng lượng; nó không phải vật chất cũng không phải năng lượng, mà là công cụ nhận biết sự tồn tại của chúng. Nó tách rời và \"chứng kiến\" mọi thứ."}, {"q": "\"Thức tỉnh Tâm linh\" là gì? Tiến hoá tận cùng của Ý thức?", "a": "Thức tỉnh Tâm linh là gia tăng \"sự sáng của Ý thức\". Tiến hoá tận cùng là GIÁC NGỘ TUYỆT ĐỐI; khi còn trong thân xác gọi là Bậc Giác ngộ, Thánh nhân. Tu hành sai, không Minh sư dẫn dắt có thể \"thoái hoá ý thức\" – tẩu hoả nhập ma."}, {"q": "Ý nghĩa của \"ngồi dưới chân Đạo sư\"?", "a": "Gần một xác thân có Ý thức tiến hoá cao sẽ tạo thức tỉnh Tâm linh lây lan – sự chuyển giao năng lượng vô hình, không cần nói hay hỏi gì. Đây cũng là một nghĩa của Upanisad (\"Áo nghĩa thư\" / \"ngồi dưới chân Thầy\")."}, {"q": "Pháp thoại: làm sao nhận ra Ý thức trong đời thường?", "a": "Cái đang nhận biết \"có một sự thắc mắc\", \"hiểu hay không hiểu\", biết mình \"đang ngồi đây\", nếm \"vị chua\" của chanh mà không cần tư duy – đó là Ý thức. Nó chứng kiến cả suy nghĩ cũ lẫn mới nhưng tự nó không suy nghĩ."}, {"q": "Các phương pháp thiền quán sinh từ việc đưa Ý thức vào nhận biết?", "a": "• Hơi thở ra vào → Quán hơi thở (Vipassana).\n• Cảm thọ, hành vi, cử chỉ → Quán Thân.\n• Mọi thứ ở hiện tại → Chánh niệm (Quán Tự Tại).\n• Dao động tại Tâm → Quán Tâm.\n• Dao động tại Trí → Quán Trí.\n• Âm thanh trong Tâm Trí → Quán Âm."}]}, {"part": 1, "num": 5, "title": "Trí và các chức năng của Trí", "summary": "Trí là công cụ sản sinh hình tướng qua tư duy, với 3 chức năng căn bản: sáng tạo chủ động, giải phóng năng lượng (tạp niệm) và thu phát sóng như ăngten (trực giác). Tư duy phát triển nhờ kiến thức chuyên ngành, dấn thân trải nghiệm và sự im lặng của Thiền.", "key": "\"Ngôn ngữ có thể nói dối, nhưng năng lượng thì không.\"", "cards": [{"q": "3 chức năng căn bản của Trí?", "a": "1. Sáng tạo chủ động: tạo \"hiện hữu vô hình\" qua suy nghĩ, phân tích, tưởng tượng…\n2. Giải phóng năng lượng: tự phóng thích năng lượng thô trược qua \"tạp niệm\".\n3. Thu và phát sóng như ăngten: hấp thu, phát tán, xử lý năng lượng Tâm thức (trực giác, thần thông)."}, {"q": "Ẩn dụ máy tính về Trí?", "a": "Thân xác là phần cứng, Trí là phần mềm. Sự \"nhanh chậm\" của một người thể hiện ở việc thấu hiểu nhanh hay chậm – phụ thuộc vào sự sáng của Trí."}, {"q": "3 yếu tố phát triển chức năng tư duy của Trí?", "a": "1. Kiến thức chuyên ngành – nạp \"dữ liệu đầu vào\" (\"học nghề\").\n2. Dấn thân tự trải nghiệm – siêng năng, tận tâm, tự làm.\n3. Sự im lặng (Thiền, ngủ sâu) – kích hoạt năng lượng nguyên thuỷ."}, {"q": "Phân biệt \"sự tiến bộ\" và \"sự tiến hoá\" của Thể Trí?", "a": "• Tiến bộ: nhờ yếu tố 01 (học kiến thức chuyên môn) và 02 (dấn thân trải nghiệm).\n• Tiến hoá: nhờ yếu tố 03 – Thiền vượt ra ngoài mọi cảm thọ và nhận biết, tự động thấu hiểu mà không cần học; làm nên sự thông thái của người Giác ngộ."}, {"q": "Ví dụ: muốn thành doanh nhân cần nạp kiến thức gì?", "a": "Hỏi \"kỹ năng chuyên môn của doanh nhân là gì?\" → bán hàng, marketing, quản trị tài chính, dùng người, đóng gói sản phẩm, xây hệ thống, tầm nhìn dài hạn. Rồi đọc sách, học khoá chuyên sâu, tìm thầy hướng dẫn."}, {"q": "Ẩn dụ \"ném đá xuống hồ\" giải thích chức năng 02 của Trí thế nào?", "a": "Sơ đồ: LỰC tác động MẶT HỒ → tạo ra SÓNG; \"sóng\" làm giải phóng lực ban đầu để mặt hồ về cân bằng. Tương tự: LỰC tác động TÂM TRÍ → tạo ra SUY TƯỞNG; \"suy tưởng, miên man\" giải phóng lực – tức năng lượng Tâm thức (Nghiệp) – để về \"sự im lặng\". Dọn Rác / 5 Bước Tỉnh Thức ứng dụng nguyên lý này.", "d": 1}, {"q": "Nghiệp nặng, nghiệp nhẹ, năng lượng nguyên thuỷ biểu hiện ra sao ở Tâm Trí?", "a": "• Nghiệp nặng: tạp niệm không ngừng, bức xúc, sân si, ghen tuông, có thể tự kỷ, điên loạn.\n• Nghiệp nhẹ: ít tạp niệm, bình thản, dễ cảm thông, Trí im lặng.\n• Nguyên thuỷ cực sạch: thông thái, hạnh phúc, chân ngã, bình an tự tại."}, {"q": "Phân biệt Tiệm ngộ và Đốn ngộ?", "a": "• Tiệm ngộ: hiểu từng bước, thanh tẩy ô trược bằng Thiền theo thời gian – nâng đỡ linh hồn cấp thấp.\n• Đốn ngộ: hiểu tức thì khi nghe pháp thoại, kệ, kinh – chỉ dành cho căn cơ Trí tuệ cao.\nHai điều phải đi cùng nhau."}, {"q": "Trực giác hoạt động theo nguyên lý nào?", "a": "Khi Trí người A nghĩ đến người B, một tia năng lượng Tâm thức tần số β01 (thường hằng của A) chuyển đến Tâm thức B, biến thành β02 (thường hằng của B) rồi trả về. Qua chênh lệch rung động của tia trả về, A cảm ứng được nội tâm B. Điều kiện: β01 phải thanh nhẹ hơn β02 – \"chỉ có cao nhân hơn mới biết đâu là cao nhân\".", "d": 1}]}, {"part": 1, "num": 6, "title": "Tâm và sự hoạt động của Tâm", "summary": "Tâm chỉ là một công cụ – bình chứa năng lượng Tâm thức do Trí khởi sinh; chất lượng của Tâm phụ thuộc hoàn toàn vào năng lượng chứa trong nó. \"Ta là\" chưa bao giờ là Tâm, mà vượt ra ngoài Tâm.", "key": "\"Tâm\" không nghĩ ngợi được; Tâm sinh ra cảm xúc, trạng thái, thái độ – \"Trí\" mới là công cụ tư duy.", "cards": [{"q": "Chức năng của \"Tâm\" là gì?", "a": "Tâm là công cụ tồn tại song song với Trí, hành hoạt trong Vòng tròn số 02 – Tâm thức; hoạt động như một \"bình chứa năng lượng Tâm thức\", chứa toàn bộ năng lượng sống của các ý nghĩ mà Trí khởi sinh."}, {"q": "Ba loại năng lượng tác động vào Tâm sinh ra những trạng thái gì?", "a": "• Năng lượng Tâm thức tiêu cực → bất an, nóng tính, sân si, đố kỵ, ghen tuông...\n• Năng lượng Tâm thức tích cực → hưng phấn, vui vẻ, cảm hứng, khát vọng, lạc quan...\n• Năng lượng nguyên thủy → an lạc, vị tha, bao dung, tự tại, điềm tĩnh – gọi là \"Tâm Giác Ngộ\"."}, {"q": "Sự dao động của Tâm phụ thuộc vào Trí như thế nào?", "a": "• Trí tích cực → Tâm hưng phấn\n• Trí tiêu cực → Tâm bấn loạn\n• Trí im lặng tuyệt đối → Tâm thanh tịnh"}, {"q": "Vì sao câu \"Phật tại Tâm\" được cho là chưa chính xác?", "a": "Vì \"Phật\" chỉ trạng thái tỉnh thức, thuần khiết nhất của Tâm thức (Ý thức thuần khiết, Trí cực sạch, Tâm cực lạc) – nằm ngoài sự hành hoạt của Tâm thức. Phải nói: \"Phật là một trạng thái nằm ngoài Tâm Trí\"."}, {"q": "\"Tâm lực\" và \"Nghiệp lực\" khác nhau thế nào?", "a": "• Tâm lực: năng lượng nguyên thủy chứa trong Tâm; Tâm lực mạnh = năng lượng nguyên thủy dồi dào.\n• Nghiệp lực: năng lượng Tâm thức chứa trong Tâm."}, {"q": "Tâm liên hệ với vận mệnh và thần thái ra sao?", "a": "Tâm chịu sự chi phối của Luật Hấp Dẫn; năng lượng trong Tâm thay đổi thì vận mệnh đổi theo. Thần thái là biểu hiện năng lượng trong Tâm: càng thanh nhẹ càng tươi trẻ, càng nặng nề càng u uất – \"tướng tùy Tâm sinh, tướng tùy Tâm diệt\"."}, {"q": "Phân biệt chức năng của Tâm và Trí?", "a": "• Tâm không nghĩ ngợi được; Tâm sinh ra cảm xúc, trạng thái, thái độ.\n• Trí là công cụ nghĩ ngợi, tư duy; kiến thức, kinh nghiệm được tích lũy tại Trí.\nTâm chỉ là công cụ để trải nghiệm, như cái cuốc, lưỡi cưa."}, {"q": "Sơ đồ: Trí, \"Hiện hữu vô hình\" và Tâm liên hệ thế nào?", "a": "Trí TẠO RA \"Hiện hữu vô hình\". Năng lượng của các \"Hiện hữu\" cộng lại thì tạo thành \"Tâm\" – Tâm là nơi chứa đựng năng lượng của Hiện hữu. Từ Tâm sinh ra:\n• Cảm xúc\n• Tình cảm\n• Trạng thái nội tâm\n• Thái độ", "d": 1}]}, {"part": 1, "num": 7, "title": "Công thức ứng dụng “Trực giác”", "summary": "Trực giác là sự cảm nhận giao thoa năng lượng; vì \"năng lượng không biết nói dối\", hãy làm theo cảm nhận thay vì dùng lý lẽ bao biện cho cảm nhận.", "key": "Năng lượng không biết nói dối – \"Cảm nhận năng lượng = Trực giác\".", "cards": [{"q": "Trực giác vận hành theo công thức nào?", "a": "Trực giác là \"cảm nhận\" sự GIAO THOA NĂNG LƯỢNG."}, {"q": "Trực giác và Thần thông dựa vào 2 công cụ nào?", "a": "1. Sự cảm nhận biết của Ý thức\n2. Sự rung động và dao động của thể Trí và thể Tâm"}, {"q": "Cơ chế giao thoa năng lượng khi người A nghĩ đến người B? Điều kiện để A cảm ứng được B?", "a": "A phóng \"năng lượng tần số ß01\" (Tâm thức thường hằng của A) chuyển đến B; \"năng lượng tần số ß02\" (Tâm thức thường hằng của B) trả về. Qua chênh lệch rung động của tia trả về, A cảm ứng được nội tâm B. Điều kiện: ß01 phải thanh nhẹ hơn ß02.", "d": 1}, {"q": "Công thức ứng dụng Trực giác (\"lời của Trái tim\")?", "a": "• Cảm thấy không ổn, bất an, lo lắng, khó chịu, ràng buộc = Dừng lại và tránh xa.\n• Cảm thấy nhẹ nhàng, thoải mái, tự tin, an lạc = Tiếp tục và đến gần hơn."}, {"q": "Sai lầm \"tự lừa dối cảm nhận của chính mình\" là gì?", "a": "Là dùng lý trí, bằng chứng, lời an ủi để thuyết phục ngược lại cảm nhận (vd: lòng thấy bất an về dự án nhưng cố lấy lý lẽ tin nó sẽ thành công). \"Đừng dùng lý luận để bao biện cho cảm nhận.\""}, {"q": "Vì sao nên tin cảm nhận hơn lý trí khi ra quyết định quan trọng?", "a": "Cảm nhận nói lên năng lượng thật của vấn đề – sự khách quan; còn lý trí chỉ là ý nghĩ chủ quan cá nhân. Lời nói, trang phục, địa vị có thể qua mặt ta, nhưng năng lượng nội tâm thì không thể che đậy."}]}, {"part": 1, "num": 8, "title": "Các hình thái năng lượng tác động lên Tâm Trí", "summary": "Trí và Tâm đều có 3 hình thái căn bản (nguyên thủy, tích cực, tiêu cực) và biến thiên theo nguồn năng lượng tác động lên chúng: Nguyên năng làm Tâm Trí tiến hóa, còn Nghiệp nặng làm Tâm Trí động loạn.", "key": "Làm chủ Trí thì ắt tự động làm chủ được Tâm.", "cards": [{"q": "3 trạng thái căn bản của Trí?", "a": "1. Nguyên thủy của Trí: im lặng thuần khiết, vắng bặt ý nghĩ – \"Trí cực sạch\", dẫn đến Sự Giác Ngộ của Trí.\n2. Tích cực của Trí: nhiều ý nghĩ tích cực, tiền đề cho cảm xúc tích cực.\n3. Tiêu cực của Trí: nhiều ý nghĩ tiêu cực, tiền đề cho khổ đau và bệnh lý nội tâm."}, {"q": "Vì sao \"Quán Trí\" là kỹ thuật quan trọng nhất trong \"Quán Tâm Trí\"?", "a": "Vì Trí là công cụ chủ lực, chủ đạo hình thành các trạng thái cảm xúc của Tâm. Làm chủ Trí thì ắt tự động làm chủ được Tâm."}, {"q": "3 hình thái căn bản của Tâm?", "a": "1. Nguyên thủy của Tâm: \"Tâm vô nhiễm\", an lạc không cần nguyên nhân bên ngoài – Sự Giác Ngộ của Tâm.\n2. Tích cực của Tâm: cảm xúc tích cực thúc đẩy hành động (dùng trong NLP, truyền cảm hứng).\n3. Tiêu cực của Tâm: năng lượng âm, cộng dồn từ ý nghĩ tiêu cực của Trí – \"nghiệp nặng\"."}, {"q": "Con đường duy nhất để đạt trạng thái Nguyên thủy của Tâm?", "a": "Hợp nhất thể với trạng thái \"Trước khi Vũ Trụ hình thành\" – trạng thái \"KHÔNG TỒN TẠI\"; Đạo Phật gọi là \"sự chứng ngộ Tánh Không\"."}, {"q": "Trạng thái \"Tâm bình thường\" là gì và vì sao dễ bị ngộ nhận?", "a": "Là trạng thái \"không cảm xúc\": không vui không buồn, không an lạc, không viên mãn. Người tu tập \"chưa đến nơi đến chốn\" thường ngộ nhận nó là Chân lý, trong khi chưa biết trạng thái nguyên thủy viên mãn của Tâm."}, {"q": "9 trạng thái của Tâm khi Nguyên năng dồi dào tác động?", "a": "Bình an sâu thẳm; an lạc vô tận; tự tại; ung dung; điềm đạm; chân thành và khiêm tốn; hạnh phúc vô bờ; tình yêu thương vô bờ; lòng biết ơn sâu sắc."}, {"q": "Một số \"ấn chứng tiến hóa\" của Trí khi Nguyên năng tác động?", "a": "• Thấu hiểu ngày càng nhanh, thần tốc\n• Cảm ứng năng lượng nhạy bén (khó chịu nơi xô bồ)\n• Sự thông thái viên mãn; Trí im lặng, thanh tịnh\n• Phân tích nhanh, sáng tạo thường xuyên\n• Nhận ra Chân lý, quyết định đúng\n• Chuyên chú hiện tại, xong việc trở về im lặng"}, {"q": "Bản chất của \"Nghiệp\" theo sơ đồ sinh hóa? Có mấy dạng?", "a": "Năng lượng Tâm thức sinh ra từ SỰ SINH HÓA LẦN THỨ II (nhị nguyên – đối lập) đều là Nghiệp. Hai dạng:\n• Nghiệp tiêu cực (\"nghiệp nặng\"): rung động nặng, thô trược.\n• Nghiệp tích cực (\"nghiệp lành\"): rung động nhẹ, tích cực."}, {"q": "Một số biểu hiện khi \"nghiệp nặng\" tác động lên Tâm Trí?", "a": "• Tạp niệm, miên man không ngừng; cảm xúc \"sáng nắng chiều mưa\"\n• Dễ nóng nảy, bức xúc, sân si, đố kỵ, so sánh\n• Không thể ngồi im lặng một mình\n• Dễ bị lời người khác tác động; hay than vãn, lười biếng, lo lắng\n• Nặng hơn: trầm cảm, tâm thần (\"ma nhập\")"}, {"q": "Lời khuyên ứng dụng với người \"nghiệp nặng\"?", "a": "Tránh kết giao thân tình, làm ăn, chọn bạn đời, giao hợp hay sống trong môi trường toàn người nghiệp nặng vì dễ trì trệ năng lượng (\"Gần mực thì đen\"). Tuy nhiên phải uyển chuyển theo hoàn cảnh, công việc (bác sĩ, công an...)."}, {"q": "Sơ đồ sinh hóa từ \"Sự Tuyệt Đối\" gồm những tầng nào?", "a": "Sự Tuyệt Đối → Năng lượng Nguyên thủy → hai nhánh:\n• Sinh hóa lần I (Nhất nguyên – Hợp nhất): năng lượng tiên thiên – tình yêu, biết ơn, hạnh phúc, tự nhiên, thông thái, vị tha, chân thành, tĩnh lặng thuần khiết...\n• Sinh hóa lần II (Nhị nguyên – Đối lập): tách thành Năng lượng (–) và Năng lượng (+).", "d": 1}, {"q": "Năng lượng (–) và (+) của Sinh hóa lần II gồm những gì?", "a": "• Năng lượng (–) – tiêu cực: đau khổ, bức xúc, nặng nề, đố kỵ, ganh ghét, giận dữ, độc ác, bấn loạn, tạp niệm...\n• Năng lượng (+) – tích cực: khát vọng, đam mê, dấn thân, cần cù chịu khó, khiêm tốn, niềm tin, ý chí vươn lên, chính trực...", "d": 1}, {"q": "Khi Nguyên năng tác động lên Tâm Trí thì điều gì xảy ra?", "a": "Nguyên năng TÁC ĐỘNG Tâm Trí → hình thành \"Trạng thái Nhất nguyên của Tâm Trí\", từ đó chi phối:\n• Cảm xúc\n• Tình cảm\n• Trạng thái nội tâm\n• Thái độ\n• Chân ngã xuất hiện", "d": 1}]}, {"part": 1, "num": 9, "title": "Bản ngã và các dạng của bản ngã", "summary": "Bản ngã hình thành từ sự đồng hóa [\"Ta là\" + hình tướng], gồm 3 cấp độ tiêu cực, tích cực, vi tế; con đường hóa giải là dùng sự sáng của Ý thức \"nhận ra\" sự đồng hóa, thực hành qua 5 Bước Tỉnh Thức.", "key": "\"Cái gì nhận ra được thì đều là hiện hữu, đã là hiện hữu thì không phải là Ta.\"", "cards": [{"q": "Công thức hình thành \"bản ngã\"?", "a": "Bản ngã = sự đồng hóa [\"Ta là\" + \"hình tướng\" (bất cứ điều gì đó)] – với cảm xúc, ý nghĩ, thân xác, thể nghiệm Tâm linh... Mọi ý nghĩ về \"Ta là\" đều là sản phẩm Tâm Trí; \"Ta là\" nằm ngoài mọi ý nghĩ."}, {"q": "3 cấp độ của bản ngã?", "a": "Phân biệt bởi cái đằng sau dấu \"+\" (tháp từ thấp lên cao):\n1. Cấp độ I – Bản ngã tiêu cực: \"Ta là\" + hình tướng tiêu cực (ý nghĩ, cảm xúc, hình ảnh, vọng tưởng, tạp niệm, tính cách tiêu cực...)\n2. Cấp độ II – Bản ngã tích cực: \"Ta là\" + hình tướng tích cực\n3. Cấp độ III – Bản ngã tinh vi (vi tế): \"Ta là\" + hình tướng vi tế", "d": 1}, {"q": "Tâm Pháp tối thượng phủ định công thức bản ngã là gì?", "a": "\"CÁI GÌ NHẬN RA ĐƯỢC THÌ KHÔNG PHẢI LÀ TA\" – phủ định sự đồng hóa với hình tướng, làm sụp đổ cấu trúc [\"Ta là\" + bất cứ điều gì đó], gia tăng sự sáng của Ý thức."}, {"q": "Bản ngã sợ nhất hai điều gì? Pháp tu tương ứng?", "a": "1. Sự sáng của Ý thức → Pháp \"Tất Cả Chỉ Là Ý Nghĩ\".\n2. Năng lượng Tình yêu → Pháp sám hối, Hooponopono.\nMinh Sư luôn có cả hai, nên bản ngã sợ hãi khi đối diện Minh Sư."}, {"q": "Vì sao dùng cái tích cực đè lên cái tiêu cực (như NLP) không đem lại an lạc bền vững?", "a": "Đó là lấy \"cái rác tích cực\" chèn lên \"cái rác tiêu cực\". Chỉ hiệu quả nhất thời; theo thời gian Tâm Trí mệt mỏi với điều \"tự kỷ ám thị\" và nhanh chóng quay lại động loạn. Chân lý là yên lặng – không đồng hóa với tiêu cực lẫn tích cực."}, {"q": "\"Bản ngã vi tế\" thường gặp ở ai và biểu hiện ra sao?", "a": "Ở người mới tu hoặc thiền một thời gian gặp thể nghiệm vi ảo, rồi đồng hóa với chúng – ngỡ mình đã thành \"vị này, đấng kia\". Nó yêu thích đặc dị công năng, cảnh giới, chứng đắc, được xưng tụng. Mọi thể nghiệm Tâm linh chỉ là \"đống rác chưa dọn sạch\"."}, {"q": "Một số biểu hiện phổ biến của bản ngã?", "a": "• Thích được khen, xưng tụng, chú ý\n• Hay so sánh, đố kỵ, sợ người khác hơn mình\n• Dễ tự ái, dễ tổn thương\n• Muốn thắng, dẫn đầu, chứng tỏ bản thân\n• Ham chứng đắc, muốn thành Phật, Bồ tát\n• Bận tâm người khác nói gì về mình; thích khoe hiểu biết"}, {"q": "Ý nghĩa Tâm Pháp \"Còn Ta thì sẽ còn cái khác Ta\"?", "a": "Còn \"Ta\" thì còn đủ thứ \"xung quanh Ta\": bận tâm cảnh giới, chứng đắc, quả vị, người khác nói gì, ham thần thông, \"Phật của Ta\"... Người Giác ngộ không biết đến sự tồn tại của \"Ta\" nên không vướng bận những thứ ấy."}, {"q": "Phân biệt \"bản ngã dẫn dắt hành vi\" và \"Ý thức dẫn dắt hành vi\"?", "a": "• Bản ngã dẫn dắt: không nhận ra ý nghĩ, đồng hóa \"Ta là ý nghĩ đó\" → ý nghĩ điều khiển hành vi (vd: kỳ thị người giàu, kỳ thị chủng tộc).\n• Ý thức dẫn dắt: nhận ra ý nghĩ, hiểu \"Đó không phải là Ta\" → hành động trong tỉnh thức."}, {"q": "5 Bước Tỉnh Thức (Sơ Thiền)?", "a": "1. Tự hỏi: \"Ngay lúc này, điều gì đang hiện hữu trong Tâm Trí?\"\n2. Nhận ra và trả lời (hoặc niệm \"Đó không phải là Ta\")\n3. Quay lại bước 1\n4. Quay lại bước 2\n5. Kéo dài đến bất tận (đến khi Trí sạch hình tướng, Tâm thanh tịnh)"}, {"q": "5 Bước Tỉnh Thức nâng cao khác gì bản cơ bản?", "a": "Sau khoảng 3–6 tháng, khi hướng nội đã thành thói quen, bỏ bước tự hỏi; chỉ còn: \"Nhận ra\" mọi hiện hữu → \"Trả lời\" → lặp lại → kéo dài đến bất tận."}, {"q": "Vì sao phải \"Trả lời\" chứ không chỉ \"Nhận ra\"? Trả lời thế nào với hiện hữu mơ hồ?", "a": "Không trả lời thì Ý thức bị cuốn theo Tâm Trí, không tách rời khỏi hình tướng → hôn trầm (ngủ gục). Trả lời cụ thể điều gì đang hiện hữu; nếu mơ hồ không diễn đạt được thì nói: \"Cái đó đang hiện hữu\"."}, {"q": "3 giai đoạn \"dao động tắt dần\" khi thực hành 5 Bước Tỉnh Thức?", "a": "1. Làm sạch Thượng thức: nhận biết hình tướng, đánh tan năng lượng tồn đọng.\n2. Ý thức xuống Tiềm thức, gột rửa hình tướng mơ hồ (5 bước nâng cao).\n3. Lắng sâu hơn Tiềm thức, tính nhận biết tan đi → NHẬP ĐẠI ĐỊNH.\nSơ đồ: biên độ dao động nội tâm giảm dần theo thời gian.", "d": 1}, {"q": "Ý nghĩa từ \"Chứng ngộ\"?", "a": "\"Chứng\" là tự thân kinh nghiệm, \"Ngộ\" là thấu hiểu. Chứng ngộ là tự thân kinh nghiệm qua để đạt sự thấu hiểu bản chất – vì vậy tu tập phải qua THỰC HÀNH và LUYỆN TẬP."}, {"q": "Những hình tướng hình thành \"Bản ngã tinh vi\"?", "a": "Sự đồng hóa \"Ta là\" với:\n• Thể nghiệm kỳ ảo\n• Năng lượng vi tế\n• Trạng thái khó diễn tả\n• Nhìn thấy điều kỳ thú\n• Đặc dị công năng\n• Ngộ tưởng quả vị\n• ...nhiều suy tưởng khác", "d": 1}, {"q": "\"Lăng kính Tâm Trí\" dẫn dắt hành vi thế nào (ví dụ người A và sự giàu có)?", "a": "Giữa người A và \"sự giàu có\", lăng kính Tâm Trí sinh khởi các ý niệm: \"chỉ dành cho người may mắn\", \"người giàu thật đáng ghét\", \"người giàu không có đạo đức\", \"tiền nhiều chỉ đau khổ\"... A đồng hóa mình với các ý nghĩ ấy → khinh miệt người giàu, từ chối cơ hội làm giàu. Tương tự người B kỳ thị người da đen.", "d": 1}]}, {"part": 1, "num": 10, "title": "“Nghiệp” – bản chất & sự vận hành", "summary": "Nghiệp chỉ là năng lượng Tâm thức nhị nguyên (tích cực/tiêu cực), vận hành theo Luật Nhân Quả, Hấp Dẫn, Lượng Đủ – Chất Đổi; nó tồn tại ở cấp cá thể lẫn quần thể và có thể được gột rửa bằng sự sáng của Ý thức và năng lượng Tình yêu.", "key": "\"Nghiệp\" là sản phẩm của Tâm Trí và có thể gột rửa – con người hoàn toàn làm chủ được vận mệnh của mình.", "cards": [{"q": "Năng lượng Tâm thức gồm những khía cạnh nào và đâu là \"Nghiệp\"?", "a": "• Năng lượng nhất nguyên (sinh hóa lần I): tình yêu, đức tin, vị tha, bao dung... – không phân cực, gọi là CHÂN NGÃ hay PHẬT TÍNH.\n• Năng lượng nhị nguyên (sinh hóa lần II): tích cực (+) và tiêu cực (–) – cổ xưa gọi là NGHIỆP."}, {"q": "Quan hệ giữa Nghiệp và bản ngã?", "a": "Nghiệp là nguyên nhân cốt lõi hình thành nên bản ngã; và bản ngã chính là CÁI LÕI CỦA NGHIỆP."}, {"q": "Nghiệp chuyển động theo 3 quy luật chủ đạo nào?", "a": "1. Luật Nhân Quả\n2. Luật Hấp Dẫn\n3. Luật Lượng Đủ – Chất Đổi\nKhông Ý thức cá nhân hay Minh Sư nào thay đổi được sự định sẵn ấy."}, {"q": "Chuỗi thực hành để làm chủ sự vận hành của Nghiệp?", "a": "Làm chủ Nghiệp ← làm chủ Tâm Trí 100% ← gia tăng sự sáng của Ý thức ← thực hành 5 BƯỚC TỈNH THỨC. Nghiệp tan dưới sự sáng của Ý thức (tỉnh thức) và dưới năng lượng Tình yêu."}, {"q": "6 lớp nghiệp một Minh Sư phải chấp nhận khi hiện diện trong thân người?", "a": "(1) Nghiệp Địa cầu, (2) Châu lục, (3) Quốc gia, (4) Vùng miền, (5) Gia đình – dòng tộc, (6) Ba mẹ. Vì vậy lúc mới sinh Minh Sư cũng vô minh như trẻ khác, đến khi chín muồi mới tự thức tỉnh."}, {"q": "Phân biệt Nghiệp lành và Nghiệp chướng?", "a": "• Nghiệp lành (thuận nghiệp): năng lượng tích cực tạo thuận lợi – lòng thiện nguyện, tư tưởng cho đi, khát vọng, đam mê.\n• Nghiệp chướng (nghịch nghiệp): năng lượng gây chướng ngại, tồn đọng lâu ngày hoặc lây nhiễm – tạp niệm, bất an, nóng nảy, ích kỷ."}, {"q": "Ví dụ hòn đá ném xuống hồ minh họa điều gì?", "a": "Đá nhỏ → sóng nhỏ, nhanh lặng; đá to → sóng lớn, lâu lặng. Tương tự, chỉ cần quan sát dao động nội tâm (Tâm tính) của một người – hay của chính mình – là biết Nghiệp nặng hay nhẹ."}, {"q": "Biểu hiện của Nghiệp nặng, Nghiệp nhẹ và Cực sạch Nghiệp?", "a": "• Nghiệp nặng: nội tâm động loạn, stress, sân si; nặng hơn là trầm cảm, điên loạn.\n• Nghiệp nhẹ: nội tâm nhẹ nhàng, tích cực, bác ái, nhưng chưa có an lạc sâu thẳm.\n• Cực sạch Nghiệp: Tâm an lạc vô tận, Trí thông thái, Chân ngã hiển lộ – GIÁC NGỘ."}, {"q": "Nghiệp cá thể và nghiệp quần thể?", "a": "• Nghiệp cá thể: năng lượng Tâm thức riêng của một người, tạo tính cách cá nhân.\n• Nghiệp quần thể: tổng năng lượng Tâm thức các cá thể – gồm nghiệp gia đình, vùng miền, quốc gia, châu lục, toàn địa cầu; quyết định văn hóa, vận mệnh chung."}, {"q": "Vì sao Thượng Đế tạo ra Nghiệp?", "a": "Vì Nghiệp góp phần tạo nên sự sáng tạo của Vũ Trụ – làm Vũ Trụ đa hình, đa tướng, biến hóa. Nghiệp cũng là người thầy vĩ đại giúp linh hồn già dặn và trưởng thành."}, {"q": "Kiếp nạn của nhân loại hình thành thế nào?", "a": "Khi năng lượng Tâm thức ô uế tích trữ đủ qua nhiều thế hệ, kiếp nạn xuất hiện (chiến tranh, tai ương, dịch bệnh) – đó là sự \"gột rửa năng lượng của tự nhiên\"; năng lượng thanh nhẹ trở lại thì kiếp nạn qua đi."}, {"q": "Theo sơ đồ sinh hóa, Nghiệp nằm ở nhánh nào và gồm những năng lượng gì?", "a": "Nghiệp thuộc nhánh SINH HÓA LẦN II (Nhị nguyên – Đối lập):\n• (–): đau khổ, bức xúc, nặng nề, đố kỵ, ganh ghét, giận dữ, độc ác, bấn loạn...\n• (+): khát vọng, đam mê, dấn thân, cần cù, khiêm tốn, niềm tin, ý chí, chính trực...\nNhánh Sinh hóa lần I (tình yêu, biết ơn, vị tha...) là Chân ngã, không phải Nghiệp.", "d": 1}]}, {"part": 1, "num": 11, "title": "Bản chất của “phút giây hiện tại”", "summary": "Thời gian chỉ là khái niệm công cụ của Tâm Trí; khổ đau không đến từ quá khứ hay tương lai mà từ năng lượng các hình tướng trong Tâm Trí. Chất lượng \"Phút giây hiện tại\" phụ thuộc hoàn toàn vào chất lượng Tâm Trí, và chỉ thành \"Thực tại hiện tiền\" khi Tâm Trí cực sạch.", "key": "Không phải làm chủ thời gian, mà là học cách làm chủ bản thân trong khoảng thời gian đó.", "cards": [{"q": "Bản chất của \"thời gian\"?", "a": "Thời gian là khái niệm do Tâm Trí định hình, không có thật – một trạng thái tâm lý, hình thành nhờ \"sự chứng kiến\" chuyển động tuần hoàn (mặt trời mọc lặn → ngày; bốn mùa → năm). Không còn chứng kiến tuần hoàn thì không còn khái niệm thời gian."}, {"q": "\"Quá khứ\" và \"Tương lai\" được định nghĩa thế nào?", "a": "• Quá khứ: những hiện hữu lưu giữ trong ký ức, trí nhớ.\n• Tương lai: vọng tưởng, suy tưởng của Tâm Trí về điều chưa đến – công cụ để hoạch định cuộc sống."}, {"q": "Khổ đau có phải do Tâm Trí bám vào quá khứ, tương lai?", "a": "Không. Khổ đau sinh ra từ sự tổ hợp \"năng lượng sống\" của các hình tướng đang diễn ra trong Tâm Trí. Quá khứ, hiện tại, tương lai chỉ là khái niệm thời gian, không phải tác nhân của khổ đau."}, {"q": "Người Giác ngộ khác người bình thường ở điểm nào khi dùng Tâm Trí?", "a": "Ở năng lực kiểm soát và làm chủ Tâm Trí: họ vẫn có thể phóng chiếu tương lai để hoạch định, truy cập quá khứ để lấy dữ liệu – nhưng tất cả dưới sự kiểm soát hoàn toàn của Ý thức."}, {"q": "3 trường hợp của \"Phút giây hiện tại\"?", "a": "• Tâm Trí tiêu cực → Phút giây hiện tại là đau khổ.\n• Tâm Trí tích cực → Phút giây hiện tại là tích cực.\n• Tâm Trí cực sạch → Phút giây hiện tại trở thành \"Thực tại hiện tiền\"."}, {"q": "\"Thực tại hiện tiền\" là gì?", "a": "Là trạng thái tĩnh mặc hoàn toàn khi Tâm Trí tinh khôi, thuần tịnh, im lặng thuần khiết; người đó xúc chạm được vẻ đẹp tinh khôi của vạn vật như \"bản chất của nó là\"."}, {"q": "Giải nghĩa \"Chánh niệm\"?", "a": "\"Chánh\" là sự thật đang được Ý thức chứng kiến; \"Niệm\" là hiện hữu, hình tướng, tổ hợp mọi cảm thọ. Thực hành Chánh niệm là đưa Ý thức nhận biết mọi cảm thọ trên thân và Tâm Trí ngay đây và bây giờ – giống 5 Bước Tỉnh Thức."}, {"q": "Một số thể nghiệm về \"Thực tại hiện tiền\"?", "a": "• Trí vắng bặt ý nghĩ; Tâm an lạc, thư thái\n• Vạn vật tươi mới như nhìn lần đầu, lung linh dưới ánh sáng\n• Nhẹ nhàng như hư không; cảm nhận vạn vật và bản thể hợp nhất\n• Bao dung, cảm thông; Trí tập trung\nChúng tự động hiển lộ, không do cố gắng."}, {"q": "Những câu tự hỏi để nhận biết \"Phút giây hiện tại\"?", "a": "• Ý nghĩ gì đang hiện hữu ngay lúc này?\n• Trạng thái gì đang hiện hữu ngay lúc này?\n• Cảm giác gì đang hiện hữu ngay lúc này?\n• Tâm trạng gì đang hiện hữu ngay lúc này?", "d": 1}]}, {"part": 1, "num": 12, "title": "Vô ngã", "summary": "Vô ngã là \"không còn cái gọi là Ta\" – tồn tại đối lập với Bản ngã; không cần đi tìm Vô ngã mà chỉ cần ý thức sâu sắc về sự tồn tại của Bản ngã để thuộc tính Vô ngã tự hiển lộ.", "key": "Đừng đi tìm \"Tâm thức Vô ngã\", hãy ý thức sâu sắc về sự tồn tại của \"Bản ngã\".", "cards": [{"q": "Định nghĩa \"Vô ngã\"?", "a": "\"Vô\" là không, \"Ngã\" là hình tướng: Vô ngã là \"vô hình tướng\", \"vô hiện hữu\". Nói ngắn gọn: \"Không còn có cái gọi là Ta\" – giống trạng thái \"Trước khi Vũ Trụ hình thành\"."}, {"q": "Con đường duy nhất tiến đến Vô ngã?", "a": "\"Ý thức về sự tồn tại của cái gọi là Ta\" – có thể bắt đầu bằng câu hỏi \"Ai đang tồn tại?\", \"Đó là Ta sao?\" hoặc các Tâm Pháp. Đòi hỏi sự sáng của Ý thức đạt ngưỡng nhất định."}, {"q": "Vì sao \"không có ai đạt trạng thái Vô ngã\"?", "a": "Vì \"có đạt được\" nghĩa là có \"chủ nhân của sự đạt được\" – tức là có Bản ngã. Mọi ham muốn đạt Vô ngã hay thoát khỏi Bản ngã đều là thị hiện của Bản ngã (vi tế hơn)."}, {"q": "Đối thoại Lương Vũ Đế – Bồ Đề Đạt Ma thể hiện Vô ngã thế nào?", "a": "Vua hỏi xây chùa, chép kinh có công đức gì – Đạt Ma: \"Không có công đức\"; công đức thật là Trí thanh tịnh, Thể trống không. Hỏi \"Ai đang đối diện với trẫm?\" – đáp: \"Tôi không biết.\""}, {"q": "Quan hệ giữa \"Vô ngã\" và \"Tự nhiên\"?", "a": "Vô ngã là TỰ NHIÊN: ai càng tự nhiên càng gần Vô ngã; càng xã giao, ngượng ngùng, thể hiện ta đây hay càng khiêm tốn là đi ngược tự nhiên – tức Bản ngã. Như tim tự bơm máu, mọi thứ tự động mà toàn hảo."}, {"q": "Những tên gọi khác nhau nhưng cùng bản chất với Vô ngã?", "a": "Tánh Không, Niết Bàn, Giải Thoát, Không Còn Ta, Không Có, Không Tồn Tại, Không Còn \"Cái Gọi Là Ta\", Thiên Đàng..."}, {"q": "Đặc điểm của người \"Vô ngã\"?", "a": "• Không bận tâm người khác nói gì – \"Tâm bất biến giữa dòng đời vạn biến\"\n• Không đồng hóa với danh hiệu, địa vị, tiền bạc → cầm lên được, bỏ xuống được\n• Không bận tâm luân hồi, thần thông, cảnh giới\n• Sống thuận tự nhiên: đói ăn, khát uống, mệt ngủ"}, {"q": "Ví dụ minh họa quan hệ Bản ngã – Vô ngã?", "a": "Bản ngã như mây đen che Mặt Trời; Vô ngã và thuộc tính của nó là những điều tuyệt vời sau lớp mây. Triệt tiêu dần Bản ngã sẽ TỰ ĐỘNG hiển lộ Vô ngã – như hạnh phúc chỉ xuất hiện khi khổ đau được hóa giải."}, {"q": "3 giai đoạn hành trình tiến lên \"Tâm thức Vô ngã\"?", "a": "1. Tách rời Ý thức khỏi hình tướng nội tâm → tăng khả năng làm chủ Tâm Trí.\n2. Hóa giải trược năng lượng, Trí thanh tịnh, tính cách thô trược tiêu biến – \"Vô ngã tương đối\".\n3. Hợp nhất với Tĩnh lặng tuyệt đối, chấm dứt mọi định nghĩa \"Ta là\" – \"Vô ngã tuyệt đối\"."}]}, {"part": 1, "num": 13, "title": "Chân ngã", "summary": "Chân ngã là hình tướng nguyên thủy đầu tiên của Tạo Hóa (sinh hóa lần I), hiển lộ khi Bản ngã và lớp màn suy tưởng tan rã; đích đến của mọi tôn giáo là Chân ngã, và nó chỉ được tìm thấy trong hành trình nội tâm.", "key": "Đích đến của mọi tôn giáo là \"Chân ngã\" – Chân lý hiện hữu trong cuộc hành trình nội tâm.", "cards": [{"q": "Định nghĩa \"Chân ngã\"?", "a": "\"Chân\" là sự thật, \"Ngã\" là hình tướng: Chân ngã là hình tướng nguyên thủy đầu tiên của Tạo Hóa – năng lượng nguyên thủy và các năng lượng từ SINH HÓA LẦN I; là cái còn lại sau sự sụp đổ của hình tướng và Bản ngã."}, {"q": "Vì sao \"khiêm tốn\" và \"tự tin\" không phải là Chân ngã?", "a": "Chúng chỉ là trạng thái tích cực của Tâm Trí, sinh từ ý nghĩ tích cực. Chân như thực tướng là \"SỰ TỰ NHIÊN\" – trạng thái không có ý nghĩ tích cực hay tiêu cực, sinh ra từ sự im lặng của Tâm Trí."}, {"q": "Pháp thoại về người sợ thuyết trình giải thích Chân ngã thế nào?", "a": "Khi sợ hãi, run rẩy tan biến, điều còn lại không phải \"sự tự tin\" mà là \"SỰ TỰ NHIÊN\" – vô tư, điềm đạm, tự tại, im lặng. Chân ngã là cái ẩn đằng sau mọi trạng thái tích cực lẫn tiêu cực."}, {"q": "Một số hình tướng nguyên thủy biểu hiện Chân ngã?", "a": "Sự tự nhiên, chân thành, tình yêu, điềm đạm, im lặng nội tâm, thanh bình, tự tại, ung dung, uyển chuyển, vị tha, bao dung, tĩnh mịch, Đức tin, sự sáng của Ý thức (14 hình tướng)."}, {"q": "Phân biệt \"Niềm tin\" và \"Đức tin\"?", "a": "• Niềm tin: năng lượng tích cực từ ý nghĩ tích cực về bản thân (vd: tin mình sẽ giàu) – công cụ thôi thúc hành động; không phải Chân ngã.\n• Đức tin: hình thái của Chân ngã, \"năng lượng chữa lành\" – tin tưởng thiêng liêng vô điều kiện vào điều không thể nghĩ bàn."}, {"q": "4 nguồn năng lượng Chân ngã mạnh mẽ nhất để chữa lành và gột rửa nghiệp lực?", "a": "1. Sự sáng của Ý thức\n2. Năng lượng Tình yêu\n3. Đức tin Thiêng liêng\n4. Lòng Biết Ơn"}, {"q": "\"Chân ngôn\" là gì? Kể vài Chân ngôn của Pháp Thiền \"Tất Cả Chỉ Là Ý Nghĩ\".", "a": "Chân ngôn (Kinh, Man-tra) là ngôn ngữ thị hiện sự thật, bản chất của sự vật. Ví dụ:\n• \"Tất Cả Chỉ Là Ý Nghĩ\"\n• \"Cái gì nhận ra được thì không phải là Ta\"\n• \"Ta nằm ngoài mọi ý nghĩ\"\n• \"Còn Ta thì sẽ còn cái khác Ta\"\n• \"Nếu Ta không tồn tại, điều gì còn lại?\""}, {"q": "Một số Chân ngôn phổ biến được nhắc đến?", "a": "• Huyền âm Aum/Om (cũng phát ra từ tiếng chuông)\n• Amen, A Di Đà Phật\n• Om Mani Padme Hum – \"Ngọc sáng trong hoa sen\", tức Sự Tuyệt Đối ẩn trong thiên hình vạn trạng\n• Chú Đại Bi\n• \"KHÔNG CÓ\" – Đạo danh của Sư phụ"}, {"q": "Dấu hiệu tu tập đi sai đường và đúng đường?", "a": "• Sai: nội tâm ngày càng bất an, tạp niệm; mê tín, sợ Thần Phật; ngã mạn, sân si tăng.\n• Đúng: nội tâm thanh tịnh, Tâm Trí im lặng; tự tin, lấy hành trình nội tâm làm duy nhất; Đức tin vào Tạo Hóa; sống thực, thực dụng với hiện tại."}, {"q": "Quan điểm của tác giả về tôn giáo?", "a": "Tôn giáo như \"thuốc an thần cho những bản ngã đầy sợ hãi\", một công cụ \"an thân nội tâm\", như ngôi trường cho linh hồn chưa tiến hóa cao – không phải Chân lý. Không bác bỏ tôn giáo; người Giác ngộ có thể ở trong tôn giáo hoặc không, tùy hạnh nguyện."}, {"q": "Nguyên lý \"3 vòng tròn cấu tạo nên vạn vật\" thị hiện Chân ngôn \"Om Mani Padme Hum\" thế nào?", "a": "Ba vòng tròn đồng tâm, từ trong ra ngoài:\n1. \"Sự Tuyệt đối\" (lõi – \"ngọc sáng\")\n2. \"Tâm thức Vũ Trụ\" (Thế giới Tâm thức)\n3. \"Hữu hình Thế giới\" (thế giới các hạt vật chất)\nSự Tuyệt đối – Tánh không ẩn trong thiên hình vạn trạng.", "d": 1}, {"q": "Vì sao trên sơ đồ sinh hóa, \"khiêm tốn\", \"niềm tin\" không phải Chân ngã?", "a": "Chân ngã là năng lượng từ SINH HÓA LẦN I (Nhất nguyên): tình yêu, biết ơn, hạnh phúc, tự nhiên, thông thái, vị tha, chân thành, tĩnh lặng thuần khiết. Còn khiêm tốn, niềm tin, khát vọng, đam mê... thuộc Năng lượng (+) của SINH HÓA LẦN II (Nhị nguyên) – chỉ là trạng thái tích cực.", "d": 1}]}, {"part": 1, "num": 14, "title": "Chấp và không chấp", "summary": "\"Chấp\" chỉ đơn giản là mọi hình tướng (ý nghĩ, cảm xúc, suy diễn) sinh khởi trong Tâm Trí về một sự vật hiện tượng – mỗi cái là một sợi dây ràng buộc gây khổ đau; Tâm Trí cực sạch, im lặng chính là \"Không chấp vào đâu\".", "key": "Ta chỉ cõng cô gái qua sông, còn con đã cõng cô ấy đi hết 10 ngày đường.", "cards": [{"q": "Câu chuyện \"Đạo sư cõng cô gái qua sông\" dạy điều gì?", "a": "Đạo sư cõng cô gái qua sông rồi buông; người đệ tử thì suy diễn, ấm ức suốt 10 ngày – \"Ta chỉ cõng cô gái qua sông, còn con đã cõng cô ấy đi hết 10 ngày đường.\" Khổ đau đến từ suy diễn trong Tâm Trí, không phải từ sự việc."}, {"q": "Định nghĩa ngắn gọn nhất về \"Chấp\"?", "a": "Bất kỳ sự sinh khởi nào trong Tâm Trí mà Ý thức nhận ra được (ý nghĩ, hình ảnh, cảm xúc, suy diễn, thắc mắc, thể nghiệm...) đối với một sự vật hiện tượng đều gọi là \"Chấp\"."}, {"q": "Công thức trạng thái của Tâm trong ví dụ người đệ tử?", "a": "Lăng kính Tâm Trí của chàng trai sinh khởi: bực dọc, thắc mắc, tò mò, \"phải hỏi cho ra lẽ\", hình ảnh tưởng tượng... TRẠNG THÁI CỦA TÂM = ß01 + ß02 + ß03 + ... + ßn – tổng năng lượng rung động các hình tướng đó; là \"cốt lõi của đau khổ\".", "d": 1}, {"q": "3 hình thái của \"Chấp\"?", "a": "1. Cái chấp tiêu cực: ý nghĩ tiêu cực, so sánh, bảo thủ, sân si.\n2. Cái chấp tích cực: ý nghĩ tích cực (như NLP), khát vọng, đồng hóa với thành tựu – tích cực nhưng không an lạc.\n3. Không chấp vào đâu: Tâm Trí cực sạch, im lặng."}, {"q": "Cốt tủy Kinh Kim Cang theo tác giả là gì?", "a": "\"Ưng vô sở trụ\" – \"Không Chấp vào đâu\", hiểu đúng nhất là TÂM TRÍ CỰC SẠCH (Trí cực định, Tâm cực tĩnh)."}, {"q": "Cách để \"những cái Chấp\" mất đi (phá chấp)?", "a": "Nhận ra sự có mặt của mọi ý nghĩ, cảm xúc khi chúng xuất hiện, tín tâm tuyệt đối và lặp lại: \"CÁI GÌ NHẬN RA ĐƯỢC THÌ KHÔNG PHẢI LÀ TA\". Quán Tâm, Quán Trí chính là đang thực hành PHÁ CHẤP."}, {"q": "\"Không quan tâm đích thực\" nghĩa là gì?", "a": "Là không còn bất cứ ý nghĩ gì về sự việc đó, Tâm Trí cực sạch, thảnh thơi – chứ không phải miệng nói \"không quan tâm\" mà Tâm Trí vẫn bức xúc, nghĩ ngợi về nó."}, {"q": "Vì sao càng nghĩ ngợi nhiều về công việc thì càng trục trặc?", "a": "Theo Luật Hấp Dẫn: Tâm Trí nghĩ ngợi, được mất, tính toán mang năng lượng thô trược → hút trục trặc; Tâm Trí thanh sạch, nhẹ nhàng → hút thuận lợi, may mắn."}, {"q": "Tên gọi khác của \"Chấp\" và hệ quả của nó?", "a": "\"Sợi dây ràng buộc (vô hình) trong Tâm Trí\" – mỗi ý nghĩ/hiện hữu là một sợi dây. Chấp sinh định kiến, bảo thủ, cái nhìn chủ quan; là một hình thái của bản ngã để tự bảo vệ. Chặt đứt mọi sợi dây thì Tâm Trí giải thoát."}, {"q": "Câu của Bồ Đề Đạt Ma về \"chấp\" được hiểu ngày nay ra sao?", "a": "\"Vạn pháp vốn chẳng tự có, do ta chấp có nó thành có, do ta chấp không nó thành không\" – ngày nay đơn giản là: \"TẤT CẢ CHỈ LÀ Ý NGHĨ\"."}, {"q": "Sơ đồ \"sợi dây ràng buộc\" của Tâm Trí?", "a": "Tâm Trí phóng ý nghĩ đến: sự vật sự việc, hiện tượng, con người, kiến thức, sự nghiệp, vân vân... – mỗi cái lại nối với quá khứ, hiện tại, tương lai. Mỗi ý nghĩ là một sợi dây ràng buộc Tâm Trí; càng nhiều ý nghĩ, càng nhiều \"cái Chấp\".", "d": 1}]}, {"part": 1, "num": 15, "title": "Đức tin và niềm tin", "summary": "Đức tin là sự tin tưởng dành cho những điều nằm ngoài hiện hữu (năng lượng không phân cực, giúp thấu hiểu Đạo), còn Niềm tin dành cho những điều nằm trong hiện hữu (năng lượng tích cực, giúp thành công ngoài Đời). Niềm tin có thể nuôi dưỡng chủ động bằng công thức \"Nạp năng lượng cho hiện hữu\".", "key": "Đức tin là sự thấu hiểu Đạo, Niềm tin là sự thấu hiểu Đời — phải có cả hai song song mới trọn vẹn Đạo và Đời.", "cards": [{"q": "\"Đức tin\" là gì?", "a": "ĐỨC TIN = SỰ TIN TƯỞNG + PHẠM TRÙ \"NẰM NGOÀI MỌI HIỆN HỮU\" — ngoài tâm trí, ngoài sự nghĩ bàn và tư duy của con người. Ví dụ: Đức tin vào Đấng Sáng tạo, Thiên Chúa, Phật, Thượng Đế, Tạo Hoá.", "d": 1}, {"q": "Đức tin thuộc dạng năng lượng nào?", "a": "Năng lượng không phân cực, được tạo ra từ sự sinh hoá đầu tiên của \"năng lượng nguyên thuỷ\" — một trong những dạng năng lượng tinh khiết nhất của Vũ Trụ Tâm Thức, có sức chuyển hoá Tâm linh mạnh mẽ. Cùng nhóm: tình yêu, biết ơn, vị tha, hạnh phúc, an lạc."}, {"q": "Vai trò của Đức tin trong quan hệ Sư phụ – Đệ tử?", "a": "Đức tin là cổng kết nối Tâm linh, cầu nối giữa vùng năng lượng cao và thấp, cho phép sự thức tỉnh của Thầy chuyển giao sang trò một cách TỰ ĐỘNG (tinh hoa Upanishad: \"Ngồi dưới chân Thầy\"). Chỉ một ý niệm nghi ngờ, xem thường → Đức tin sụp đổ, kết nối dừng lại, đệ tử không tiến hoá."}, {"q": "Phân biệt Đức tin và Mê tín?", "a": "• Đức tin luôn đi kèm SỰ BIẾT ƠN.\n• Mê tín đi kèm SỰ SỢ HÃI + KHÔNG CÓ NIỀM TIN VÀO BẢN THÂN, không có năng lượng biết ơn.\n\"Sự sợ hãi\" là ấn chứng dễ thấy nhất của mê tín."}, {"q": "Những biểu hiện cụ thể của Mê tín?", "a": "• Lên đồng, nhập đồng (mời \"bản ngã không xác thân\" nhập vào)\n• Quỳ lạy, cúng bái, van xin\n• Xem bói, tử vi\n• Xin xăm, xin quẻ\n• Không tin bản thân, không dấn thân lao động, hão huyền chờ thần Phật độ trì"}, {"q": "\"Niềm tin\" là gì? Khác Đức tin thế nào?", "a": "NIỀM TIN = SỰ TIN TƯỞNG + PHẠM TRÙ \"NẰM TRONG HIỆN HỮU\" — điều Tâm Trí nghĩ bàn, tưởng tượng, nhận ra được (vd: tin mình sẽ kiếm 200 triệu/tháng). Cái Ý thức không thể nhận ra là ngoài hiện hữu — thuộc về Đức tin.", "d": 1}, {"q": "Niềm tin thuộc dạng năng lượng nào và vai trò ra sao?", "a": "Năng lượng tích cực (+), tạo ra từ sự sinh hoá lần thứ 2 (nhị nguyên) của năng lượng nguyên thuỷ. Niềm tin là chất xúc tác quan trọng nhất để DUY TRÌ HÀNH ĐỘNG LIÊN TỤC; mất niềm tin thì hành động chấm dứt."}, {"q": "Ví dụ bộ ba năng lượng ở sự sinh hoá lần thứ 2?", "a": "• Tự tin (+) / Tự ti (−) / Tự nhiên (Chân ngã)\n• Dấn thân (+) / Lười biếng (−) / Thảnh thơi\n• Niềm tin (+) / Sợ hãi (−) / Bình thản nội tâm (Tuỳ duyên)\n• Khát vọng (+) / Đố kỵ (−) / Tĩnh lặng thuần khiết"}, {"q": "Công thức \"Nuôi dưỡng năng lượng niềm tin\" gồm các bước nào?", "a": "1. Chọn một ý niệm\n2. Nạp năng lượng: liên tục nghĩ đến, liên tục lặp lại bằng lời, kèm câu \"Tôi tin tôi làm được trong thời gian sớm nhất có thể\"\n3. Lặp lại bước 2 liên tục\n4. Niềm tin đủ mạnh sinh ý tưởng, kế hoạch, thôi thúc hành động\n5. Hành động theo mách bảo\n6. Cạn động lực → quay lại bước 2\n7. Kiên trì, linh hoạt đến khi thành công"}, {"q": "Thiếu ý tưởng, động lực hay kế hoạch thì làm gì?", "a": "Đều bắt đầu \"nạp năng lượng\": ý tưởng sẽ tụ ra, động lực sẽ hình thành, kế hoạch tự phát mà hình thành. Sự kiên trì xuất phát từ Niềm tin; Niềm tin xuất phát từ công thức \"Nạp năng lượng cho hiện hữu\"."}, {"q": "Sơ đồ sinh hoá của Năng lượng nguyên thuỷ?", "a": "SỰ TUYỆT ĐỐI → NĂNG LƯỢNG NGUYÊN THUỶ, rồi chia hai nhánh:\n• Sinh hoá lần I (Nhất Nguyên – Hợp nhất) → năng lượng tiên thiên\n• Sinh hoá lần II (Nhị Nguyên – Đối lập) → Năng lượng (−) tiêu cực và Năng lượng (+) tích cực", "d": 1}, {"q": "Sinh hoá lần I hình thành những năng lượng tiên thiên nào?", "a": "• Tình yêu\n• Biết ơn\n• Hạnh phúc\n• Tự nhiên\n• Sự thông thái\n• Vị tha\n• Chân thành\n• Tĩnh lặng, thuần khiết…", "d": 1}, {"q": "Sinh hoá lần II hình thành những năng lượng (−) và (+) nào?", "a": "• Tiêu cực (−): đau khổ, bức xúc, nặng nề, đố kỵ, ganh ghét, giận dữ, độc ác, bấn loạn/tạp niệm…\n• Tích cực (+): khát vọng, đam mê, dấn thân, cần cù chịu khó, khiêm tốn, niềm tin, ý chí vươn lên, chính trực…", "d": 1}, {"q": "Sơ đồ \"Nạp năng lượng cho hiện hữu\" mô tả gì?", "a": "TRÍ → \"Liên tục nghĩ đến\" → Hiện hữu (ý niệm, ý nghĩa, hình ảnh…). Việc liên tục nghĩ đến tạo ra một vùng \"năng lượng bao xung quanh Hiện hữu\" đó — chính là cách Tâm Trí chế biến năng lượng nguyên thuỷ.", "d": 1}]}, {"part": 1, "num": 16, "title": "Cầu nguyện & cầu xin", "summary": "Cầu nguyện là phát ra ý nguyện với Đức tin và lòng biết ơn, không trông chờ kết quả — thị hiện của Chân ngã; Cầu xin là phát ra ý nguyện kèm mong cầu — hình tướng của bản ngã. Chương trao bài kinh cầu nguyện với ba ý nguyện cốt lõi: Thân khoẻ, Tâm an, Trí sáng.", "key": "Sự linh thiêng = gột rửa năng lượng Tâm thức bằng Đức tin + sự vận hành của Luật Hấp Dẫn.", "cards": [{"q": "\"Cầu nguyện\" là gì?", "a": "CẦU NGUYỆN = PHÁT RA Ý NGUYỆN + ĐỨC TIN, nhưng không có sự trông chờ. Dù ý nguyện thành hay không, người cầu nguyện vẫn luôn biết ơn và sùng kính sự thiêng liêng của Tạo Hoá. Cầu nguyện là sự thị hiện của Chân ngã.", "d": 1}, {"q": "Công thức \"sự linh thiêng\" trong Cầu nguyện?", "a": "SỰ LINH THIÊNG = Gột rửa năng lượng Tâm thức bằng Đức tin + Sự vận hành của Luật Hấp Dẫn. Đức tin gột rửa vướng bận, rung động trở nên thanh nhẹ, Luật Hấp Dẫn mang lại thuận lợi, may mắn."}, {"q": "Vì sao nên dùng chữ \"Thượng Đế\" khi cầu nguyện?", "a": "Vì sự cầu nguyện cao cả nhất là hướng thẳng đến Tạo Hoá – Cội nguồn vạn vật; từ \"Thượng Đế\" tự thân đã chứa năng lượng Đức tin tích trữ hàng nghìn năm của nhân loại nên có sức lực rất lớn."}, {"q": "Bài kinh cầu nguyện của \"Vị Ân Sư cuối cùng\" chứa 3 yếu tố nào?", "a": "1. Đức tin\n2. Sự biết ơn\n3. Ý nguyện thiết thực, cốt yếu: Thân khoẻ, Tâm an, Trí sáng\nĐức tin + biết ơn là năng lượng tiên thiên cực sạch; ý nguyện là ĐỦ, CỐT LÕI, KHÔNG DƯ THỪA — có ba điều đó thì làm được mọi chuyện."}, {"q": "4 thói quen cầu nguyện cần hình thành?", "a": "• Mỗi sáng thức dậy (5–10 phút)\n• Mỗi khi xả thiền (5–10 phút)\n• Bất cứ khi nào nhớ đến (5–10 phút)\n• Khi gặp sự cố mà năng lực tự thân không giải quyết được (tuỳ biến ý nguyện, vd: \"cho con tai qua nạn khỏi\", \"chữa lành bệnh tật\")"}, {"q": "\"Cầu xin\" là gì?", "a": "CẦU XIN = PHÁT RA Ý NGUYỆN + SỰ MONG CẦU (ham muốn thành sự thật). Thành thì mới cảm tạ; không thành thì cau có, mất tin tưởng — biểu hiện của bản ngã không được thoả mãn. Cầu xin là một hình tướng của bản ngã.", "d": 1}, {"q": "Hậu quả của việc nhầm Cầu xin là Cầu nguyện?", "a": "Làm mất niềm tin vào bản thân, lâu ngày mất cả đức tin, làm bản ngã và khối khổ đau lớn mạnh.\n• Mất Niềm tin vào chính mình → thành mê tín dị đoan.\n• Mất Đức tin vào điều thiêng liêng → đời sống Tâm linh không tiến hoá."}, {"q": "So sánh Cầu nguyện và Cầu xin về lòng biết ơn và Đức tin?", "a": "• Cầu nguyện: biết ơn, tạ ơn vô điều kiện dù ý nguyện thành hay không; Đức tin, tín tâm vô điều kiện; thực hành mỗi ngày; hài lòng với những gì đang có.\n• Cầu xin: chỉ tạ ơn khi điều cầu thành sự thật; thấy thành mới có Đức tin; chỉ \"xin\" khi cần, khi thiếu thốn; muốn nhiều hơn nữa.", "d": 1}, {"q": "So sánh Cầu nguyện và Cầu xin về thái độ sống?", "a": "• Cầu nguyện: chủ động dấn thân, chịu trách nhiệm nhưng thấy thuận lợi là Hồng Ân của Tạo Hoá; \"Phước cho ai chưa thấy mà tin\"; thuận theo tự nhiên (\"sự sắp đặt của Chúa\", \"Tuỳ duyên\").\n• Cầu xin: \"mình là trung tâm, tự làm ra tất cả\"; thấy bằng mắt cũng chưa chắc tin; bức xúc khi không theo ý mình.", "d": 1}, {"q": "Cầu nguyện và Cầu xin tác động lên bản ngã và nội tâm thế nào?", "a": "• Cầu nguyện (Đức tin): \"năng lượng sống\" của bản ngã bị gột rửa, Tâm Trí dần thanh tịnh; là thực hành hướng đến Chân ngã (Chân – Thiện – Mỹ), phương pháp tu tập đơn giản mà hiệu quả.\n• Cầu xin (Mê tín): gia tăng sức sống, ham muốn của bản ngã, động loạn nội tâm, mất niềm tin vào bản thân và cuộc sống.", "d": 1}]}, {"part": 1, "num": 17, "title": "Khát vọng và mong cầu", "summary": "Đam mê và Khát vọng là năng lượng tích cực được nuôi dưỡng chủ động bằng công thức \"nạp năng lượng\" (liên tục nghĩ đến), chứ không sinh ra đã có. Khát vọng khác Mong cầu ở yếu tố Niềm tin — thứ tạo ra hành động và hai số phận khác nhau.", "key": "Phải TẠO RA đam mê trước, rồi mới THEO ĐUỔI đam mê.", "cards": [{"q": "Đam mê và Khát vọng được hình thành thế nào?", "a": "Là năng lượng tích cực (+) từ sự sinh hoá lần thứ 2 của năng lượng nguyên thuỷ, được nuôi dưỡng và tích tụ bằng Tâm Trí theo quy luật \"lượng đủ, chất đổi\" — tinh hoa là công thức \"nạp năng lượng cho hiện hữu\". Không phải sinh ra đã có."}, {"q": "Định nghĩa \"Đam mê đích thực\"?", "a": "Đam mê = Sự yêu thích + Lòng nhiệt huyết dấn thân (sẵn sàng chịu khó học hỏi, hành động, hoà mình vào \"cuộc chơi\"). Chỉ yêu thích mà không nhiệt huyết thì chưa phải đam mê. Niềm tin giúp kiên trì; đam mê tạo sự thôi thúc hành động."}, {"q": "Phân biệt Đam mê và Nghiện ngập?", "a": "Giống nhau về công thức hình thành (nạp năng lượng).\n• Đam mê: rất thích thú + nhiệt huyết, hướng đến Chân – Thiện – Mỹ, thiết thực.\n• Nghiện: hành động lặp lại để thoả mãn dục vọng, bản ngã dù biết có hại; sinh ra từ nuôi dưỡng năng lượng tiêu cực — \"Nghiệp dẫn dắt vận mệnh\"."}, {"q": "Đam mê tức thời khác đam mê lâu dài thế nào?", "a": "• Lâu dài: tích trữ năng lượng đủ lâu, thực dụng, giúp mình và người (kinh doanh, đầu tư, học hỏi) — nên tiếp tục nạp năng lượng.\n• Tức thời: năng lượng vừa đủ nhưng yếu; cạn thì nhàm chán và chấm dứt (thường ở trẻ em, người mới lập nghiệp)."}, {"q": "Vì sao câu \"Hãy theo đuổi đam mê\" bị cho là thiếu sót?", "a": "Vì người chưa có đam mê thì lấy gì theo đuổi. Nguyên lý thành công: TẠO RA ĐAM MÊ TRƯỚC rồi mới theo đuổi. Muốn đam mê điều gì chỉ cần \"liên tục nghĩ đến\" điều đó (vd: muốn đam mê kinh doanh → liên tục nghĩ đến kinh doanh)."}, {"q": "Điểm giống và khác cốt lõi giữa Khát vọng và Mong cầu?", "a": "Giống: đều là năng lượng \"mong muốn thành sự thật\".\nKhác: yếu tố NIỀM TIN. Người Khát vọng tin điều mong muốn sẽ thành và hành động; người Mong cầu không tin nên KHÔNG HÀNH ĐỘNG — tạo ra hai số phận khác nhau."}, {"q": "3 thành tố của \"Khát vọng\"?", "a": "1. Năng lượng mong muốn thành sự thật mạnh mẽ\n2. Năng lượng niềm tin\n3. Hành động và sự dấn thân\nKhát vọng thôi thúc lập kế hoạch, tầm nhìn, tập trung vào quá trình và kết hợp lý trí để thực thi."}, {"q": "Biểu hiện của người chỉ \"Mong cầu\"?", "a": "• Sợ \"nói trước bước không qua\", sợ bị đánh giá khi chia sẻ mục tiêu\n• Dè bỉu, bàn lùi mục tiêu của người khác\n• Không tin vào thành công, giàu có; tự ti\n• Áp giới hạn bản thân lên người khác\n• Không dám đặt mục tiêu lớn (20 triệu thay vì 200 triệu/tháng)"}, {"q": "Ví dụ hai người trồng sầu riêng minh hoạ điều gì?", "a": "Người 1 (Mong cầu) chỉ mong vườn trĩu quả mà không chăm sóc, thất bại thì oán trách. Người 2 (Khát vọng) tin sẽ thành công nên tập trung tuyệt đối vào quá trình. Tâm thức đúng → hành động đúng → thành công; Tâm thức sai → hành động sai → thất bại."}, {"q": "Có Đam mê mà thiếu Khát vọng (hoặc ngược lại) thì sao?", "a": "• Chỉ Đam mê: thiếu mục tiêu lớn và niềm tin hoàn thành → không tạo thành công lớn.\n• Chỉ Khát vọng: thiếu nhiệt huyết → đạt mục tiêu (vd: giàu) là ngừng làm.\nĐam mê + Khát vọng (như Steve Jobs) mới trọn vẹn."}, {"q": "Công thức của Khát vọng và Mong cầu?", "a": "• KHÁT VỌNG = MONG MUỐN THÀNH SỰ THẬT + NIỀM TIN LỚN\n• MONG CẦU = MONG MUỐN THÀNH SỰ THẬT + KHÔNG CÓ NIỀM TIN\nKhác biệt duy nhất là Niềm tin — thứ tạo ra hành động.", "d": 1}, {"q": "Sơ đồ 8 bước để tạo Đam mê và thành công?", "a": "1. Đưa Ý thức tách rời khỏi Tâm Trí, mọi hình tướng (Thiền định)\n2. Kiên trì thực hành (tăng sự sáng của Ý thức)\n3. Tâm Trí được làm chủ hoàn toàn\n4. Tạo bất kỳ đam mê nào theo ý muốn (\"nạp năng lượng\")\n5. Niềm tin, Đam mê, Khát vọng hình thành\n6. Thôi thúc hành động, lập kế hoạch\n7. Tuỳ biến linh hoạt\n8. \"Thành công sẽ theo đuổi bạn\"", "d": 1}]}, {"part": 1, "num": 18, "title": "Tỉnh thức", "summary": "Tỉnh thức là \"sự sáng của Ý thức\" — Ý thức tách rời khỏi Tâm Trí và các hình tướng nó sinh khởi, nhận ra \"Đó không phải là Ta\". Mức độ tỉnh thức quyết định khả năng làm chủ Tâm Trí, từ đó làm chủ Luật Hấp Dẫn và vận mệnh.", "key": "Cái gì nhận ra được thì không phải là Ta — xương sống của Pháp Thiền \"Tất Cả Chỉ Là Ý Nghĩ\".", "cards": [{"q": "Tỉnh thức là gì (qua pháp thoại về \"sự thắc mắc\")?", "a": "Khi nhận ra mình là người chứng kiến sự thắc mắc chứ không phải là sự thắc mắc — đó là Tỉnh thức. Tức là nhận diện được sự có mặt của ý nghĩ, cảm xúc… và hiểu sâu sắc \"ĐÓ KHÔNG PHẢI LÀ TA\", không bị kéo theo chúng."}, {"q": "Giải nghĩa chữ \"Tỉnh\" và \"Thức\"?", "a": "• Tỉnh: tỉnh táo, sáng suốt — \"sự sáng\".\n• Thức: đối nghịch với ngủ; ngủ là vắng mặt Ý thức, thức là Ý thức có mặt.\n→ TỈNH THỨC = \"sự sáng của Ý thức\" (Ý thức còn gọi là Mắt Trí Huệ)."}, {"q": "Bản chất của Tỉnh thức và định nghĩa Thiền?", "a": "Bản chất Tỉnh thức: sự tách rời của Ý thức ra khỏi Tâm Trí và những hình tướng Tâm Trí khởi sinh. Bất cứ sự thực hành nào làm gia tăng khả năng tỉnh thức đều gọi là THIỀN."}, {"q": "Phân biệt Vô minh và Tỉnh thức?", "a": "• Vô minh: Ý thức bị che mờ, đồng hoá với hình tướng, bị kéo theo dòng ý nghĩ, cảm xúc — khả năng làm chủ Tâm Trí thấp.\n• Tỉnh thức: Ý thức tách khỏi hình tướng, chứng kiến được dao động nội tâm; đặc trưng là khả năng đưa Tâm Trí về im lặng bất cứ khi nào muốn."}, {"q": "Lộ trình thực hành Tỉnh thức trong Pháp Thiền \"Tất Cả Chỉ Là Ý Nghĩ\"?", "a": "1. Thực hành DỌN RÁC\n2. 5 BƯỚC TỈNH THỨC\n3. QUÁN TRÍ, QUÁN TÂM\n4. Thực hành Tâm Pháp \"ĐÓ KHÔNG PHẢI LÀ TA\"\nMục đích: tách Ý thức khỏi chuyển động của Tâm Trí."}, {"q": "Biểu hiện của mức độ Tỉnh thức cao và thấp?", "a": "• Cao: an lạc, Trí thanh tịnh, tập trung cao độ, không bị ảnh hưởng bởi năng lượng bên ngoài, may mắn đến tự nhiên, thấu hiểu nhanh, dần chấm dứt định nghĩa \"Ta là\".\n• Thấp: thích nghe khen, dễ tổn thương bởi thị phi, miên man, cảm xúc dồn nén, Đức tin thấp, ngồi thiền hôn trầm."}, {"q": "Tỉnh thức liên quan đến vận mệnh thế nào?", "a": "Người không tỉnh thức thì \"Nghiệp\" dẫn dắt vận mệnh theo Luật Hấp Dẫn — gọi là \"Định nghiệp\" (dân gian gọi là vận mệnh). Người tỉnh thức cao chủ động gột rửa năng lượng ô trược, làm chủ Tâm Trí → làm chủ Luật Hấp Dẫn → làm chủ vận mệnh."}]}, {"part": 1, "num": 19, "title": "Tiến hoá và tiến bộ của Trí", "summary": "Tiến bộ của Trí đến từ việc nạp thông tin đầu vào (không biết → biết, không hiểu → hiểu, chưa trải nghiệm → trải nghiệm), còn Tiến hoá của Thể Trí là nâng rung động nhờ đưa Trí về im lặng tuyệt đối (hiểu chậm → hiểu rất nhanh). Thể Trí tiến hoá qua 5 cấp độ, từ Phàm Trí đến Sự thông thái.", "key": "Tiến bộ đến từ cung cấp thông tin; Tiến hoá đến từ điều ngự Tâm Trí về \"im lặng tuyệt đối\".", "cards": [{"q": "3 tiêu chí thể hiện sự Tiến bộ của Trí?", "a": "1. KHÔNG BIẾT → BIẾT\n2. KHÔNG HIỂU → HIỂU\n3. CHƯA TRẢI NGHIỆM → TRẢI NGHIỆM\nVd: không biết kinh doanh online, học 6 tháng rồi bắt đầu kinh doanh được."}, {"q": "Tiến bộ của Trí đến từ đâu?", "a": "Từ việc cung cấp thông tin, dữ liệu đầu vào, kiến thức chuyên môn: qua vị Thầy, tự tìm hiểu, các mối quan hệ, khoá học, sách, tìm kiếm trên mạng… (vd: marketing, quảng cáo Google/Facebook, kế toán, chứng khoán)."}, {"q": "Tiến hoá của Thể Trí là gì?", "a": "Là nâng cao rung động của Thể Trí: từ \"HIỂU CHẬM, LÂU HIỂU\" → \"HIỂU RẤT NHANH\". Trí càng im lặng, rung động càng thanh nhẹ, thấu hiểu càng nhanh nhạy. Tác nhân là năng lượng nguyên thuỷ dồi dào, chỉ sản sinh trong Thiền định sâu."}, {"q": "Phân biệt Tiến bộ và Tiến hoá của Trí?", "a": "• Tiến bộ: nhờ nạp thông tin đầu vào; không hiểu → hiểu.\n• Tiến hoá: nhờ điều ngự Tâm Trí về im lặng tuyệt đối; hiểu chậm → hiểu tức thì. Tiến hoá diễn ra tự động, là cách Bậc Giác ngộ trở nên thông thái. \"Căn cơ\" là từ chỉ sự tiến hoá của Thể Trí."}, {"q": "5 cấp độ tiến hoá của Thể Trí?", "a": "1. Phàm Trí (Hạ Trí)\n2. Trí cực sạch (Trí nguyên thuỷ)\n3. Thượng Trí\n4. Đại Trí\n5. Sự thông thái (Trí tuệ Bát nhã)"}, {"q": "Đặc điểm của \"Phàm Trí\"?", "a": "Miên man, vọng động, mất tập trung; hiểu chậm; nghĩ tiêu cực, không làm chủ Tâm Trí; bảo thủ, định kiến; luôn đi kèm bản ngã, Đức tin yếu kém, nội tâm ồn ào. Tiếp xúc Minh Triết như \"nước chảy lá môn\"."}, {"q": "\"Trí cực sạch\" là gì?", "a": "Trạng thái Trí đã im lặng, thanh tịnh, vắng bặt mọi ý nghĩ tích cực lẫn tiêu cực — thuần tuý như em bé mới sinh (THUẦN TRÍ), tương ứng \"Ưng vô sở trụ\". Là bước đệm quan trọng nhất để tiến lên Thượng Trí, Đại Trí, Sự thông thái."}, {"q": "Vì sao \"Hạnh phúc là ở đây và bây giờ\" nên hiểu là \"kết quả của Trí cực sạch\"?", "a": "Vì chỉ khi Trí cực sạch con người mới chạm được thực tại hiện tiền; \"thực tại\" là sản phẩm của Trí cực sạch. Thực hành bền vững là gột rửa ô trược tâm thức để Phút giây hiện tại tự hiển lộ, chứ không phải cố chú tâm vào hiện tại."}, {"q": "Đặc điểm của Thượng Trí/Đại Trí và Sự thông thái?", "a": "• Thượng Trí, Đại Trí: phải qua Trí cực sạch trước; có nhận thức vượt thời đại, là \"căn cơ lớn\", dễ thấu hiểu Minh Triết (nhà phát minh, hiền triết).\n• Sự thông thái: cấp độ \"không ngôn ngữ\" của Bậc Giác ngộ, hợp nhất với Tự nhiên; thấu triệt tất cả nhưng không can dự, \"thông thái nhưng không có ai thông thái\"."}, {"q": "So sánh cách thấu hiểu của Tiến bộ và Tiến hoá của Trí?", "a": "• Tiến bộ: tiếp nhận thông tin, kiến thức để phân tích, tổng hợp; thấu hiểu phải qua năm tháng rèn luyện, kinh nghiệm; Trí đôi khi miên man, tập trung không tốt.\n• Tiến hoá: thấu hiểu tức thì, đôi khi không cần xúc chạm thông tin; sinh ra trong \"im lặng tuyệt đối\"; tập trung tuyệt đối vào thực tại một cách tự nhiên.", "d": 1}, {"q": "So sánh khuynh hướng sống của người Tiến bộ và Tiến hoá về Trí?", "a": "• Tiến bộ: hướng ngoại; tập trung sinh tồn, tiền, bằng cấp; cần khoa học, bằng chứng mới tin; thích hào nhoáng; ứng xử nguyên tắc, xã giao; \"Bàn tay ta làm nên tất cả\".\n• Tiến hoá: hướng nội; nhận thức vượt trội về Vũ Trụ; thấu triệt không cần chứng minh; gần Tự nhiên, chân thành; tìm đến Tâm linh, Đức tin, cầu nguyện, biết ơn.", "d": 1}, {"q": "So sánh Tiến bộ và Tiến hoá về năng lượng và làm chủ Tâm Trí?", "a": "• Tiến bộ: học quản trị cảm xúc; sống theo quán tính, không biết gột rửa năng lượng Tâm thức; không làm chủ hoàn toàn Tâm Trí; Trí miên man, tốn nhiều năng lượng.\n• Tiến hoá: nằm ngoài Tâm và Trí, thanh tịnh thường hằng; năng lượng vi nhẹ, toả trường bình an; làm chủ Tâm Trí hoàn toàn,
