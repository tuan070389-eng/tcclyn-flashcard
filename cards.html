 an trú Thực tại, không hao tổn năng lượng.", "d": 1}]}, {"part": 1, "num": 20, "title": "Đạo đức", "summary": "\"Đạo Đức\" là sự hợp thành của Đạo và Đức: thấu hiểu Đạo càng sâu thì cái Đức (Chân ngã, Phật tính) hiển lộ càng lớn. Đạo Đức là hành trình nội tâm, biểu hiện ở sự thanh tịnh bình an bên trong, chứ không chỉ là việc làm tốt bên ngoài.", "key": "\"Đạo\" luôn đứng trước \"Đức\" — thấu hiểu Đạo càng uyên thâm, tự nhiên cái Đức càng lớn.", "cards": [{"q": "Câu \"Đạo sinh chi, Đức súc chi\" được giải thích thế nào?", "a": "Từ \"Đạo\" mà \"Đức\" được sinh ra. \"Cái hình dung của Đức lớn chỉ tuỳ theo Cái Đạo tối cao\": sự bình an, chân thành, vị tha, yêu thương… hiện hữu nhiều bao nhiêu tuỳ thuộc người đó hiểu sâu sắc về Tâm linh, Thiền định, Đạo bấy nhiêu."}, {"q": "\"Đức\" là gì và làm sao có được?", "a": "Đức là Chân ngã — các thuộc tính Chân – Thiện – Mỹ: tự tại, điềm tĩnh, bao dung, vị tha, trắc ẩn, chân thành, vô ngã… Đức không đến từ bắt chước, mà hiển lộ tự nhiên khi NGHIỆP LỰC ĐƯỢC GỘT RỬA — như lau bụi đến đâu gương sáng đến đó."}, {"q": "\"Đạo\" là gì? Các tên gọi khác?", "a": "Là những nguyên lý bất biến hình thành và sinh hoá Vũ Trụ, tạo tác mà không có chủ nhân. Tên gọi: Tạo Hoá, Cội nguồn, Thượng Đế, Sự Tuyệt đối, \"Trước khi Vũ Trụ hình thành\", Brahman (Upanishad), Tánh Không (Phật giáo). Người ngộ được \"cái không thể diễn tả\" này là Người Ngộ Đạo."}, {"q": "Định nghĩa \"Đạo Đức\" theo sách?", "a": "Là tổ hợp tất cả năng lượng không phân cực từ sự sinh hoá lần thứ nhất (Nhất Nguyên) của năng lượng nguyên thuỷ: tình yêu, biết ơn, hạnh phúc, tự nhiên, sự thông thái, vị tha, chân thành, tĩnh lặng thuần khiết… — \"Tính cách Vũ Trụ\". Từ đồng nghĩa: Chân ngã, Phật tính.", "d": 1}, {"q": "Ngộ nhận phổ biến về Đạo Đức là gì?", "a": "Cho rằng Đạo Đức chỉ là không hại ai, làm việc tốt, từ thiện, cúng dường lấy phước. Thực tế bản chất Đạo Đức nằm ở HÌNH THÁI NỘI TÂM. Làm việc tốt nhưng Tâm Trí động loạn, khổ đau thì vẫn là \"Vô Đạo, Vô Đức\" — \"hướng ra ngoài mà muốn đạt thành tựu bên trong\"."}, {"q": "Người có và không có Đạo Đức biểu hiện thế nào?", "a": "• Có Đạo Đức: thanh tịnh, bình thản nội tâm, nét mặt ung dung hạnh phúc; càng TỰ NHIÊN và CHÂN THÀNH.\n• Thiếu Đạo Đức: Tâm Trí động loạn, nét mặt khổ đau; càng xã giao, mánh khoé, vụ lợi."}, {"q": "Giải thích câu \"Có Đức thì mặc sức mà ăn\"?", "a": "Người có Đạo Đức có năng lượng Tâm thức thanh nhẹ; năng lượng Tâm thức chuyển động theo Luật Hấp Dẫn nên sự thanh nhẹ ấy luôn mang lại thuận lợi, may mắn. Tương tự, \"Đắc Nhân Tâm\" đích thực chính là Đạo Đức: chân thành, tự nhiên, tôn trọng."}, {"q": "5 câu vắn tắt về Đạo Đức cuối chương?", "a": "1. \"Đạo\" luôn đứng trước \"Đức\"\n2. Hiểu Đạo càng uyên thâm, Đức càng lớn\n3. Đạo Đức là hành trình hướng nội, chú trọng NỘI TÂM\n4. Quan sát nội tâm là quan sát Đạo Đức hiện hữu\n5. Thiền định, Cầu nguyện, trầm mặc về \"cái gọi là Ta\" là con đường Ngộ Đạo nhanh nhất"}]}, {"part": 1, "num": 21, "title": "Quy luật của “Hiện hữu”", "summary": "Có hiện hữu thì có quy luật; vô hiện hữu thì vô quy luật. Tâm thức chịu chi phối bởi 3 quy luật chủ đạo (Nhân Quả, Hấp Dẫn, Lượng Đủ – Chất Đổi), và sự sáng tạo đi theo trình tự Cội nguồn → Nguyên năng → Quy luật Vũ Trụ → Nguyên lý → Quy trình; phải hiểu đúng Nguyên lý trước khi hành động.", "key": "Phải LÀM ĐÚNG chứ không phải LÀM NHIỀU — làm đúng thì phải hiểu đúng Nguyên lý.", "cards": [{"q": "Tâm Pháp nền tảng về \"Quy luật của hiện hữu\"?", "a": "Có \"hiện hữu\" thì có quy luật; \"vô hiện hữu\" thì vô quy luật. Bất cứ sự tồn tại nào đều có quy luật chi phối để mọi vận động diễn ra trật tự; chỉ \"không tồn tại\" mới không chịu quy luật nào."}, {"q": "3 vòng tròn và quy luật chi phối từng vòng?", "a": "• Vòng 01 – \"Sự Tuyệt đối\": vô hiện hữu, không quy luật; tự do, giải thoát tuyệt đối (Tánh không, Đạo, Brahman).\n• Vòng 02 – \"Tâm thức Vũ Trụ\" (Thế giới Tâm thức): chịu 3 quy luật Tâm thức.\n• Vòng 03 – \"Hữu hình Thế giới\" (thế giới các hạt vật chất): tuân theo các định luật vật lý.", "d": 1}, {"q": "Người Giác ngộ đứng ở đâu so với các quy luật?", "a": "Giác ngộ là hợp nhất với \"cái không tồn tại\", nên Tâm thức vượt ra ngoài Nhân Quả, Hấp Dẫn, Lượng Đủ – Chất Đổi, nhưng có thể vận dụng triệt để chúng. Thân xác Người Giác ngộ vẫn chịu định luật vật lý."}, {"q": "Khi nào Tâm thức bị chi phối bởi Quy luật Hiện hữu?", "a": "Ngay khi Tâm Trí sinh khởi bất kỳ hình tướng nào (ý nghĩ, cảm xúc, hình ảnh, tạp niệm…), dù nhỏ nhất. Khi Trí thanh tịnh hoàn toàn (cực sạch mọi sinh khởi) thì quy luật không vận hành được — siêu vượt mọi quy luật."}, {"q": "3 quy luật Tâm thức chủ đạo?", "a": "1. Nhân Quả: [Nếu A → thì B]\n2. Hấp Dẫn: \"Đồng thanh tương ứng, đồng khí tương cầu\" — năng lượng giống nhau hút nhau\n3. Lượng Đủ – Chất Đổi: kết hợp Nhân Quả, Hấp Dẫn và tích luỹ năng lượng qua \"liên tục nghĩ đến\""}, {"q": "Vì sao \"Lưới trời lồng lộng\" không phải \"khó thoát\" mà là \"không thể thoát\"?", "a": "Vì 3 quy luật hoạt động bên trong Tâm thức, thế giới nội tâm, không phải ngoài Vũ Trụ. Còn dùng Tâm Trí, còn nghĩ ngợi thì quy luật luôn đi kèm mọi ý nghĩ nhỏ nhất. Chúng là kim chỉ nam cho Tâm Pháp \"ĐẠO TẠO RA ĐỜI\" và giải thích mọi nguyên lý thành công."}, {"q": "Trình tự sáng tạo của Vũ Trụ?", "a": "(1) Cội nguồn → (2) Nguyên năng → (3) Quy luật Vũ Trụ (Quy luật của \"Hiện hữu\") → (4) Nguyên lý → (5) Quy trình.\nThấu hiểu (1)–(3) là Ngộ Đạo; đây là trình tự \"bất di, bất dịch\". Sự tuỳ biến chỉ bắt đầu từ bước (4) và (5).", "d": 1}, {"q": "3 nguyên lý căn bản của \"Sự Giàu Có\" bền vững?", "a": "1. Sự giàu có bên trong tạo ra sự giàu có bên ngoài\n2. Sự giàu có = Giá trị\n3. Sự giàu có = Đầu tư\nNguyên lý phải tuân theo Quy luật Vũ Trụ (hướng Chân – Thiện – Mỹ), làm ngược thì nguyên lý sụp đổ."}, {"q": "Vì sao phải hiểu Nguyên lý trước khi hành động?", "a": "Vì chăm chỉ mà sai nguyên lý thì vẫn không thành công — cần LÀM ĐÚNG chứ không phải LÀM NHIỀU. Nguyên lý được phát hiện qua: Minh Sư/Thầy chỉ dạy; đọc sách, nghiên cứu; tự dấn thân trải nghiệm. Ứng dụng: Nguyên lý → Quy trình → Checklist."}, {"q": "Quy trình đi từ Nguyên lý 01 \"Sự giàu có bên trong tạo ra sự giàu có bên ngoài\"?", "a": "1. Thiền định mỗi ngày: tăng \"năng lực nội tại\", làm sạch nghiệp thức, làm chủ Tâm Trí\n2. Cầu nguyện – cảm ơn, biết ơn để tăng năng lượng hài lòng, đầy đủ; kiên trì, liên tục\n3. Trau dồi kiến thức chuyên ngành, kỹ năng chuyên môn", "d": 1}, {"q": "Checklist mẫu cho Nguyên lý 01 của Sự giàu có?", "a": "1. Thiền, ngồi im lặng 30 phút – 2 giờ/ngày\n2. Thực hành 5 BƯỚC TỈNH THỨC\n3. Cầu nguyện khi xả thiền; nói \"cảm ơn và biết ơn\" mọi trải nghiệm\n4. Vẽ sơ đồ, dán lên bàn làm việc\n5. Đọc lại Minh Triết đến khi thấu hiểu\n6. Học khoá đầu tư chứng khoán, đọc sách đầu tư\n7. Nhờ người kèm về bán hàng\n(tuỳ biến theo hoàn cảnh)", "d": 1}]}, {"part": 1, "num": 22, "title": "Quy luật Nhân Quả", "summary": "Quy luật Nhân Quả vận hành theo \"Nếu A → thì B\" ngay trong thế giới nội tâm; Nhân vô hình (tư tưởng) đi trước và quyết định Nhân hữu hình (hành động), kéo theo Luật Hấp Dẫn. Muốn thay đổi Quả phải thay đổi tư tưởng — qua 8 Nhân vô hình của Sự Giàu Có, 5 bước thay đổi Nhân Quả, và chọn môi trường, mối quan hệ đúng.", "key": "Để thay đổi Nhân Quả, phải thay đổi được Tư Tưởng.", "cards": [{"q": "Cấu trúc Quy luật Nhân Quả?", "a": "Công thức \"Nếu A → Thì B\". A là nhân, duyên khởi, nguyên nhân; B là kết quả, tuỳ biến theo đặc tính của A.\n• Có A ắt có B: hiện tại là duyên khởi cho tương lai (→ công thức gieo hạt).\n• Có B ắt đã có A: hiện tại do quá khứ (→ chấp nhận, Tâm thức sám hối)."}, {"q": "Phân biệt Nhân vô hình và Nhân hữu hình?", "a": "• Nhân vô hình: mọi hình tướng chuyển động trong Vòng 02 – Tâm thức (ý nghĩ, cảm xúc, trạng thái, thái độ, rung động…) — cái cốt lõi, quyết định nhất.\n• Nhân hữu hình: hành vi, lời nói, hành động, môi trường sống, bạn bè, nghề nghiệp…\nNhân vô hình xuất hiện trước, Nhân hữu hình theo sau."}, {"q": "Quan hệ giữa Nhân Quả và Luật Hấp Dẫn?", "a": "Nhân Quả xuất hiện trước, Luật Hấp Dẫn theo ngay sau, hoạt động đồng thời. Nhân Quả dựa trên hình tướng trong tư tưởng; Luật Hấp Dẫn vận hành dựa trên \"năng lượng sống\" của các hình tướng đó — không có Nhân thì Luật Hấp Dẫn không vận hành."}, {"q": "Chu trình 4 giai đoạn của Nhân vô hình?", "a": "1. Hình tướng bất kỳ xuất hiện trong Tâm Trí (TẠO NHÂN)\n2. \"Năng lượng sống\" của hình tướng tạo rung động Tâm thức tương ứng\n3. Luật Hấp Dẫn mang đến sự vật, hiện tượng có rung động tương ứng\n4. KẾT QUẢ: mọi điều xảy đến tương ứng \"Năng lượng Tâm thức\" của người đó\nChỉ khi \"vô ý nghĩ\" (Trí cực sạch) mới không tạo Nhân.", "d": 1}, {"q": "Vì sao phải học làm chủ Tâm Trí chứ không phải làm chủ hành vi?", "a": "Vì Nhân vô hình (vd: tức giận) xuất hiện trước, Nhân hữu hình (lời nói giận dữ) mới theo sau. Kiểm soát được Nhân vô hình tự nhiên kiểm soát được Nhân hữu hình. \"Quán Tâm, Quán Trí\" là tinh hoa, chứ không phải \"quán cảm thọ trên thân\"."}, {"q": "8 \"Nhân vô hình\" cần gieo để có Sự Giàu Có?", "a": "1. Trân quý, biết ơn cuộc sống\n2. Tạ ơn những gì đang có và đã có\n3. Tạo giá trị thật, giúp nhiều người\n4. Yêu thích kinh doanh, đầu tư, kiếm tiền\n5. Tư duy kiếm tiền và tạo giá trị cho người khác\n6. Yêu quý sự giàu có\n7. Nuôi dưỡng niềm tin về giàu có\n8. Ngưỡng mộ người thành công"}, {"q": "Cách nuôi dưỡng Nhân vô hình số 1 và 2?", "a": "• Việc 01: Cầu nguyện và Tạ ơn Tạo Hoá mỗi ngày (sau xả thiền, trước ngủ, khi thức dậy, khi nhớ đến).\n• Việc 02: Nói lời cảm ơn mọi trải nghiệm.\nGIÀU CÓ = SỰ ĐẦY ĐỦ VIÊN MÃN = SỰ HÀI LÒNG = NĂNG LƯỢNG CẢM ƠN. \"Cảm ơn\" nghĩa là \"có rồi\"; tạ ơn vô điều kiện, không mục đích."}, {"q": "Cách nuôi dưỡng Nhân vô hình số 3, 4, 5?", "a": "• Việc 01: Đóng gói/tạo sản phẩm chất lượng, giá trị đích thực; lan truyền bằng MARKETING và BÁN HÀNG.\n• Việc 02: Trau dồi kỹ năng kinh doanh, bán hàng, marketing.\n• Việc 03: Trau dồi trí tuệ đầu tư tài chính.\nTâm thức đúng: TÂM THỨC GIÚP ĐỠ, không phải \"bán hàng kiếm tiền\" (\"Phi thương bất phú\")."}, {"q": "Nguyên lý \"Nghĩ đến là năng lượng dịch chuyển đến\" nghĩa là gì?", "a": "Khi nhiều người nghĩ đến mình/sản phẩm với lòng biết ơn, năng lượng tốt dịch chuyển về làm \"Tâm thức vật chủ\" viên mãn liên tục. Ngược lại, sản phẩm xấu bị oán trách thì hứng năng lượng tiêu cực — gọi là TỔN PHƯỚC. Đó là ý nghĩa \"Cho đi là nhận lại\"."}, {"q": "Nguyên lý \"Ngưỡng mộ là năng lượng dịch chuyển về\" nghĩa là gì?", "a": "Ngưỡng mộ làm Tâm thức rộng mở, tạo giao thoa năng lượng với người được ngưỡng mộ → tư duy đồng điệu (ngưỡng mộ người giàu → tư duy như người giàu). Thực hành: nói thành lời \"Tôi thật cảm ơn và ngưỡng mộ…\". Đố kỵ thì ngắt kết nối; ngưỡng mộ điều tiêu cực thì nguy hại."}, {"q": "Vì sao người nghèo cố làm nhiều hơn mà vẫn nghèo?", "a": "Vì họ thay đổi ngược chiều: cố đổi KẾT QUẢ bằng đổi HÀNH ĐỘNG. Trình tự đúng: (1) biến đổi năng lượng trong TƯ TƯỞNG → (2) biến đổi HÀNH ĐỘNG → (3) kiên trì tạo kết quả. Tư tưởng nghèo thì dù trúng số cũng nhanh chóng quay về túng quẫn."}, {"q": "5 bước thay đổi Nhân Quả của một con người?", "a": "1. Chuyển đổi năng lượng (dọn rác Tâm thức, chuyển nghiệp) — quan trọng nhất\n2. Thấu hiểu và nuôi dưỡng Nhân vô hình\n3. Liên tục học hỏi kiến thức chuyên ngành (\"Thông Đạo, Thạo Đời\")\n4. Hành động kiên trì (Lượng đủ, chất đổi)\n5. Thích nghi liên tục"}, {"q": "\"Gánh Nhân Quả từ người khác\" là gì và lời khuyên?", "a": "Tiếp xúc với năng lượng động loạn của người khác khiến Tâm thức nhiễm bẩn — gánh \"Nhân vô hình\" thô trược, lâu ngày làm \"Tổn Phước\". Lời khuyên: tránh xa người và môi trường tiêu cực; gần người Trí huệ, Đạo đức, thành công; thiền và cầu nguyện, biết ơn mỗi ngày."}, {"q": "Chu trình 5 giai đoạn của Nhân hữu hình?", "a": "1. Hành động, lời nói, thái độ, nét mặt, môi trường tiếp xúc… (TẠO NHÂN hữu hình)\n2. Thế giới bên ngoài tốt ảnh hưởng tốt lại \"thế giới nội tâm\" và ngược lại\n3. \"Năng lượng Tâm thức\" thay đổi tương ứng\n4. Luật Hấp Dẫn mang đến sự vật có rung động tương ứng\n5. KẾT QUẢ tương ứng Năng lượng Tâm thức", "d": 1}, {"q": "Chuỗi \"đúng\" để thay đổi Nhân Quả bắt đầu từ đâu?", "a": "TƯ TƯỞNG ĐÚNG → TƯ DUY ĐÚNG → KỸ NĂNG ĐÚNG → CÁCH LÀM ĐÚNG → KẾT QUẢ ĐÚNG.\nMuốn thay đổi Nhân Quả phải thay đổi được Tư tưởng trước.", "d": 1}]}, {"part": 1, "num": 23, "title": "Quy luật Hấp Dẫn", "summary": "Luật Hấp Dẫn vận hành theo nguyên lý \"đồng thanh tương ứng, đồng khí tương cầu\": năng lượng Tâm thức giống nhau thì hút nhau. Mọi việc đến với đời ta (Phước hay Họa, nhân duyên, sự giàu có) đều do chính Tâm thức của mình hấp dẫn đến, nên muốn làm chủ vận mệnh phải chủ động thay đổi môi trường và luyện Thiền.", "key": "Mọi việc không phải \"tự nhiên đến\" – tất cả đều do chính Tâm thức của bản thân hấp dẫn đến.", "cards": [{"q": "Nguyên lý vận hành của Luật Hấp Dẫn là gì?", "a": "\"Đồng thanh tương ứng, đồng khí tương cầu\": năng lượng Tâm thức giống nhau sẽ hút lẫn nhau. Luật vận hành trên sự tương quan giữa Tâm thức với Tâm thức, không dựa trên năng lượng vật lý hay sinh học, và không liên quan đến thân xác."}, {"q": "Sơ đồ \"Nhân duyên gặp gỡ\" giữa người A (tần số β01) và người B (tần số β02)?", "a": "• Nếu β01 = β02: khả năng gặp nhau rất cao, hợp nhau về tư tưởng, cách sống, dễ tiến tới quan hệ lâu dài.\n• Nếu β01 ≠ β02: rất khó gặp nhau; có gặp cũng không hợp và khó tạo dựng quan hệ lâu dài.\n• Tương tự với \"sự vật hiện tượng B\": β01 = β02 thì người A dễ hút nó đến.", "d": 1}, {"q": "Vì sao làm từ thiện, phóng sanh chưa đủ để có Phước?", "a": "Vì Luật Hấp Dẫn dựa trên rung động Tâm thức chứ không phải hành động thân xác. Nếu Tâm Trí vẫn động loạn, nặng nề, thô trược thì bất lợi, xui xẻo vẫn đến. Cốt tủy phải có một Tâm thức thanh nhẹ, tốt đẹp."}, {"q": "Quan hệ giữa Luật Hấp Dẫn với Nhân Quả và Nghiệp?", "a": "• Khi Nhân Quả hình thành, Luật Hấp Dẫn vận hành theo; Nhân Quả chấm dứt thì Luật Hấp Dẫn cũng chấm dứt.\n• \"Nghiệp\" là năng lượng Tâm thức, nên Luật Hấp Dẫn chi phối Nghiệp."}, {"q": "Luật Hấp Dẫn hoạt động mạnh nhất ở những nguồn năng lượng nào?", "a": "Năng lượng \"không phân cực\", sinh hóa đầu tiên từ Năng lượng Nguyên thủy:\n1. Đức tin\n2. Tình yêu thương\n3. Sự biết ơn\n4. Lòng ngưỡng mộ\n5. An lạc, hạnh phúc\n6. Sự chân thành, tự nhiên"}, {"q": "Ấn chứng dễ thấy nhất của người tu tập Tâm linh đúng đường?", "a": "Cuộc sống ngoài Đời ngày càng thuận lợi, may mắn ở mọi mặt: gia đình, tiền bạc, sự nghiệp, mối quan hệ, gặp quý nhân. Ngược lại, tu mà đời khó khăn, mất tiền, mất quan hệ… nghĩa là đã đi sai đường, Nghiệp không được gột rửa."}, {"q": "Cách \"quan sát nội tâm\" để quyết định tiếp tục hay dừng một mối quan hệ/môi trường?", "a": "Bỏ qua mác bên ngoài (bằng cấp, địa vị, PR). Chỉ quan sát trạng thái nội tâm khi tiếp xúc:\n• TIẾN BỘ, BÌNH AN, HẠNH PHÚC = Ở GẦN NHIỀU HƠN NỮA.\n• THOÁI BỘ, NẶNG NỀ, TẠP NIỆM = TRÁNH XA HOẶC CHẤM DỨT.\nCảm nhận nội tâm chính là Trực giác.", "d": 1}, {"q": "Vì sao \"muốn giàu có\" không hút được sự giàu có?", "a": "\"Muốn giàu\" và \"Đã giàu\" là hai năng lượng Tâm thức khác nhau. Mong muốn nghĩa là \"chưa có\"; Tâm thức \"đã có\" là trạng thái Mãn nguyện, Hài lòng và Biết ơn. Càng mưu cầu giàu có càng chật vật."}, {"q": "Cách gia tăng năng lượng giàu có theo Luật Hấp Dẫn?", "a": "1. Hiểu năng lượng giàu có là trạng thái MÃN NGUYỆN, HÀI LÒNG, BIẾT ƠN, không phải \"mong muốn giàu có\".\n2. Thực hành: cầu nguyện mỗi ngày, nói tạ ơn, cảm ơn, hài lòng và trân quý mọi thứ đang diễn ra ở hiện tại."}, {"q": "Hai điều cần thành thạo để làm chủ Luật Hấp Dẫn?", "a": "1. Chủ động thay đổi môi trường (thay đổi tha lực) – \"Đất lành chim đậu\".\n2. Luyện Thiền và uyên thâm về Thiền định (thay đổi nội lực) – quan trọng nhất của quan trọng, giúp đánh tan khối nghiệp."}, {"q": "Sơ đồ các dạng năng lượng Tâm thức sinh ra từ Năng lượng Nguyên thủy?", "a": "Sự Tuyệt đối → Năng lượng Nguyên thủy, rồi:\n• Sinh hóa lần I (Nhất Nguyên – Hợp nhất): năng lượng tiên thiên – tình yêu, biết ơn, hạnh phúc, tự nhiên, thông thái, vị tha, chân thành, tĩnh lặng.\n• Sinh hóa lần II (Nhị Nguyên – Đối lập): (+) khát vọng, đam mê, dấn thân, khiêm tốn, niềm tin…; (−) đau khổ, bức xúc, đố kỵ, giận dữ, tạp niệm…", "d": 1}, {"q": "Ba tầng thế giới trong sơ đồ vòng tròn đồng tâm?", "a": "1. \"Sự Tuyệt đối\" (tâm điểm)\n2. \"Tâm thức\" – Thế giới Tâm thức\n3. \"Hữu hình Thế giới\" – Thế giới các hạt vật chất (vòng ngoài cùng)", "d": 1}, {"q": "\"Tâm thức chủ đạo\" là gì theo sơ đồ?", "a": "Tâm Trí của mỗi người là \"Tâm thức chủ đạo\", ở trung tâm hút về mọi thứ đồng thuận năng lượng với nó: mối quan hệ, sự nghiệp – tài chính, sự vật hiện tượng, gia đình… Vì vậy Phước hay Họa đều do chính mình quyết định.", "d": 1}]}, {"part": 1, "num": 24, "title": "Quy luật Lượng đủ – Chất đổi", "summary": "Quy luật Lượng Đủ – Chất Đổi: năng lượng Tâm thức được nuôi dưỡng đủ lâu sẽ biến đổi về \"chất\", biến ý nghĩ thành hành động rồi thành hiện thực. Hiểu quy luật này giúp chủ động \"nạp năng lượng cho Hiện hữu\" để sáng tạo cuộc sống, đồng thời biết bảo tồn và phục hồi \"nguyên năng\".", "key": "Muốn có điều gì, hãy LIÊN TỤC NGHĨ ĐẾN điều đó – khi \"lượng đủ\", \"chất\" sẽ đổi.", "cards": [{"q": "Quy luật Lượng Đủ – Chất Đổi là gì và dựa trên nền tảng nào?", "a": "Là chân lý: tích tụ \"năng lượng\" trong thời gian đủ lâu sẽ tạo ra biến đổi về \"Chất\" (như nước đông đá ở 0°C, bốc hơi ở 100°C). Dựa trên 3 nền tảng: Quy luật Nhân Quả + Quy luật Hấp Dẫn + Sự tích trữ năng lượng."}, {"q": "\"Năng lượng nguyên thủy\" (nguyên năng) là gì?", "a": "Là NĂNG LƯỢNG GỐC của mọi năng lượng trong Tâm thức, sinh ra trong trạng thái phủ định mọi hiện hữu hoặc khi ngủ sâu. Từ đó chế biến ra mọi dạng năng lượng tích cực đến tiêu cực. Tâm Trí là cỗ máy chế biến, Ý thức là công cụ kiểm soát Tâm Trí."}, {"q": "5 giai đoạn biến đổi từ Tâm Trí đến vận mệnh (Sơ đồ II)?", "a": "1. Năng lượng tác động vào Tâm Trí.\n2. Tâm Trí sinh ý niệm, ý nghĩ, định hình lối tư duy.\n3. Ý nghĩ được nuôi dưỡng, tích trữ năng lượng.\n4. Năng lượng đủ mạnh → thành hành vi, lời nói, thái độ.\n5. Vận mệnh, thành quả hữu hình hình thành.\n(GĐ 1–3: biến đổi năng lượng; GĐ 4–5: biến đổi về chất.)"}, {"q": "Người thấu hiểu và không thấu hiểu quy luật Lượng Đủ – Chất Đổi khác nhau thế nào?", "a": "• Thấu hiểu: sáng tạo bắt đầu bên trong (đổi năng lượng Tâm thức, nâng rung động); lấy thay đổi Tâm Trí làm nền tảng; hướng nội; thích Thiền, yên tĩnh; nội lực vững, Tâm Trí thanh tịnh; không bản ngã.\n• Không thấu hiểu: bắt đầu từ bên ngoài (tài chính, quan hệ, hành vi); hướng ngoại; thích ồn ào; nhiều tạp niệm; cái tôi lớn.", "d": 1}, {"q": "Vì sao Tâm Trí được gọi là \"cỗ máy chế biến năng lượng\"?", "a": "Vì qua tư duy, phân tích, đánh giá, sáng tạo, nó chế biến nguyên năng – đồng thời làm hao tổn nguyên năng. Nguyên năng dồi dào thì Tâm Trí sáng tạo, hiệu quả; cạn kiệt thì căng thẳng, mệt mỏi. Sau giấc ngủ sâu nguyên năng phục hồi nên buổi sáng làm việc hiệu quả nhất."}, {"q": "Hai nguyên lý vận chuyển năng lượng và công thức \"Nạp năng lượng cho Hiện hữu\"?", "a": "• Nguyên lý 01: Nghĩ đến là năng lượng dịch chuyển đến.\n• Nguyên lý 02: Ngưỡng mộ là năng lượng dịch chuyển về.\nSơ đồ: TRÍ –\"liên tục nghĩ đến\"→ Hiện hữu (ý niệm, hình ảnh…) được bao bọc bởi năng lượng. Khi đủ, nó sinh hóa thành ý tưởng, động lực, đam mê, khát vọng.", "d": 1}, {"q": "Làm sao biết khi nào \"lượng đủ\"?", "a": "Nhờ quan sát nội tâm:\n• Năng lượng tích cực đủ → niềm tin, đam mê, yêu thích, khát vọng.\n• Năng lượng tiêu cực đủ → thù ghét, bức xúc, tức giận, ganh ghét, dục vọng.\n• Khi đủ, con người biểu hiện ra thành hành vi, thái độ, tính cách đặc thù."}, {"q": "Ví dụ \"tích lũy nghiệp quả\" theo quy luật Lượng Đủ – Chất Đổi?", "a": "Hai vợ chồng cãi nhau nghĩa là đã tích trữ \"năng lượng không hài lòng về nhau\" đủ lâu; cuộc cãi vã chỉ là \"quả\" của nhân vô hình trong quá khứ. Chiến tranh giữa hai quốc gia cũng vậy. Hiểu điều này dẫn đến thái độ CHỊU TRÁCH NHIỆM và CHẤP NHẬN."}, {"q": "Sơ đồ 7 bước ứng dụng công thức \"nạp năng lượng\"?", "a": "1. Chọn 1–2 việc quan trọng hiện tại.\n2. Nạp năng lượng bằng cách \"liên tục nghĩ đến\".\n3. Cho đến khi \"niềm tin\" hình thành mạnh mẽ.\n4. Ý tưởng, kế hoạch bắt đầu nảy sinh.\n5. Kiên trì hành động, tùy biến linh hoạt.\n6. Cho đến khi ý muốn thành hiện thực.\n7. Quay lại Bước 01 cho điều mới.\n(Ví dụ: lặp ý niệm \"kiếm 200 triệu/tháng\" 365–1.000 lần/ngày, 10 ngày.)", "d": 1}, {"q": "Một số trường hợp phổ biến làm hao tổn nguyên năng?", "a": "• Tư duy quá nhiều; lạm dụng công thức nạp năng lượng\n• Tạp niệm, bản ngã, mong cầu, khát vọng\n• Ý niệm tiêu cực, sân si (hao nhiều nhất); stress, cãi vã\n• Người tiêu cực, nơi ồn ào, phim kinh dị\n• Lướt điện thoại, mạng xã hội, game\n• Nghiện ngập; nói quá nhiều"}, {"q": "Biểu hiện khi nguyên năng hao tổn, cạn kiệt?", "a": "Trí mê mờ, mệt mỏi; Tâm bất an; thân thiếu sức sống; lời nói yếu ớt; thiếu ý tưởng; chỉ muốn ngủ hoặc trốn đi; dễ nổi nóng; thích tin tiêu cực, drama; Thiền hôn trầm; thiếu tập trung, mất sáng tạo; có khuynh hướng \"bàn lùi\"; nặng có thể dẫn đến ý định tự sát."}, {"q": "Những cách chính để phục hồi hoặc gia tăng nguyên năng?", "a": "• Thiền định; tín tâm vào Tâm Pháp \"Cái gì nhận ra được thì không phải là Ta\"\n• Ngủ sâu; phủ định mọi hình tướng; chấm dứt định nghĩa \"Ta là\"\n• Gần Minh Sư, thiên nhiên\n• Cầu nguyện, tạ ơn, đọc kinh sách\n• Trầm mặc về \"Cái gọi là Ta\"; chú tâm hơi thở\n• Thực phẩm sạch, rung động cao"}, {"q": "Sơ đồ từ Vô cực đến Vật chất khởi sinh?", "a": "Vô cực (cuội nguồn) → Nguyên năng (cực tĩnh) → Năng lượng \"động\" → Vật chất khởi sinh.\nTâm Trí là \"cỗ máy\" chế biến nguyên năng sang năng lượng động; nhờ đó con người tự do sáng tạo, trở thành \"Đấng sáng tạo\" cho cuộc đời mình.", "d": 1}]}, {"part": 1, "num": 25, "title": "Tập trung và bí mật của sự tập trung", "summary": "Vạn vật được tạo ra từ \"nguyên năng\", và Sự tập trung là dồn năng lượng vào một điểm duy nhất bằng cách liên tục nghĩ đến nó. Tập trung là ứng dụng quy luật Lượng Đủ – Chất Đổi, cần đi kèm tầm nhìn đúng đắn và khả năng nói \"không\" với mọi thứ khác.", "key": "Mọi nỗ lực không bằng một lựa chọn đúng; làm đúng chứ không phải làm nhiều.", "cards": [{"q": "Bí mật lớn nhất của \"Sự tập trung\" là gì?", "a": "Vạn vật được tạo ra từ NGUYÊN NĂNG. Không tập trung vào việc nào thì nguyên năng không được chuyển tới việc đó → việc không thể thành."}, {"q": "Định nghĩa \"Tập trung\" theo sách?", "a": "Là dồn năng lượng vào một điểm duy nhất bằng cách \"LIÊN TỤC NGHĨ ĐẾN\" điểm đó; cụ thể là dồn Trí lực, Tâm lực, Sức lực, Thời gian vào một lĩnh vực cho đến khi thành công. Tập trung là vận dụng nguyên lý dịch chuyển năng lượng và quy luật Lượng Đủ – Chất Đổi."}, {"q": "Điều quan trọng nhất và khó khăn nhất của Sự tập trung?", "a": "• Quan trọng nhất: NÓI KHÔNG với những thứ khác.\n• Khó nhất: con người muốn quá nhiều thứ, NÓI CÓ với quá nhiều hạng mục cùng lúc → quá tải, hao tổn năng lượng, không lĩnh vực nào thành công rực rỡ."}, {"q": "Điều kiện cần có trước khi tập trung?", "a": "Phải có TẦM NHÌN CHIẾN LƯỢC, tầm nhìn đúng đắn, nhìn thấy trước viễn cảnh. Tập trung mà định hướng sai thì tốn thời gian, công sức – ý nghĩa của câu \"Mọi nỗ lực không bằng một lựa chọn đúng\"."}, {"q": "Vì sao nghĩ đến quá nhiều thứ cùng lúc dẫn đến thất bại?", "a": "Nguyên năng bị phân tán, không đủ \"Lượng\" để thay đổi về \"Chất\"; niềm tin cho từng ý muốn yếu ớt nên hành động không quyết liệt. Kết quả: mọi việc đều nửa vời, không đến nơi đến chốn."}, {"q": "Khoảng thời gian tập trung thường thấy để thành chuyên gia?", "a": "Ít nhất 3 năm tập trung liên tục. Ai không tập trung là đang phá vỡ quy luật và nguyên lý, tức là làm trái với tự nhiên, nên không thành công bền vững."}, {"q": "Các ứng dụng cụ thể của Sự tập trung?", "a": "• Chọn 1–2 việc, tập trung tuyệt đối đến khi thành.\n• Nghề hiện tại đạt ngưỡng \"chuyên gia\" trước khi chuyển.\n• Không cố chấp, tùy biến linh hoạt theo hoàn cảnh.\n• Học cách \"SAY NO\" – kỹ năng quan trọng nhất.\n• Luyện 5 Bước Tỉnh Thức, Thiền định mỗi ngày.\n• Làm đúng chứ không phải làm nhiều."}, {"q": "Sơ đồ \"Đạo tạo ra Đời\" (từ Tạo Hóa đến hành động)?", "a": "Tạo Hóa (Thượng Đế) → Quy luật Vũ Trụ → Nguyên lý → Quy trình → Hành động (checklist).\nMọi quy trình, hành động ngoài Đời phải tuân theo nguyên lý, Quy luật Vũ Trụ trước đó. Hiểu Quy luật, Nguyên lý, nguyên năng là HIỂU ĐƯỢC ĐẠO.", "d": 1}]}, {"part": 1, "num": 26, "title": "Phước và hoạ", "summary": "Phước (may mắn) và Họa (vận xui) đều là năng lượng Tâm thức vận hành theo Luật Hấp Dẫn, không đến từ hành động bên ngoài. Phước bền vững đến từ việc tu tập gia tăng rung động nội tại; Họa được hóa giải bằng cách chịu trách nhiệm, cầu nguyện và gột rửa ô trược nội tâm.", "key": "\"Phước\" đến từ NĂNG LƯỢNG TÂM THỨC chứ không đến từ HÀNH ĐỘNG NGOÀI THÂN.", "cards": [{"q": "Bản chất của \"Phước\" là gì?", "a": "PHƯỚC = SỰ MAY MẮN = NĂNG LƯỢNG TÂM THỨC VI TẾ, THANH NHẸ. Phước báu là nhiều thuận lợi trong mọi mặt cuộc sống; năng lượng này chuyển động theo Luật Hấp Dẫn: Tâm thức càng thanh nhẹ càng hút may mắn đến tự nhiên.", "d": 1}, {"q": "Phân biệt Phước báu tự thân và Phước báu hưởng lây?", "a": "• Tự thân: đến từ việc chủ động gia tăng rung động nội tại (tu hành, luyện Thiền) – bền vững nhất.\n• Hưởng lây (ngoại lực): nhờ ở gần Minh Sư, người nhiều Công Đức, gia tộc đạo đức… – tạm bợ, mất đi khi mối quan hệ, môi trường đó chấm dứt."}, {"q": "Phân biệt \"Làm Phước\" và \"Tạo Phước\"?", "a": "• Làm Phước: đơn giản là giúp đỡ người khác – một việc làm tích cực; nếu mong cầu nhận lại (lời cảm ơn, may mắn, chuộc lỗi) là \"bản ngã đang làm Phước\".\n• Tạo Phước: giúp đỡ tự nhiên, không mong cầu gì – hành động Vô vi, thuộc Chân ngã, Tự Nhiên."}, {"q": "Vì sao Người Giác ngộ có \"Phước báu vô lượng\"?", "a": "Vì nguyên năng tuôn trào liên tục trong Tâm thức hợp nhất với Tạo Hóa, thuần khiết nhất (\"Trí cực sạch, Tâm cực an\"). Họ giúp đỡ mà không có chủ nhân, không mục đích – như Mặt Trời cho ánh sáng. Không làm mà thành, không muốn mà có, không mong cầu mà được."}, {"q": "Bí mật của việc \"ngưỡng mộ sự thành công của người khác\"?", "a": "Ngưỡng mộ thành công là ngưỡng mộ Phước báu của người đó; mà ngưỡng mộ thì năng lượng dịch chuyển về. Vì vậy may mắn sẽ dịch chuyển về người ngưỡng mộ – nhưng phải vô điều kiện, không phải ngưỡng mộ để được nhận Phước."}, {"q": "Một số cách tự tạo Phước cho bản thể?", "a": "• Tu tập Tâm linh đúng đắn; luyện Thiền mọi lúc\n• Quán Trí, Quán Tâm, 5 Bước Tỉnh Thức\n• Ngưỡng mộ thành công người khác vô điều kiện\n• Cho đi không cần nhận lại\n• Gần Minh Sư, sống nơi rung động cao\n• Cầu nguyện, tạ ơn mỗi ngày\n• Tránh mê tín, đồ cúng, nghĩa địa, bệnh viện"}, {"q": "\"Họa\" là gì và từ đâu mà đến?", "a": "HỌA = SỰ XUI XẺO, BẤT LỢI = NĂNG LƯỢNG TÂM THỨC NẶNG VÀ THÔ TRƯỢC. Do chính mình tạo ra từ rung động nội tâm nặng nề (tạp niệm, sân si, đố kỵ, lo lắng, mê tín…). Người nhiều Họa tích trữ Nghiệp lớn trong quá khứ; hành động tốt mà Tâm thức thô trược thì Họa vẫn đến.", "d": 1}, {"q": "Làm gì khi \"Họa\" đến?", "a": "• Nhận lỗi về chính mình, trực diện đối diện – CHỊU TRÁCH NHIỆM là chìa khóa của pháp Sám Hối (tinh hoa của Ho'oponopono).\n• Cầu nguyện và Xin tha thứ với lòng thành.\n• Tu tập, luyện Thiền, tín tâm vào Tạo Hóa để hóa giải nghiệp tồn đọng."}]}, {"part": 1, "num": 27, "title": "Sự hoạt động của “Vận mệnh”", "summary": "Vận mệnh là tổng hợp các sự kiện đến với một con người, được tạo ra bởi 3 quy luật Nhân Quả, Hấp Dẫn, Lượng Đủ – Chất Đổi, vốn đều phụ thuộc vào nhân vô hình trong Tâm Trí. Vì vậy làm chủ Tâm Trí và gột rửa ô trược Tâm thức là cách duy nhất để cải vận; sứ mệnh đích thực cũng đến từ sự tự do của Tâm Trí.", "key": "Kiểm soát Tâm Trí hoàn toàn là kiểm soát được vận mệnh của bản thể.", "cards": [{"q": "\"Vận mệnh\" được định nghĩa thế nào?", "a": "Vận mệnh (số mệnh) là sự tổng hợp tất cả các sự kiện đến với một con người từ lúc sinh ra cho đến khi qua đời."}, {"q": "Ba quy luật nào giải thích vận mệnh và chúng phụ thuộc vào đâu?", "a": "Quy luật Nhân Quả, Quy luật Hấp Dẫn, Quy luật Lượng Đủ – Chất Đổi. Cả ba phụ thuộc vào \"nhân vô hình\" xuất hiện trong Tâm Trí. Vậy kiểm soát Tâm Trí hoàn toàn → kiểm soát nhân vô hình → kiểm soát được vận mệnh."}, {"q": "Quá trình \"cải vận\" còn được gọi bằng những tên nào?", "a": "Quá trình Tiến hóa của Linh hồn, Quá trình Gột rửa Ô trược của Bản ngã, Tiến hóa Ý thức; dân gian gọi là Sự cải vận hay Thay đổi vận mệnh. Gột rửa ô trược Tâm thức là cách duy nhất để cải vận."}, {"q": "Vì sao nhiều người nỗ lực, học nhiều mà vận mệnh không đổi?", "a": "Vì ô trược Tâm thức vẫn còn, nên Luật Hấp Dẫn và Nhân Quả tiếp tục mang lại bất lợi. Họ chỉ thay đổi phần ngọn (Bước 03–05 trong 5 Bước Thay Đổi Nhân Quả) chứ không thay đổi gốc rễ ở Bước 01–02."}, {"q": "Bước quan trọng nhất trong 5 Bước Thay Đổi Nhân Quả (5 Bước Cải Vận)?", "a": "BƯỚC I – CHUYỂN ĐỔI NĂNG LƯỢNG (gia tăng rung động nội tại), thực hiện bằng thấu hiểu lời dạy, luyện Thiền, ngồi im lặng trầm mặc, Quán Trí, Quán Tâm."}, {"q": "\"Sứ mệnh\" đích thực là gì theo sách?", "a": "Sứ mệnh chỉ đơn giản là niềm yêu thích với việc mình đang làm, thay đổi uyển chuyển theo từng thời điểm, hoàn cảnh. Ép buộc bản thân \"phải làm\" và cho đó là sứ mệnh là đang dính mắc, bám víu hình tướng, làm nô lệ cho Tâm Trí."}, {"q": "Phân biệt \"hành động trong Tỉnh thức\" và \"hành động trong Vô minh\"?", "a": "• Tỉnh thức: \"Sự sáng của Ý thức\" dẫn dắt hành vi.\n• Vô minh: \"dao động nội tâm\" dẫn dắt hành vi (ý nghĩ, cảm xúc, trạng thái dẫn dắt).\nSự tự do của sứ mệnh đến từ việc làm chủ Tâm Trí."}]}, {"part": 1, "num": 28, "title": "Bản chất của “sự buông bỏ” trong tu tập tâm linh", "summary": "Buông bỏ đích thực không phải từ bỏ gia đình, sự nghiệp hay hình tướng bên ngoài, mà là chấm dứt mọi dao động nội tâm, đưa Tâm Trí về tĩnh lặng thuần khiết. Thực hành cốt lõi là \"nhận ra\" mọi hình tướng và tín tâm tuyệt đối vào Tâm Pháp \"Cái gì nhận ra được thì không phải là Ta\".", "key": "Buông bỏ không phải buông hình tướng của thế giới bên ngoài, mà buông hình tướng của thế giới nội tâm.", "cards": [{"q": "Bản chất của \"sự buông bỏ\" là gì?", "a": "Là sự sụp đổ cấu trúc [Ta là + \"bất cứ điều gì đó\"] – sự sụp đổ của bản ngã. Là chấm dứt mọi dao động nội tâm, trả Tâm Trí về tĩnh lặng thuần khiết, \"cực sạch\". Buông bỏ đồng nghĩa với \"không vướng bận\", \"ưng vô sở trụ\" và \"giải thoát\"; đối lập với \"ràng buộc\"."}, {"q": "Hiểu lầm phổ biến về câu \"Tu tập là buông bỏ tất cả\"?", "a": "Lầm tưởng phải lìa xa nhân thế, bỏ vợ con, không lập gia đình, không kiếm tiền. Thực ra buông bỏ là buông tạp niệm, đau khổ, sân si, đố kỵ… trong nội tâm. Chỉ buông bỏ những thứ ngoài thân mà ngỡ là tu hành chính là Đại Vô Minh."}, {"q": "Phân biệt Tiểu Ẩn và Đại Ẩn?", "a": "• Tiểu Ẩn: lìa xa thế tục mới có an bình; tiếp xúc đời thường là bấn loạn ngay.\n• Đại Ẩn: sống giữa đời thường mà luôn tĩnh lặng, an lạc, \"Tâm bất biến giữa dòng đời vạn biến\" – nội lực mạnh như \"hoa sen trong đầm lầy\". Đó là tinh thần Di Lặc: Thông Đạo – Thạo Đời."}, {"q": "Dấu hiệu nào cho thấy đã thực sự buông bỏ một người hay sự việc?", "a": "Khi nhắc đến điều đó, người đó mà Tâm Trí không dao động, không khởi ý nghĩ, cảm xúc hay hình tướng nào. Còn nghĩ ngợi về nó tức là còn vướng bận, ràng buộc – dù miệng nói \"không quan tâm nữa\"."}, {"q": "Phân biệt tình yêu bản ngã và tình yêu trong Tỉnh thức?", "a": "• Tình yêu bản ngã (vô minh): ghen tuông, chiếm đoạt, muốn sở hữu, muốn được đáp lại; chia tay rồi vẫn nghĩ về nhau – chỉ giải thoát thân xác.\n• Tình yêu Tỉnh thức: không ghen tuông, không sở hữu, không mong đợi – yêu thương vô điều kiện trong nội tâm thanh tịnh."}, {"q": "4 nguồn năng lượng nội tại giúp hóa giải dao động nội tâm (hóa giải Nghiệp)?", "a": "1. Năng lượng từ \"Sự sáng của Ý thức\"\n2. Năng lượng Đức tin\n3. Năng lượng Tình yêu\n4. Năng lượng Biết ơn\nĐều sinh hóa đầu tiên từ năng lượng nguyên thủy, có sức chuyển hóa không giới hạn."}, {"q": "5 sự thực hành gia tăng \"sự sáng của Ý thức\" từ căn bản đến chuyên sâu?", "a": "1. Dọn rác và Dọn rác đa chiều\n2. Thiền với 5 Bước Tỉnh Thức\n3. Quán Tâm, Quán Trí, quán về \"Cái gọi là Ta?\"\n4. Tín tâm tuyệt đối vào Tâm Pháp \"Cái gì nhận ra được thì không phải là Ta\"\n5. Trầm mặc với \"Cái chết\" và trạng thái \"trước khi Vũ Trụ hình thành\""}, {"q": "Cách thực hành [sự sáng của Ý thức + Đức tin] khi một dao động nội tâm xuất hiện?", "a": "Khi ý nghĩ, cảm xúc buồn, lo lắng, ghen tuông… xuất hiện → \"Nhận ra sự có mặt của nó\", rồi lặp lại và tín tâm tuyệt đối: \"CÁI GÌ NHẬN RA ĐƯỢC THÌ KHÔNG PHẢI LÀ TA\". Liên tục, kiên trì. Không tín tâm, không lòng thành thì Tâm Pháp vô nghĩa."}, {"q": "Sơ đồ \"Lăng kính Tâm Trí\" giữa Ta và cuộc sống?", "a": "TA → LĂNG KÍNH \"TÂM TRÍ\" (sinh khởi các ý niệm) → SỰ VẬT HIỆN TƯỢNG TRONG CUỘC SỐNG. Tâm Trí là chiếc cầu nối trung gian giữa bản thể với cuộc sống.", "d": 1}, {"q": "Ví dụ \"chấm đen trên bảng trắng\" nói gì về buông bỏ?", "a": "Mỗi ý nghĩ, cảm xúc, trạng thái, hình tướng trong Tâm Trí như một chấm đen trên bảng trắng. Càng nhiều chấm đen càng ràng buộc, vướng bận, đau khổ, nặng nề. Hóa giải chúng, lau sạch bảng Tâm Trí, trả lại sự tinh khôi ban đầu chính là \"buông bỏ đích thực\".", "d": 1}]}, {"part": 1, "num": 29, "title": "Lớp màn “suy tưởng” – dòng chảy ý nghĩ", "summary": "Dòng chảy miên man suy tưởng sinh ra do hai nguồn năng lượng ô trược: nghiệp tồn đọng từ quá khứ và sự lây nhiễm từ bên ngoài. Khi Trí cực sạch, Tâm cực an thì nghiệp đã được gột rửa; cách hiệu quả nhất là nhận ra hình tướng chứ không cố chấm dứt, và Thiền là mọi hành động làm tan lớp màn suy tưởng.", "key": "Tâm Trí không phải gốc rễ của khổ đau; sự ô trược của năng lượng Tâm thức mới là gốc rễ.", "cards": [{"q": "Hai hình thái của Ý nghĩ?", "a": "1. Ý nghĩ chủ động: Tâm Trí chủ động tạo ý tưởng, tư duy, lập kế hoạch – dưới sự kiểm soát của Ý thức.\n2. Ý nghĩ thụ động: \"dòng chảy miên man\" không hồi kết, cuốn trôi Ý thức, phá vỡ sự tĩnh lặng và tập trung."}, {"q": "Hai nguồn năng lượng làm Tâm Trí miên man, suy tưởng không ngừng?", "a": "1. Năng lượng ô trược tồn đọng trong Tâm thức (Nghiệp tích trữ trong quá khứ, qua nhiều kiếp), bám quanh bản ngã, định hình tính cách.\n2. Sự lây nhiễm ô trược từ bên ngoài (tha lực thô trược): bạn bè tiêu cực, phim kinh dị, báo tiêu cực, mạng xã hội.\nCả hai tác động vào Trí → Trí tạo ra miên man suy tưởng.", "d": 1}, {"q": "Quan hệ giữa \"Trí\" và \"Tâm\" theo sơ đồ?", "a": "• Trí sinh ý nghĩ tiêu cực → Tâm sinh cảm xúc, thái độ tiêu cực tương ứng.\n• Trí sinh ý nghĩ tích cực → Tâm sinh cảm xúc tích cực tương ứng.\n• Trí cực sạch mọi ý nghĩ → Tâm thanh tịnh, an yên, nhẹ nhàng."}, {"q": "Cách hiệu quả nhất để chuyển hóa dòng chảy miên man?", "a": "Càng nỗ lực chấm dứt thì nó càng không chấm dứt. Cách hiệu quả nhất: NHẬN RA sự có mặt của các hình tướng đó và tín tâm tuyệt đối \"Cái gì nhận ra được thì không phải là Ta\"."}, {"q": "Sự dao động của Tâm Trí biểu trưng cho điều gì?", "a": "Biểu trưng cho còn nghiệp hay hết nghiệp: Tâm Trí thanh tịnh = sạch nghiệp; Tâm Trí động loạn = còn nghiệp. Ấn chứng tiến hóa Tâm linh là sự thanh tịnh, tràn đầy năng lượng nguyên thủy – biểu hiện thành Chân ngã hay Phật tính."}, {"q": "Thiền là gì theo sách?", "a": "Bất cứ hành động nào làm tan chảy \"lớp màn suy tưởng\", hóa giải ô trược Tâm thức đều là Thiền – không chỉ ngồi bán già nhắm mắt. Ví dụ: du lịch tĩnh dưỡng, tập thể dục, trồng cây, ngồi một mình quan sát nội tâm, đọc kinh, niệm chú."}, {"q": "Vì sao không nên luyện tập tập trung vào \"phút giây hiện tại\"?", "a": "Vì \"thực tại hiện tiền\" chỉ là sản phẩm tự nhiên của CÁI TRÍ CỰC SẠCH. Khi dòng chảy miên man được hóa giải, Tâm Trí tự động tập trung ở hiện tại không cố gắng. Hãy quay vào bên trong để hóa giải ô trược."}, {"q": "Sơ đồ Trí tạo ra Tâm như thế nào?", "a": "TRÍ tạo ra HIỆN HỮU VÔ HÌNH; năng lượng của các \"hiện hữu\" cộng lại tạo thành \"TÂM\" – nơi chứa đựng năng lượng của hiện hữu. Tâm biểu hiện thành: cảm xúc, tình cảm, trạng thái nội tâm, thái độ.", "d": 1}]}, {"part": 1, "num": 30, "title": "Sự hình thành của tính cách", "summary": "Tính cách được hình thành từ năng lượng Tâm thức (sinh hóa lần I: Chân ngã; lần II: bản ngã tích cực/tiêu cực), và gốc rễ của nó là các ý niệm sinh khởi trong Tâm Trí chứ không phải thói quen hay hành động. Mọi hình thái bản ngã thô trược đều sinh từ \"So sánh\" và \"Mong cầu\"; đối nghịch là \"Chấp nhận\" và \"Biết ơn\".", "key": "Thói quen không tạo ra thành công cuộc sống, mà sự kiểm soát, làm chủ Tâm Trí mới tạo ra thành công.", "cards": [{"q": "Tương quan giữa các lần sinh hóa năng lượng Tâm thức và tính cách con người?", "a": "• Sinh hóa lần I: Chân ngã (Phật tính, Tính cách Vũ Trụ) – ấn chứng Giác ngộ, \"Thiên Đường\".\n• Sinh hóa lần II – tích cực: \"bản ngã tích cực\", Khổng Tử gọi là Quân tử.\n• Sinh hóa lần II – tiêu cực: \"bản ngã tiêu cực\", Khổng Tử gọi là Tiểu nhân."}, {"q": "Câu danh ngôn \"Gieo suy nghĩ… gặt cuộc đời\" còn thiếu điều gì?", "a": "Nó chỉ nói hành trình \"sau khi ý nghĩ xuất hiện\" (Suy nghĩ → Hành động → Thói quen → Tính cách → Cuộc đời), chưa nói hành trình \"trước khi ý nghĩ xuất hiện\" – mới là bản chất đích thực."}, {"q": "4 yếu tố của hành trình \"trước khi ý nghĩ xuất hiện\"?", "a": "1. Ý thức – sự sáng của Ý thức, công cụ vô nhiễm nhận biết mọi dao động.\n2. Tâm Trí và cách làm chủ hoàn toàn mọi ý nghĩ.\n3. Gột rửa ô trược năng lượng Tâm thức (gột rửa Nghiệp).\n4. Bản ngã và cấu trúc tạo nên bản ngã – cốt lõi mọi khổ đau."}, {"q": "Vì sao chỉ cần kiểm soát Tâm Trí, không cần kiểm soát thói quen?", "a": "Vì hành động, thói quen, tính cách, cuộc đời đều chỉ là \"Quả\"; \"Nhân\" là mọi ý niệm, cảm xúc, trạng thái sinh khởi trong Tâm Trí. Thay đổi Nhân thì Quả tự nhiên khác. Tham gia hội thảo tích cực chỉ đổi được 3–7 ngày rồi quay về cũ."}, {"q": "Sự ích kỷ hình thành thế nào và có tiêu trừ bằng hành động chia sẻ không?", "a": "Sinh từ ý niệm so sánh \"cái được\", \"cái mất\" với người khác, qua 3 giai đoạn: xuất hiện ý niệm → lặp lại, nuôi dưỡng → biểu hiện thành hành vi. Không tiêu trừ bằng cho đi nhiều hơn; ích kỷ nằm ở sinh khởi hơn thua, được mất trong Tâm Trí, không ở hành động."}, {"q": "Lười biếng và trì hoãn sinh ra từ những ý niệm nào?", "a": "Từ việc nuôi dưỡng năng lượng chậm chạp, thô trược qua các ý niệm: \"để từ từ rồi làm\", \"vài ngày nữa\", \"không cần vội\", \"còn nhiều thời gian\", \"chưa đến deadline\", \"đợi được công nhận rồi mới làm\". Cũng hình thành qua 3 giai đoạn như sự ích kỷ."}, {"q": "Phân biệt bản ngã \"tự ti\" và \"tự phụ, tự mãn, tự kiêu\"?", "a": "Cả hai đều sinh từ so sánh đối chiếu bản thân với người khác:\n• Tự ti = Thiếu niềm tin vào bản thân + So sánh, đối chiếu bản thân với người khác; \"đánh giá thấp\" mình, sợ bị đánh giá.\n• Tự phụ: \"đánh giá cao\" bản thân, xem thường người khác, muốn được thừa nhận; rất dễ tổn thương khi bị xem thường.", "d": 1}, {"q": "Công thức hình thành trạng thái \"Lo lắng, sợ hãi\"?", "a": "LO LẮNG, SỢ HÃI = β01 + β02 + β03 + … + βn – cộng dồn NLTT của các ý niệm tiêu cực do Tâm Trí suy diễn. Sơ đồ: TA → Lăng kính Tâm Trí sinh ý niệm tiêu cực → sự việc. Ví dụ: sợ nghèo đói (\"Không biết mình có giàu được không?\"…), con không nghe máy, chồng về khuya.", "d": 1}, {"q": "3 bước hóa giải lo lắng, sợ hãi (và các hình thái bản ngã khác)?", "a": "1. \"Nhận ra\" mọi ý niệm, ý nghĩ, suy diễn mà Tâm Trí sinh ra (tích cực, tiêu cực hay trung tính).\n2. Hiểu rằng đó không phải là \"Ta\"; \"Ta\" nằm ngoài mọi hiện hữu.\n3. Kiên trì thực hành ráo riết 2 bước trên."}, {"q": "Stress, căng thẳng sinh ra từ hai dạng hiện hữu nào?", "a": "Từ \"So sánh, đối chiếu, hơn thua\" và \"Mong cầu\". STRESS = f01 + f02 + … + fn (cộng dồn năng lượng các ý niệm). Ví dụ: áp lực sự nghiệp khi thấy bạn bè ngày càng thành công."}, {"q": "Bản ngã \"khoe khoang\" và \"đố kỵ, ghen ăn tức ở\" sinh ra từ đâu?", "a": "• Khoe khoang: từ ý niệm muốn được nể trọng, tung hô, thừa nhận, tỏ ra quan trọng; lớn mạnh nhờ sự chiều chuộng.\n• Đố kỵ: từ 2 từ khóa SO SÁNH và MONG CẦU; có thể phát triển thành ganh ghét, thù hận, thủ đoạn, thậm chí chiến tranh."}, {"q": "Hai yếu tố gốc của mọi bản ngã thô trược và điều đối ngược với chúng?", "a": "Mọi tính cách xấu đều là sản phẩm của SO SÁNH và MONG CẦU. Đối ngược là CHẤP NHẬN sự tồn tại của vạn vật \"là như vậy\" (Tâm Trí không suy diễn, không sinh quan điểm) cùng thái độ BIẾT ƠN – tạo hài lòng, an yên và Luật Hấp Dẫn mang may mắn đến."}, {"q": "Sơ đồ trước khi một hành vi hình thành và cách kiểm soát hành vi?", "a": "Tâm Trí → Ý niệm, ý nghĩ → được nuôi dưỡng đến khi đủ mạnh → lời nói, hành vi tương ứng.\n• GĐ 01: hình thành ý niệm.\n• GĐ 02: nuôi dưỡng năng lượng ý niệm.\n• GĐ 03: ý niệm đủ mạnh điều khiển thân xác.\nChỉ cần kiểm soát GĐ 01 – cũng là kiểm soát Tâm Trí hoàn toàn.", "d": 1}]}, {"part": 1, "num": 31, "title": "Kim tự tháp của “sự tiến hoá”", "summary": "Sự tiến hoá Tâm thức là kim tự tháp 3 tầng: Bản năng (nền móng) → Bản ngã (tiêu cực, tích cực, vi tế) → Vô ngã - Chân ngã (chóp bu). Bản năng cần được trân quý, bản ngã cần được nhận ra, và Chân ngã là đích đến của mọi pháp tu.", "key": "Bản năng là cái nền móng vững chắc của sự tiến hoá; Chân ngã là chóp bu cao nhất của kim tự tháp.", "cards": [{"q": "Ba tầng của kim tự tháp \"sự tiến hoá\"?", "a": "1. BẢN NĂNG (nền móng): Ăn, Uống, Chỗ nghỉ ngơi, Được an toàn, Tình dục.\n2. BẢN NGÃ: bản ngã tiêu cực, bản ngã tích cực, bản ngã vi tế.\n3. CHÂN NGÃ – Vô ngã (chóp bu cao nhất).\nHành trình tiến hoá: BẢN NĂNG → BẢN NGÃ → CHÂN NGÃ.", "d": 1}, {"q": "\"Bản năng\" là gì và mục đích tối hậu của nó?", "a": "Là những thứ định sẵn của Tạo Hoá (THIÊN TẠO), thuộc về Tự nhiên, tức là Đạo, nên luôn toàn hảo. Nó ẩn sâu trong Vô thức, hoạt động không cần Ý thức can thiệp. Mục đích tối hậu: BẢO VỆ SỰ SỐNG."}, {"q": "5 nhu cầu bản năng thường thấy?", "a": "1. Ăn\n2. Uống\n3. Chỗ nghỉ ngơi\n4. Được an toàn\n5. Tình dục\nCần đáp ứng trước tiên: \"Có thực mới vực được Đạo\" – sinh tồn trước khi phát triển."}, {"q": "Phân biệt Tình dục và Dâm dục/tà dâm?", "a": "• Tình dục, rung cảm tình dục trong tình yêu là BẢN NĂNG – thuộc Tự nhiên, là món quà của Tạo Hoá.\n• Dâm dục, tà dâm là BẢN NGÃ – ham muốn chiếm đoạt, sở hữu, thoả mãn dục vọng bất chấp, dẫn tới xâm hại người khác."}, {"q": "Vì sao tác giả cho rằng tu khổ hạnh ép xác là sai đường?", "a": "Vì nghiêm cấm tình dục, nhịn ăn uống, lìa xa thế tục, không lao động... là làm TRÁI LẠI VỚI TỰ NHIÊN, tức trái với Tạo Hoá. Người Giác ngộ vẫn đói ăn, khát uống, mệt ngủ, lao động như người thường; chỉ khác ở Tâm thức."}, {"q": "Bản ngã sinh ra từ đâu và lõi của nó là gì?", "a": "Sinh ra từ SỰ ĐỒNG HOÁ VỚI HÌNH TƯỚNG theo cấu trúc [\"Ta là\" + \"bất cứ điều gì đó\"]. Lõi của nó là \"KHẲNG ĐỊNH BẢN THÂN\", khiến Tâm Trí vướng vào 2 yếu tố gây khổ: SO SÁNH và MONG CẦU."}, {"q": "3 dạng bản ngã trong sự tiến hoá?", "a": "• Bản ngã tiêu cực: hơn thua, đố kỵ, độc ác... – tầng thấp nhất, sinh xã hội chiếm hữu nô lệ, phong kiến.\n• Bản ngã tích cực: tự lập, trách nhiệm, \"Quân tử\" – sinh tư tưởng Tự do - Dân chủ.\n• Bản ngã vi tế: đồng hoá với điều huyền bí, \"mang theo sứ mệnh\"."}, {"q": "Tâm thức \"Vô ngã - Chân ngã\" là gì?", "a": "Là Tâm thức đã CHẤM DỨT MỌI KHÁI NIỆM VỀ \"TA LÀ\", hiện hữu an lạc, điềm nhiên, tĩnh lặng, thông thái, làm chủ Tâm Trí hoàn toàn. Phật giáo gọi là Phật tính; tác giả gọi là Tính cách Vũ Trụ – biểu trưng của Chân - Thiện - Mỹ, rung động ở \"năng lượng nguyên thuỷ\"."}, {"q": "Tâm Pháp nào được ví như \"Pháp bảo ngàn năm\" giúp chấm dứt đồng hoá với hình tướng?", "a": "\"CÁI GÌ NHẬN RA ĐƯỢC THÌ KHÔNG PHẢI LÀ TA\". Lấy nó làm kim chỉ nam cho toạ thiền và tu tập sẽ tạo bước ĐẠI NHẢY VỌT, dẫn đến giải thoát hoàn toàn."}]}, {"part": 1, "num": 32, "title": "Lịch sử tiến hoá Tâm thức của nhân loại", "summary": "Lịch sử tiến hoá Tâm thức nhân loại gắn chặt với sự tiến hoá của bản ngã, đi theo định luật kim tự tháp từ thời sơ khai qua chiếm hữu nô lệ, phong kiến, tư bản đến thế kỷ XXI – thời đại tỉnh thức tâm linh hàng loạt hướng về Chân ngã.", "key": "Thế kỷ XXI: tỉnh thức tâm linh trở thành bắt buộc – dưới áp lực của bùn nhơ thì hoa sen sẽ nở.", "cards": [{"q": "Lịch sử tiến hoá Tâm thức nhân loại gắn với điều gì?", "a": "Gắn chặt với lịch sử tiến hoá của BẢN NGÃ và tuân theo định luật KIM TỰ THÁP. Còn gọi là SỰ TIẾN HOÁ CỦA Ý THỨC: sự sáng của Ý thức càng thăng hoa, Nghiệp lực càng được gột rửa, càng gần Chân ngã."}, {"q": "Vì sao nên dùng chữ \"phát hiện\" thay \"phát minh\"?", "a": "Vì mọi thứ đã có sẵn từ Tạo Hoá; con người chỉ phát hiện nguyên lý, định luật của Tự nhiên rồi \"xào nấu lại\" để ứng dụng vào đời sống. Hiểu vậy thì phải BIẾT ƠN và TẠ ƠN cuộc sống."}, {"q": "Bản ngã hình thành thế nào trong thời chiếm hữu nô lệ và phong kiến?", "a": "Sự TƯ HỮU xuất hiện → Tâm Trí hình thành SO SÁNH và MONG CẦU → muốn KHẲNG ĐỊNH BẢN THÂN qua tài sản, địa vị, chức tước. Bản ngã cộng đồng lớn mạnh, đỉnh điểm là chiến tranh xâm lược, đồng hoá dân tộc khác."}, {"q": "Theo tác giả, lãnh đạo quốc gia phản ánh điều gì?", "a": "Lãnh đạo là đại diện cho \"bản ngã cộng đồng\" của quốc gia: \"Nhân quả của quốc gia đã tạo nên lãnh đạo hiện tại\". Quyết sách phản ánh NGHIỆP LỰC hiện tại; lãnh đạo không tỉnh thức thì \"nghiệp sẽ dẫn dắt vận mệnh\"."}, {"q": "Chiến tranh, dịch bệnh, thiên tai, địa ách có ý nghĩa gì?", "a": "Là quá trình \"thanh tẩy NGHIỆP tự nhiên của Tạo Hoá\", diễn ra theo chu kỳ khi động loạn lên đỉnh điểm. Nghiệp lực tan thì thời kỳ thái bình xuất hiện và bắt đầu chu kỳ tích luỹ nghiệp mới. Chỉ chấm dứt khi toàn nhân loại thức tỉnh tâm linh."}, {"q": "Phân biệt Vô minh và Minh Triết?", "a": "• Vô minh: nhận thức sai lệch, trái sự vận hành tự nhiên → động loạn, bệnh tật, khổ đau.\n• Minh Triết: chân lý, sự thật, bản chất vận hành của Tạo Hoá.\nHành trình: HIỂU ĐÚNG → LÀM ĐÚNG → KẾT QUẢ ĐÚNG."}, {"q": "Đặc điểm của thời hậu tư bản và thế kỷ XXI?", "a": "• Hậu tư bản (\"Thời đại Hoàng kim\"): nghiệp đã được gột rửa qua hai thế chiến; hướng đến Bình đẳng - Tự do - Dân chủ - Độc lập, tư tưởng \"open\".\n• Thế kỷ XXI: tỉnh thức tâm linh hàng loạt nhờ Internet và toàn cầu hoá; \"thế kỷ của Di Lặc\" – Đại gia, Giác ngộ."}, {"q": "Vì sao thế kỷ XXI là giai đoạn \"chọn lọc tự nhiên gắt gao nhất\"?", "a": "Vì Internet cũng lan truyền sự động loạn, trược năng lượng với tốc độ chóng mặt. Người thức tỉnh mạnh mẽ mới thọ hưởng hồng ân; người không thức tỉnh sẽ chịu stress, tự hại, băng hoại đạo đức. TỈNH THỨC TÂM LINH TRỞ THÀNH BẮT BUỘC."}, {"q": "Hai cách triệt tiêu nghiệp lực địa cầu?", "a": "1. Thụ động: Tự nhiên gột rửa qua chiến tranh, dịch bệnh, thiên tai, địa ách.\n2. Chủ động: qua giáo dục, thức tỉnh tâm linh cộng đồng, nghi thức tâm linh, thiền định – cần sự am hiểu sâu sắc và khai thị của Minh Sư."}, {"q": "Bản chất của \"văn hoá\" và \"văn minh\"?", "a": "• Văn hoá: việc đối xử và giao tiếp giữa người với người (cốt tuỷ \"Đắc Nhân Tâm\" là tự nhiên, chân thành, trung thực).\n• Văn minh: khả năng vận dụng những gì có sẵn từ Tạo Hoá để cuộc sống thuận tiện hơn – gắn với \"phát hiện mới\", còn gọi là Thiên khải/Mặc khải."}]}, {"part": 1, "num": 33, "title": "Sự giao thoa và truyền thừa năng lượng Tâm thức", "summary": "Năng lượng Tâm thức có tính giao thoa, lây lan và truyền thừa giữa người với người, giữa các thế hệ; vì vậy cần tránh môi trường rung động thấp, gần Tâm thức cao, và lấy tu tập tâm linh làm nền tảng thay đổi vận mệnh cá nhân lẫn dân tộc.", "key": "Lời nói, hành vi có thể che đậy, nhưng năng lượng Tâm thức thì không thể che đậy.", "cards": [{"q": "Bản chất của sự tương tác giữa vạn vật?", "a": "Là sự giao thoa năng lượng qua lại giữa 3 vòng tròn cấu tạo (Sự Tuyệt đối – Tâm thức – Thân xác): Thân xác tương tác Thân xác, Tâm thức tương tác Tâm thức; Sự Tuyệt đối là cái chung của vạn vật. Không gian Tâm thức chịu 3 quy luật: Nhân Quả, Hấp Dẫn, Lượng Đủ - Chất Đổi."}, {"q": "\"Sự truyền thừa\" năng lượng Tâm thức là gì?", "a": "Năng lượng Tâm thức lây lan, dịch chuyển từ Tâm thức này sang Tâm thức khác, thế hệ này sang thế hệ khác; năng lượng vùng cao chuyển xuống vùng thấp. Phật giáo gọi là \"Tâm truyền Tâm\" (\"Giáo ngoại biệt truyền, bất lập văn tự\")."}, {"q": "Vì sao Tâm thức đẹp quan trọng hơn lời nói và hành vi đẹp?", "a": "Vì lời nói, hành vi có thể che đậy nhưng năng lượng Tâm thức thì không. Luật Hấp Dẫn vận hành theo rung động Tâm thức, không theo lời nói hay hành vi. Nên cần gia tăng rung động nội tại qua hành thiền, quan sát nội tâm, tự vấn \"cái gọi là Ta\", cầu nguyện."}, {"q": "Phân biệt Tình yêu bản ngã và Tình yêu thật sự?", "a": "• Tình yêu bản ngã: muốn đối phương làm theo ý mình, chiếm đoạt, sở hữu, sợ mất – khiến đối phương khó chịu (vd: cha mẹ áp đặt, ra lệnh cho con).\n• Tình yêu thật sự (Chân ngã): vô điều kiện, chân thành, tự nhiên, có sức chuyển hoá mạnh mẽ."}, {"q": "Các câu \"Con nhà nòi\", \"Phước từ ông bà để lại\", \"Đời cha ăn mặn, đời con khát nước\" nói lên điều gì?", "a": "Năng lượng Tâm thức (Nghiệp) mang tính truyền thừa và lây lan qua các thế hệ. Văn hoá, vận mệnh dân tộc là sự kế thừa năng lượng của cha ông; muốn đổi vận mệnh tận gốc phải lấy TU TẬP TÂM LINH làm nền tảng cốt lõi."}, {"q": "Một số không gian, nghề nghiệp rung động thấp gây lây nhiễm ô trược?", "a": "• Bệnh viện, nhà xác, nghĩa địa, nơi nhiều bài vị, am miếu\n• Chợ buôn bán động vật, nghề sát sanh, giết mổ\n• Hàng xóm sống tiêu cực\n• Đầu cơ Forex, phim kinh dị, tin tiêu cực, drama\n• Tiếp xúc thường xuyên người nội tâm nặng nề"}, {"q": "Thể nghiệm khi tiếp xúc với Tâm thức rung động cao?", "a": "• Nhẹ nhàng, tin yêu cuộc sống hơn\n• Có động lực, ý chí vươn lên\n• Nhiều ý tưởng hơn\n• Trí sáng, kiểm soát Tâm Trí tốt hơn\n• Bình an, hạnh phúc, biết ơn hơn\nMạnh nhất là tiếp xúc với một Bậc Giác ngộ."}, {"q": "3 vòng tròn cấu tạo (từ trong ra ngoài) theo sơ đồ?", "a": "(01) \"Sự Tuyệt đối\" – vòng trong cùng, cái chung của vạn vật.\n(02) \"Tâm thức Vũ Trụ\" – Thế giới Tâm thức.\n(03) \"Hữu hình Thế giới\" – Thế giới các hạt vật chất (Thân xác).", "d": 1}]}, {"part": 1, "num": 34, "title": "Giải ngộ – Chứng ngộ – Giác ngộ", "summary": "Hành trình tu tập gồm 3 giai đoạn tiến hoá nhận thức: Giải ngộ (hiểu đúng bản chất) → Chứng ngộ (tự thân dấn thân trải nghiệm) → Giác ngộ (thấu triệt trọn vẹn, hợp nhất với Sự Tuyệt đối). Ghi nhớ lý thuyết không phải là giác ngộ.", "key": "Đọc vạn cuốn sách không bằng đi vạn con đường, đi vạn con đường không bằng gặp vạn người, gặp vạn người không bằng gặp một Minh Sư, gặp Minh Sư không bằng tự Giác ngộ chính mình.", "cards": [{"q": "3 giai đoạn của sự tiến hoá nhận thức?", "a": "Kim tự tháp từ đáy lên đỉnh:\n1. GIẢI NGỘ (nền): thấu hiểu đúng bản chất (lý thuyết, nguyên lý).\n2. CHỨNG NGỘ: tự thân thực hành và trải nghiệm.\n3. GIÁC NGỘ (đỉnh): thấu triệt trọn vẹn, đã trở nên \"là như vậy\", an lạc và thông thái thực sự.", "d": 1}, {"q": "Vì sao phải hiểu rõ 3 giai đoạn trước khi tu tập?", "a": "• Tránh \"mới giải ngộ mà tưởng đã Giác ngộ\"\n• Hiểu lộ trình để trở nên \"là như vậy\", không chỉ biết và ghi nhớ\n• Biết dấn thân trải nghiệm, luyện thiền mới là thực chứng\n• Hiểu sai → làm sai → kết quả sai"}, {"q": "Vì sao Giải ngộ là bước quan trọng nhất?", "a": "Vì nó quyết định toàn bộ hành trình phía sau: kết quả tu tập, thay đổi vận mệnh, gia tăng rung động, hoá giải nghiệp lực đều tuỳ vào sự giải ngộ. Giải ngộ đúng hay không phụ thuộc cơ duyên gặp được MINH SƯ CAO CẤP. Chưa giải ngộ thì tu 100 năm cũng như ban đầu."}, {"q": "Nghĩa từ \"Giải ngộ\"?", "a": "\"Giải\" là giải thích, giải nghĩa; \"Ngộ\" là thấu hiểu. Giải ngộ là giải nghĩa sự thật tâm linh để đạt \"sự thấu hiểu bản chất\". Mọi lĩnh vực (chứng khoán, kinh doanh, nghề mộc...) đều có nguyên lý, quy luật; hiểu được chúng là giải ngộ – cần Thầy chỉ dạy. Tác giả còn gọi là KHAI TÂM."}, {"q": "Dấu hiệu của con đường Giải ngộ đúng đắn?", "a": "• Thoát mê tín dị đoan\n• Tự lực tu hành, không dựa tha lực\n• Tin yêu, tự tin vào bản thân\n• Làm chủ Tâm Trí ngày một tăng\n• Sống nhẹ nhàng, biết ơn; quan hệ cải thiện\n• Cái Ngã tiêu biến dần\n• Trí Định, Tâm an, Thân khoẻ"}, {"q": "Hệ luỵ của Giải ngộ sai lầm?", "a": "• Tâm Trí động loạn, sợ hãi \"tâm linh\" → mê tín, cúng bái quỳ lạy\n• Bức xúc, hơn thua, stress nhiều hơn\n• Mất niềm tin nơi chính mình, mất làm chủ Tâm Trí\n• Mong cầu đạo quả, ngộ nhận chứng đắc\n• Bản ngã lớn thành \"Đại ngã\": \"Ta là\" + \"đấng này đấng nọ\""}, {"q": "\"Chứng ngộ\" là gì?", "a": "\"Chứng\" là tự thân kinh nghiệm (từ \"chứng kiến\"); \"Ngộ\" là thấu hiểu. Chứng ngộ là dấn thân thực hành, trải nghiệm trong thiền định và cuộc sống để thấu hiểu Chân lý – bước trung gian tiến đến Giác ngộ tuyệt đối. Có thể gọi là \"dấn thân trải nghiệm\"."}, {"q": "Một số biểu hiện của Tâm thức đã chứng ngộ hoàn toàn?", "a": "• Thấu thị mọi ngóc ngách nội tâm, làm chủ Tâm Trí hoàn toàn\n• Bất an, tạp niệm nhanh chóng trở về an lạc, yên tĩnh\n• Biết hoá giải ô nhiễm và tự bảo vệ Tâm thức\n• Trực giác nhạy bén\n• Bản ngã tan rã\n• Vận dụng quy luật Vũ Trụ, viên mãn Đạo và Đời"}, {"q": "\"Thời gian bảo nhậm\" là gì?", "a": "Là quá trình chạm vào khoảnh khắc Giác ngộ, rồi rơi xuống bị đồng hoá với hình tướng và loay hoay tìm cách quay lại – như \"mới nhậm chức\", còn bỡ ngỡ. Trải qua nhiều lần, sự thấu thị chín muồi thì thường trú liên tục trong khoảnh khắc Giác ngộ."}, {"q": "Những biểu hiện thường thấy trong quá trình chứng ngộ?", "a": "• Tìm đọc nhiều kinh sách rồi nhận ra mọi Minh Triết quy về một\n• Hành hương, tìm nhiều Thầy rồi thấy đều nằm trong lời Sư phụ\n• \"Lên voi xuống chó\": an lạc rồi bất an, đồng hoá rồi thoát đồng hoá\n• Có lúc nghi ngờ Pháp – nên TÍN TÂM là quan trọng nhất"}, {"q": "\"Giác ngộ\" là gì?", "a": "\"Giác\" là sáng suốt, thấu triệt, trọn vẹn; \"Ngộ\" là thấu hiểu. Người Giác ngộ đã chấm dứt câu hỏi \"Ta là ai?\", hoà nhập vạn vật, không còn chủ thể - khách thể, thường hằng trong tĩnh tịch. Năng lượng nguyên thuỷ viên mãn gọi là HÀO QUANG – \"câu thông với Cội nguồn\"."}, {"q": "Giác ngộ được ấn chứng bằng gì?", "a": "Không bằng ngôn ngữ hay trình bày hiểu biết, mà ấn chứng bằng \"NĂNG LƯỢNG NGUYÊN THUỶ\" – \"nội lực toả ra\". Năng lượng này sinh ra từ CÁI VÔ CÙNG, VÔ CỰC, KHÔNG HÌNH TƯỚNG (Phật giáo: Tánh Không; Lão Tử: Đạo; Ấn Độ giáo: Brahman)."}]}, {"part": 1, "num": 35, "title": "“Tỉnh thức” và bản chất của “sự tỉnh thức”", "summary": "Tỉnh thức là sự tách rời Ý thức khỏi hình tướng Tâm Trí sinh khởi, nhận ra chúng và hiểu \"đó không phải là Ta\"; bản chất cuối cùng là gia tăng sự sáng của Ý thức. Tác giả chia 6 cấp độ tỉnh thức, từ Vô minh đến Không còn ngôn ngữ.", "key": "Người vô minh ngỡ \"Ta là những gì ta nghĩ\"; người tỉnh thức biết \"Ta nằm ngoài mọi ý nghĩ\".", "cards": [{"q": "\"Tỉnh thức\" là gì?", "a": "\"Tỉnh\" là tỉnh táo, sáng suốt; \"Thức\" là đối nghịch với ngủ, là nhìn thấy, sáng tỏ. Tỉnh thức là nhận diện được sự có mặt của bất cứ hình tướng nào Tâm Trí sinh khởi (ý nghĩ, cảm xúc...) và hiểu rằng ĐÓ KHÔNG PHẢI LÀ TA, không bị kéo theo."}, {"q": "Bản chất của Tỉnh thức?", "a": "Là sự tách rời Ý thức ra khỏi hình tướng khởi sinh trong Tâm Trí, để nhận diện, quan sát, chứng kiến các dao động nội tâm thay vì bị cuốn trôi, đồng hoá. Bản chất cuối cùng: GIA TĂNG SỰ SÁNG CỦA Ý THỨC (khai mở Mắt Trí Huệ)."}, {"q": "Phân biệt Tỉnh thức và Vô minh?", "a": "• Vô minh: Ý thức bị che mờ, bị cảm xúc và dòng ý nghĩ dẫn dắt; ngỡ \"Ta là những gì nghĩ\".\n• Tỉnh thức: Ý thức nhận ra và quan sát Tâm Trí; \"TA NẰM NGOÀI MỌI Ý NGHĨ\"."}, {"q": "Thế nào là làm chủ Tâm Trí hoàn toàn?", "a": "Có thể chủ động tiến về sự im lặng bất cứ lúc nào; dùng Tâm Trí như công cụ thuần hoá cho tư duy, sáng tạo; không bị cuốn theo ý nghĩ, cảm xúc; nhận diện sắc nét đến từng dao động tinh vi nhất trong nội tâm."}, {"q": "Lộ trình thực hành của Pháp Thiền \"Tất Cả Chỉ Là Ý Nghĩ\"?", "a": "DỌN RÁC → 5 BƯỚC TỈNH THỨC → Tâm Pháp \"Cái gì nhận ra được thì không phải là Ta\" → Tâm Pháp \"Còn Ta thì sẽ còn cái khác Ta\" → Là một với Không tồn tại (trạng thái trước khi Vũ Trụ hình thành)."}, {"q": "Vì sao Tỉnh thức hoá giải được nghiệp lực?", "a": "\"Nhận ra\" là Ý thức chiếu rọi sự sáng của nó (năng lượng nguyên thuỷ) lên hình tướng, có sức mạnh chữa lành. Liên tục nhận ra một ý nghĩ/cảm xúc thì nó sẽ tan đi; khi mọi thứ vắng bóng, Tâm Trí trở về IM LẶNG nguyên thuỷ."}, {"q": "Điều kiện duy nhất để năng lượng Tỉnh thức lây lan từ Thầy sang đệ tử?", "a": "\"SỰ NGƯỠNG MỘ\". Nó mở cửa Tâm thức cho năng lượng Tỉnh thức truyền qua, là cửa ngõ đầu tiên của TÍN TÂM – bí mật trong sự giao thoa năng lượng với một vị Thầy."}, {"q": "Quan hệ giữa Tỉnh thức với Giác ngộ và Giải thoát?", "a": "Tỉnh thức là KHỞI ĐẦU của Giác ngộ và Giải thoát. Cùng đích của tỉnh thức là Giác ngộ tuyệt đối. Giải thoát là giải thoát Tâm Trí khỏi miên man, suy tưởng, khái niệm, định kiến – đưa Tâm Trí về trạng thái \"cực sạch\"."}, {"q": "6 cấp độ của Tỉnh thức?", "a": "I. Vô minh và vô minh sâu đậm\nII. Khai Tâm và Tỉnh thức\nIII. Làm chủ Tâm Trí hoàn toàn\nIV. Trí cực sạch, Tâm cực an, Ý thức thuần khiết\nV. Thấu thị vượt ngưỡng, uyên áo\nVI. Không còn ngôn ngữ (Vô tự kinh)"}, {"q": "Đặc điểm cấp độ I – Vô minh và vô minh sâu đậm?", "a": "Chỉ hơn động vật một chút. Bức xúc, đố kỵ, hơn thua, dễ bị cảm xúc điều khiển, không ngồi yên một mình được, dễ mê tín hoặc vô thần, tình yêu bản ngã, lợi ích cá nhân trên hết. Bản ngã càng lớn theo tuổi tác: cứng đầu, cố chấp hơn."}, {"q": "Cấp độ II – Khai Tâm diễn ra thế nào?", "a": "Khai Tâm là tách Ý thức khỏi dao động nội tâm, nhờ gặp Bậc Tỉnh thức. Bắt đầu bằng DỌN RÁC, rồi thực hành 5 BƯỚC TỈNH THỨC; mạnh nhất ở Tâm Pháp \"Cái gì nhận ra được thì không phải là Ta\". Tạp niệm giảm, thói xấu bỏ dần, bạn bè thay đổi vì năng lượng không còn tương đồng."}, {"q": "Đặc điểm cấp độ III và IV?", "a": "• III – Làm chủ Tâm Trí hoàn toàn: nghiệp lực gần như gột sạch, nhận biết sắc nét từng sát na, sống trong hiện tại, hào quang nhẹ xuất hiện.\n• IV – Trí cực sạch, Tâm cực an: chỉ đạt khi PHỦ ĐỊNH TUYỆT ĐỐI mọi tồn tại; \"Thượng Đế hiện hữu qua thân xác\", sản phẩm tạo ra là Thiên khải. Gọi là PHẬT."}, {"q": "Sơ đồ sinh hoá năng lượng từ Sự Tuyệt đối?", "a": "SỰ TUYỆT ĐỐI → NĂNG LƯỢNG NGUYÊN THUỶ, rồi phân hai:\n• Sinh hoá lần I (Nhất Nguyên - Hợp nhất) → năng lượng tiên thiên (không phân cực).\n• Sinh hoá lần II (Nhị Nguyên - Đối lập) → Năng lượng (-) tiêu cực và Năng lượng (+) tích cực.", "d": 1}, {"q": "Sinh hoá lần I (Nhất Nguyên) hình thành những năng lượng tiên thiên nào?", "a": "• Sự sáng của Ý thức\n• Đức tin\n• Tình yêu\n• Biết ơn\n• Hạnh phúc\n• Tự nhiên\n• Sự thông thái\n• Vị tha\n• Chân thành\n• Tĩnh lặng, thuần khiết...\nĐây là năng lượng không phân cực, có khả năng hoá giải, chữa lành.", "d": 1}]}, {"part": 1, "num": 36, "title": "Hiện hữu và vô hiện hữu", "summary": "Hiện hữu là mọi hình tướng (hữu hình và vô hình) có thể nhận ra được, còn \"sự thật về Ta\" nằm ngoài mọi hiện hữu. Vô hiện hữu là Sự Tuyệt đối – cội nguồn của mọi hiện hữu; ngộ được nó là Ngộ Đạo.", "key": "Cái gì nhận ra được thì là hiện hữu, đã là hiện hữu thì không phải là Ta.", "cards": [{"q": "\"Hiện hữu\" là gì?", "a": "\"Hiện\" là sự xuất hiện, có mặt; \"Hữu\" là có, tồn tại. Hiện hữu đồng nghĩa với HÌNH TƯỚNG. Bất cứ cái gì nhận ra được, cảm thọ được đều là hiện hữu – và đó không phải là Ta."}, {"q": "2 dạng hiện hữu?", "a": "1. Hiện hữu hữu hình: 5 giác quan nhận biết được (thân xác, tiền bạc, cái bàn, Trái Đất...).\n2. Hiện hữu vô hình: chỉ Ý thức (Mắt Trí Huệ) nhận biết được (ý nghĩ, cảm xúc, trạng thái nội tâm, tạp niệm...)."}, {"q": "Phân biệt Hướng nội và Hướng ngoại?", "a": "• HƯỚNG NỘI: đưa sự nhận biết vào nội tâm, nhận ra ý nghĩ, cảm xúc xuất hiện → tăng nội lực, tiến đến an lạc, tĩnh lặng. Đó là THIỀN.\n• HƯỚNG NGOẠI: chú ý ra bên ngoài (phán xét, phân tích...) → hao tổn năng lượng nguyên thuỷ, mệt mỏi, động loạn."}, {"q": "Ý thức có chức năng gì khác với Trí và Tâm?", "a": "Ý thức không tư duy như Trí, không sinh cảm xúc như Tâm; nó chỉ đơn thuần là SỰ CHỨNG KIẾN và nhận biết. Ai cũng có Ý thức, khác nhau ở sự sáng của nó. Thiền (hướng nội) là con đường duy nhất để tiến hoá Ý thức."}, {"q": "Hiện hữu liên hệ thế nào với 3 vòng tròn cấu tạo?", "a": "• Vòng 1 – Sự Tuyệt đối: \"vô hiện hữu\", cội nguồn sản sinh mọi hình tướng.\n• Vòng 2: hiện hữu vô hình dưới dạng năng lượng Tâm thức (không phân cực, tiêu cực, tích cực) – không cân đo được.\n• Vòng 3: hiện hữu vật chất, không gian của 5 giác quan."}, {"q": "4 nguồn năng lượng dễ câu thông với Cội nguồn?", "a": "1. Sự sáng tột cùng của Ý thức\n2. Đức tin\n3. Năng lượng tình yêu\n4. Năng lượng biết ơn\nĐây là năng lượng không phân cực, hội tụ đủ trong Tâm thức đã Giác ngộ."}, {"q": "Nên nhìn nhận các thể nghiệm trong Thiền thế nào?", "a": "Mọi thể nghiệm (bồng lai tiên cảnh, thiên đàng địa ngục, 7 sắc cầu vồng, tiền kiếp...) đều chỉ là hình tướng, \"RÁC CHƯA DỌN SẠCH\". Đồng hoá [\"Ta là\" + điều huyền bí] tạo bản ngã vi tế. Hãy tín tâm lặp lại: \"Cái gì nhận ra được thì không phải là Ta\"."}, {"q": "\"Vô hiện hữu\" là gì?", "a": "Là KHÔNG TỒN TẠI – cả dưới dạng năng lượng lẫn vật chất. Là bờ bên kia, cội nguồn của Ý thức; là vòng tròn số 1 – Sự Tuyệt đối; là Tánh Không; là trạng thái trước khi Vũ Trụ hình thành. Ngộ được Vô hiện hữu là NGỘ ĐẠO."}, {"q": "Sinh hoá lần II (Nhị Nguyên - Đối lập) tạo ra những năng lượng nào?", "a": "• Năng lượng (-) tiêu cực: Đau khổ, Bức xúc, Nặng nề, Đố kỵ, Ganh ghét, Giận dữ, Độc ác, Bấn loạn, tạp niệm...\n• Năng lượng (+) tích cực: Khát vọng, Đam mê, Dấn thân, Cần cù chịu khó, Khiêm tốn, Niềm tin, Ý chí vươn lên, Chính trực...", "d": 1}]}, {"part": 1, "num": 37, "title": "Thiên đàng và địa ngục", "summary": "Thiên đàng và Địa ngục không phải là nơi chốn bên ngoài Vũ Trụ hay nơi đến sau khi chết, mà là trạng thái rung động năng lượng Tâm thức bên trong: thanh tịnh, hạnh phúc là Thiên đàng; khổ đau dằn vặt là Địa ngục.", "key": "Giải thoát Tâm Trí = Thiên đàng; Thiên đàng hiện hữu ngay khi thân xác còn trong hơi thở.", "cards": [{"q": "Bản chất thật của \"Thiên đàng\"?", "a": "Không phải cảnh giới, tầng trời hay nơi đến sau khi chết, mà là sự rung động vi tế, cao cấp của năng lượng Tâm thức: thanh tịnh tuyệt đối, bình an sâu thẳm, viên mãn và phúc lạc trong nội tâm. Thiên đàng hiện hữu ngay khi còn sống."}, {"q": "Vì sao \"Giải thoát Tâm Trí = Thiên đàng\"?", "a": "Giải thoát Tâm Trí là Tâm Trí im lặng, cực sạch ý niệm: \"Trí cực sạch, Tâm cực an\" – đó là hạnh phúc, viên mãn. Mà Thiên đàng = hạnh phúc, viên mãn, bình an. Nên hai điều là một."}, {"q": "Sau khi thân xác chết, \"sự sống của bản ngã\" đi về đâu?", "a": "Nó chuyển động đến vùng \"rung động Tâm thức tương ứng\" theo Luật Hấp Dẫn, tiếp tục tiến hoá bằng gột rửa ô trược. Đây là sự vận hành tự động; không có thiên thần, giáo chủ hay nhân vật nào đưa linh hồn lên Thiên đàng hay đày xuống Địa ngục."}, {"q": "Nguồn gốc cụm từ \"Tây phương Cực Lạc\"?", "a": "Đồng nghĩa với Thiên đàng. Xưa Minh Triết tâm linh chủ yếu xuất hiện ở Ấn Độ (phía Tây); người tu ở phía Đông hành hương sang thỉnh kinh. Nghĩa là: thấu triệt kinh sách từ phía Tây thì sẽ an lạc."}, {"q": "Bản chất thật của \"Địa ngục\"?", "a": "Là những đau khổ dằn vặt nội tâm: năng lượng Tâm thức rung động nặng nề, thô trược từ bức xúc, sân si, đố kỵ, hơn thua. Người bị cảm xúc, ý nghĩ dẫn dắt là Ý thức đang \"lang thang trong Địa ngục\". THIÊN ĐÀNG = HẠNH PHÚC, ĐỊA NGỤC = KHỔ ĐAU."}, {"q": "Làm sao để rời Địa ngục, sống trong Thiên đàng?", "a": "• Học Thiền định, Quán Trí, Quán Tâm, đưa Ý thức hướng nội\n• Thực hành 5 BƯỚC TỈNH THỨC mọi lúc mọi nơi\n• \"Chọn bạn mà chơi\", hợp tác với người Tâm thức nhẹ nhàng\n• Lấy tu tập tâm linh làm trung tâm – \"Giàu chỉ sướng khi nội tâm an lạc\""}]}, {"part": 1, "num": 38, "title": "Trí tuệ và tư duy", "summary": "Trí tuệ là sự thấu hiểu, khác với trí nhớ và tư duy; trí tuệ tiến hoá khi tư duy dừng lại trong im lặng. Theo 6 cấp độ nhận thức Bloom, \"Hiểu\" là quan trọng nhất, và Sáng tạo = Thấu hiểu + Dấn thân trải nghiệm.", "key": "Tư duy là sản phẩm của trí tuệ, và trí tuệ đến từ sự chấm dứt của tư duy.", "cards": [{"q": "\"Trí tuệ\" là gì?", "a": "\"Tuệ\" là sự thông thái; Trí tuệ là sự thông thái của Trí, luôn đi kèm \"THẤU HIỂU\" – nắm được nguyên lý vận hành của sự vật và diễn giải được theo nhiều cách. Biết nhiều, ghi nhớ nhiều chỉ là TRÍ NHỚ, không phải trí tuệ."}, {"q": "Người Giác ngộ có phải là người \"biết hết mọi thứ trên đời\"?", "a": "Không. Người Giác ngộ là bậc thầy của \"SỰ THÔNG THÁI NỘI TÂM\" – thấu hiểu tường tận mọi ngóc ngách không gian nội tâm, nên Trí thanh tịnh, Tâm an lạc, ý thức tiến hoá vượt bậc, thấu thị nhanh khi tiếp xúc sự vật."}, {"q": "Quan hệ giữa Trí tuệ và Tư duy?", "a": "Thấu hiểu không cần qua suy nghĩ: \"Hiểu là hiểu, không hiểu là không hiểu\". Lý luận, phân tích, đánh giá đến SAU khi thấu hiểu. Vì vậy: TƯ DUY LÀ SẢN PHẨM CỦA TRÍ TUỆ VÀ TRÍ TUỆ ĐẾN TỪ SỰ CHẤM DỨT CỦA TƯ DUY."}, {"q": "Dấu hiệu Trí tuệ đã tiến hoá lên tầm cao mới?", "a": "• Chợt thấu hiểu điều từng nghe mà chưa hiểu\n• Đọc hiểu, nghe hiểu nhanh hơn\n• Làm việc tập trung, không sao nhãng\n• Giải quyết vấn đề nhanh, gãy gọn\n• Thẩm thấu được lời Sư phụ dạy trước kia"}, {"q": "Vì sao Thiền định giúp trí tuệ tiến hoá nhanh nhất?", "a": "Đỉnh cao Thiền là vượt thoát mọi hình tướng, chìm trong im lặng vô tận; từ đó năng lượng nguyên thuỷ sinh ra tự động, kích hoạt tiến hoá của Thể Trí, Thể Tâm, Ý thức → hiểu biết đại nhảy vọt. Mẹo: thiền vào im lặng rồi mới đọc sách hay nghĩ về điều muốn hiểu."}, {"q": "Câu \"Trí tuệ trưởng thành trong im lặng...\" được tác giả sửa lại thế nào?", "a": "\"TRÍ TUỆ TRƯỞNG THÀNH TRONG SỰ IM LẶNG, CÒN BẢN LĨNH TRƯỞNG THÀNH TRONG TRẢI NGHIỆM VÀ DẤN THÂN\". Im lặng là Đạo (Thiền định); dấn thân là Đời. Lấy Đạo tạo Trí sáng, Tâm an để sáng tạo cuộc sống viên mãn – ĐẠO TẠO RA ĐỜI."}, {"q": "Trong 6 cấp độ nhận thức Bloom, cấp độ nào quan trọng nhất và vì sao?", "a": "Cấp độ 2 – HIỂU. Hiểu đúng → làm đúng → kết quả đúng; hiểu sai → làm sai → kết quả sai. Ứng dụng: chưa hiểu kỹ, hiểu rõ, hiểu đúng thì không quyết định, không hành động, không hứa hẹn. Cấp 4–6 (phân tích-tổng hợp, đánh giá, sáng tạo) là sản phẩm tự nhiên sau đó."}, {"q": "Công thức Sáng tạo?", "a": "SÁNG TẠO = THẤU HIỂU + DẤN THÂN TRẢI NGHIỆM.\n• Hiểu đúng mà không dấn thân → không có kết quả.\n• Hiểu sai/chưa hiểu mà dấn thân → không kết quả, thêm tốn công sức."}, {"q": "Trí tuệ và tư duy được ví như gì trong máy tính?", "a": "Trí tuệ là HỆ ĐIỀU HÀNH (khả năng xử lý nhanh chậm); tư duy là các ỨNG DỤNG, phần mềm cài trên đó (như Photoshop, Word, Excel) để phân tích, xếp loại, đánh giá dữ liệu đưa vào."}, {"q": "Khi nào tư duy dừng lại, và khi đó điều gì xảy ra?", "a": "Khi: ngủ sâu không mộng; thiền nhập định (phủ định mọi tồn tại); thiền buông thư; cảm thấy đời viên mãn; khi xuất hiện đức tin, tình yêu, biết ơn, sự sáng của Ý thức. Khi đó \"THỰC TẠI MỞ RA\": cái nhìn vô chấp, tươi mới như trẻ thơ, hoà hợp vạn vật."}, {"q": "Vì sao thay ý nghĩ tiêu cực bằng ý nghĩ tích cực không tạo ra an lạc?", "a": "Đó chỉ là \"lấy rác mới chồng thêm vào rác cũ\" (như NLP, khoá sống tích cực), lâu ngày mệt mỏi. Chân lý là SỰ IM LẶNG. Ý nghĩ tích cực/tiêu cực là công cụ sáng tạo; dùng khi cần dưới kiểm soát của Ý thức, rồi trở về im lặng – \"Ưng vô sở trụ\"."}, {"q": "6 cấp độ nhận thức (kim tự tháp Bloom) từ thấp đến cao?", "a": "1. BIẾT\n2. HIỂU\n3. VẬN DỤNG (để trở nên \"Là như vậy\")\n4. PHÂN TÍCH TỔNG HỢP\n5. ĐÁNH GIÁ\n6. SÁNG TẠO", "d": 1}]}, {"part": 1, "num": 39, "title": "Tâm linh và tình dục", "summary": "Tình dục thuộc về bản năng, tức thuộc về tự nhiên và là Đạo; không nên kiềm chế mà hãy thỏa mãn lành mạnh hoặc chuyển hóa năng lượng ấy bằng sự sáng của Ý thức. Mỗi người có 4 đời sống cần viên mãn: Tâm linh, Tinh thần, Sức khỏe, Xã hội.", "key": "Cái gì thuộc về bản năng tức thuộc về tự nhiên; thuộc về tự nhiên tức đó chính là Đạo.", "cards": [{"q": "3 hình thái lựa chọn khi dục vọng (một năng lượng nội tâm) trỗi dậy?", "a": "1. Thỏa mãn – giải phóng nguồn năng lượng đó.\n2. Kiềm chế năng lượng.\n3. Chuyển hóa năng lượng."}, {"q": "Vì sao không nên kiềm chế năng lượng (kể cả năng lượng tình dục)?", "a": "Kiềm chế tạo ra tồn đọng năng lượng, hình thành các khối năng lượng khổ đau tích trữ lâu ngày trong Tâm thức → gây bệnh thân xác (ung thư vú, tử cung, u nang buồng trứng, viêm tuyến tiền liệt…) và bệnh tâm lý (trầm cảm, tự kỷ…); che mờ sự nhạy bén của Trí, Ý thức."}, {"q": "Vì sao tác giả nói tình dục là Đạo?", "a": "Tình dục thuộc về bản năng – sự tự động hóa ham muốn sinh sản Tạo Hóa ban cho muôn loài. Bản năng thuộc về tự nhiên, mà tự nhiên tức là Đạo. Mục đích tối hậu của bản năng là BẢO VỆ và DUY TRÌ SỰ SỐNG; bài bác bản năng là vô ơn với Tạo Hóa."}, {"q": "Ý nghĩa câu \"Có thực mới vực được Đạo\" trong chương này?", "a": "Mọi thứ thuộc về SINH TỒN (đói ăn, khát uống, mệt ngủ, đến tuổi thì có ham muốn duy trì nòi giống) cần được đáp ứng, thấu hiểu và CHẤP NHẬN NHƯ BẢN CHẤT \"LÀ NHƯ VẬY\" trước."}, {"q": "Các thái độ đúng đắn về tình dục theo tác giả?", "a": "• Để bản năng thuận theo tự nhiên.\n• Sinh hoạt lành mạnh, an toàn, tự nguyện, không gây khổ cho đối phương.\n• Khoái cảm là hợp lẽ tự nhiên.\n• Lập gia đình là thuận theo trời đất, không nhất thiết \"bỏ đời chọn Đạo\".\n• Phân biệt TÀ DÂM và TÌNH DỤC."}, {"q": "Ví dụ 3 trường hợp khi nội tâm xuất hiện năng lượng \"bức xúc\"?", "a": "1. Thỏa mãn: chửi bới, la hét… để phóng thích – \"chuyển hóa nghiệp thức tự nhiên\", giải thích mọi xung đột.\n2. Kiềm chế: nhẫn nhịn, dồn nén rồi đến lúc \"lượng đủ\" lại bộc phát.\n3. Chuyển hóa: nhận ra sự hiện diện và hiểu \"ĐÓ KHÔNG PHẢI LÀ TA\" – trường hợp của sự tỉnh thức."}, {"q": "Nguyên lý chuyển hóa năng lượng tình dục về Nguyên năng?", "a": "Ý thức về sự có mặt của nó, nhận ra và hiểu \"ĐÓ KHÔNG PHẢI LÀ TA\"; sự sáng của Ý thức chuyển hóa năng lượng về NGUYÊN NĂNG – CỰC SẠCH. Năng lượng tình dục mạnh hơn bức xúc, sân si…, nên khi chuyển hóa hết sẽ bổ sung nguyên năng dồi dào, kích phát tiến hóa nhận thức và Trí tuệ."}, {"q": "Hành động đúng đắn về tình dục cho người sống đời Cư sĩ?", "a": "1. Am hiểu nghệ thuật tình dục để cả hai cùng ĐẠT ĐỈNH, giải phóng năng lượng.\n2. Tuyệt đối không DIỆT DỤC hay kiềm nén; nói rõ với phối ngẫu khi chưa thỏa mãn.\n3. Có thể thực hành chuyển hóa năng lượng tình dục về Nguyên năng nếu muốn."}, {"q": "4 đời sống của con người dựa trên nguyên lý 3 vòng tròn (theo thứ tự ưu tiên)?", "a": "1. Đời sống TÂM LINH – vòng 01, Cội nguồn.\n2. Đời sống TINH THẦN – vòng 02, Tâm thức.\n3. Đời sống SỨC KHỎE – vòng 03, Thân xác.\n4. Đời sống XÃ HỘI – bên ngoài 3 vòng (gia đình ưu tiên số 01).\nViên mãn cả 4 chính là tu tập."}, {"q": "Vì sao Đời sống Xã hội xếp ưu tiên sau cùng?", "a": "Vì \"phải cứu chính mình trước khi cứu lấy người khác\". Thấu triệt vòng tròn số 01 (Tâm linh) thì mọi thứ bao quanh tự động viên mãn."}, {"q": "Kim tự tháp Bản năng – Bản ngã – Chân ngã gồm những gì?", "a": "• Đỉnh: CHÂN NGÃ – Vô ngã.\n• Giữa: BẢN NGÃ – bản ngã vi tế, bản ngã tích cực, bản ngã tiêu cực.\n• Đáy: BẢN NĂNG – 1. Ăn, 2. Uống, 3. Chỗ nghỉ ngơi, 4. Được an toàn, 5. Tình dục.", "d": 1}, {"q": "Phân biệt TÌNH DỤC và TÀ DÂM?", "a": "• Tình dục: rung cảm tự nhiên; trong tỉnh thức, Ý thức làm chủ; an toàn, đồng thuận, tự nguyện; hòa hợp 2 tâm hồn, thăng hoa Tâm thức lẫn Thân xác; trong tình yêu, khuôn khổ pháp lý, luân lý.\n• Tà dâm: muốn chiếm đoạt, chỉ thỏa mãn khát dục, không giao cảm; bất chấp an toàn, sự đồng ý; mua bán dâm, cưỡng bức; dục vọng điều khiển Tâm Trí, hành vi.", "d": 1}]}, {"part": 1, "num": 40, "title": "Bốn nguồn năng lượng có năng lực hoá giải khổ đau", "summary": "Khổ đau đến từ năng lượng Tâm thức phân cực âm (nghiệp nặng) chứ không phải từ Tâm Trí. Có 4 nguồn năng lượng không phân cực có sức chuyển hóa, chữa lành: Sự sáng của Ý thức, Đức tin, Tình yêu, Biết ơn – được Pháp Thiền \"Tất Cả Chỉ Là Ý Nghĩ\" hợp nhất trong một giáo lý.", "key": "Mặt hồ không phải nguyên nhân tạo sóng; Tâm Trí không phải nguyên nhân của khổ đau.", "cards": [{"q": "Tâm Trí có phải nguồn gốc của khổ đau? Ví dụ minh họa?", "a": "Không. Tâm Trí chỉ là công cụ sản sinh hình tướng. Sơ đồ: LỰC → MẶT HỒ → DAO ĐỘNG SÓNG; tương tự NĂNG LƯỢNG TÂM THỨC (NGHIỆP) → TÂM TRÍ → DAO ĐỘNG. Khổ đau và động loạn đến từ năng lượng Tâm thức ô trược tác động vào Tâm Trí; rung động càng nặng, Tâm Trí càng động loạn.", "d": 1}, {"q": "3 dạng năng lượng Tâm thức và tên gọi của chúng?", "a": "• Phân cực âm (-): hình thái tiêu cực, tạo khổ đau – NGHIỆP NẶNG.\n• Phân cực dương (+): trạng thái tích cực, xúc tác thành công đời sống xã hội – NGHIỆP NHẸ/NGHIỆP TÍCH CỰC.\n• Không phân cực: tiến hóa, an lạc; có sức chuyển hóa, gột rửa, sáng tạo, chữa lành."}, {"q": "4 nguồn năng lượng không phân cực có năng lực hóa giải khổ đau?", "a": "1. Năng lượng từ SỰ SÁNG CỦA Ý THỨC\n2. Năng lượng ĐỨC TIN\n3. Năng lượng TÌNH YÊU\n4. Năng lượng BIẾT ƠN"}, {"q": "Sự sáng của Ý thức: tinh hoa của tôn giáo nào, khai phá bằng gì, tạo ra gì?", "a": "Là tinh hoa của văn hóa phương Đông, cốt tủy của Phật giáo (\"tự đốt đuốc lên mà đi\"). Khai phá bằng THIỀN ĐỊNH cùng Tâm Pháp. Đại diện cho TRÍ HUỆ và HÀO QUANG, tạo ra sự THÔNG THÁI, trí tuệ và khả năng làm chủ."}, {"q": "Đức tin và Tình yêu là tinh hoa của tôn giáo nào? Hiểu đúng về \"Thượng Đế\"?", "a": "Tinh hoa của Hồi giáo và Công giáo. \"Thượng Đế\", \"Allah\" là từ ngữ hàm chứa Đức tin và sự thành kính với Tạo Hóa – cội nguồn của vạn vật, không phải một ông già râu tóc bạc hay thế lực tâm linh; hiểu vậy mới không mê tín."}, {"q": "Những sức mạnh cụ thể của năng lượng Tình yêu?", "a": "NUÔI LỚN, CHỮA LÀNH, PHỤC HỒI, XOA DỊU, CHUYỂN HÓA, GỘT RỬA Ô TRƯỢC, KẾT NỐI và GIAO CẢM. Không có sức sáng tạo, thông thái như sự sáng của Ý thức; nhưng cả hai cùng gột rửa được nghiệp lực."}, {"q": "Tình yêu đích thực khác Tình yêu bản ngã thế nào?", "a": "Tình yêu đích thực không thể đong đếm. Tình yêu đo lường nhiều/ít là \"TÌNH YÊU BẢN NGÃ\". Hỏi trẻ \"thương ba hay mẹ hơn?\" là câu hỏi vô minh, gieo SO SÁNH – mà \"so sánh và mong cầu\" là 2 gốc rễ lớn nhất của khổ đau."}, {"q": "\"Thần chú\" chung của Hooponopono và Sám hối là gì?", "a": "XIN LỖI và CẢM ƠN – mở cửa cho năng lượng Tình yêu tuôn chảy. \"Cảm ơn chỉ đơn giản là cảm ơn, không cần được ơn mới cảm ơn\"; \"Xin lỗi chỉ đơn giản là xin lỗi, không cần có lỗi mới xin\"."}, {"q": "Năng lượng Biết ơn có sức mạnh đặc biệt nào?", "a": "Ngoài tương đồng với Tình yêu, nó THU HÚT MAY MẮN và GIÀU CÓ VIÊN MÃN theo Luật Hấp Dẫn. GIÀU CÓ = ĐẦY ĐỦ = HÀI LÒNG, MÃN NGUYỆN = LUÔN CẢM THẤY BIẾT ƠN. Sinh ra khi mãn nguyện với thực tại hoặc thường cầu nguyện, tạ ơn."}, {"q": "5 yếu huyệt của người \"Đắc được Pháp\"?", "a": "1. Thấu thị bản chất thật của Tâm linh, không mê tín.\n2. Gia tăng sự sáng của Ý thức qua Thiền định.\n3. Đức tin vào Tạo Hóa qua cầu nguyện mỗi ngày.\n4. Xin lỗi và cảm ơn vô điều kiện – gia tăng năng lượng biết ơn.\n5. Tinh thần Di Lặc: viên mãn cả Đạo và Đời, rèn 4 đời sống."}, {"q": "Sơ đồ sinh hóa từ Sự Tuyệt đối ra các dạng năng lượng?", "a": "Sự Tuyệt đối → Năng lượng Nguyên thủy →\n• Sinh hóa lần I (Nhất Nguyên – Hợp nhất): năng lượng tiên thiên – Sự sáng của Ý thức, Đức tin, Tình yêu, Biết ơn, Hạnh phúc, Tự nhiên, Thông thái, Vị tha, Chân thành, Tĩnh lặng…\n• Sinh hóa lần II (Nhị Nguyên – Đối lập): (-) Đau khổ, Bức xúc, Đố kỵ, Giận dữ, Tạp niệm…; (+) Khát vọng, Đam mê, Dấn thân, Khiêm tốn, Niềm tin, Chính trực…", "d": 1}]}, {"part": 1, "num": 41, "title": "Giải thoát và siêu thoát", "summary": "Giải thoát là trạng thái nội tâm tự do, chấm dứt tạp niệm, chứ không phải lìa bỏ thế gian hay một tầng trời. Ràng buộc chính là các ý nghĩ, cảm xúc khởi lên về một đối tượng; hóa giải chúng bằng \"Cái gì nhận ra được thì không phải là Ta\" là giải thoát.", "key": "Có thể hiểu đơn giản nhất về hai chữ GIẢI THOÁT, đó chính là: CHẤM DỨT TẠP NIỆM.", "cards": [{"q": "Định nghĩa \"Giải thoát\"?", "a": "Là trạng thái TỰ DO của tư tưởng: nhẹ nhàng, rỗng rang, bình an; chấm dứt suy tưởng, phiền muộn, khổ đau; Tâm Trí cực sạch ý niệm, im lặng rốt ráo. Không phải từ bỏ thế gian, lìa thân xác hay lên một tầng trời. Đơn giản nhất: CHẤM DỨT TẠP NIỆM."}, {"q": "Quan hệ giữa Giải thoát và Giác ngộ?", "a": "Giác ngộ là thấu triệt bản chất Tâm linh, thông thái với không gian nội tâm; nhờ thấu hiểu mới thực hành đạt giải thoát. Giác ngộ diễn ra trước, Giải thoát sau – Giải thoát là sản phẩm, thuộc tính của Giác ngộ."}, {"q": "Phân biệt TỰ DO và SỰ BUÔNG THẢ?", "a": "\"Thích làm gì thì làm, nghĩ gì thì nghĩ\" là buông thả. Tự do đích thực luôn đi kèm KHẢ NĂNG LÀM CHỦ TÂM TRÍ: điều ngự tư duy theo chủ đích, hướng đến Chân – Thiện – Mỹ; làm chủ hành vi, lời nói, cảm xúc."}, {"q": "Ai là người giải thoát? Tâm và Trí được giải thoát khỏi gì?", "a": "Không có ai cả – chỉ có Tâm/Trí được giải thoát.\n• Tâm: khỏi cảm xúc thô trược, bấn loạn → an lạc.\n• Trí: khỏi dòng chảy ý nghĩ, tạp niệm → im lặng, tập trung vào thực tại."}, {"q": "Phân biệt \"Giải thoát\" và \"Siêu thoát\"?", "a": "Giải thoát dành cho Tâm thức còn trong thân xác. Siêu thoát dành cho Tâm thức rời thân xác: nếu Ý thức không vướng bận gì thì nhập vào KHÔNG TỒN TẠI, trở về Cội nguồn. Nếu còn vướng bận, Ý thức tìm cách tái sinh hoặc lẩn quẩn trong Vũ Trụ Tâm thức."}, {"q": "\"Sự ràng buộc\" với một sự vật hiện tượng là gì?", "a": "Là nhiều nghĩ ngợi, cảm xúc khởi lên khi nhắc đến nó. Mỗi ý nghĩ/cảm xúc/hình tướng là một \"sợi dây ràng buộc\", một \"chấp\". Khi nó không còn là đã chặt đứt một sợi dây – giải thoát được hình tướng đó."}, {"q": "Làm sao giải thoát với một người (vd. đã ly thân nhưng vẫn nghĩ về nhau)?", "a": "\"NHẬN RA\" mọi hình tướng xuất hiện và tín tâm \"CÁI GÌ NHẬN RA ĐƯỢC THÌ KHÔNG PHẢI LÀ TA\"; hoặc thực hành 5 Bước Tỉnh Thức, Quán Tâm, Quán Trí. Giải thoát giữa hai tâm hồn là CHẤM DỨT MỌI NGHĨ NGỢI VỀ NHAU, không chỉ là sống xa nhau."}, {"q": "Ví dụ ràng buộc với công việc và cách giải quyết?", "a": "Lo lắng, sợ hãi, không tự tin… khi nhắc đến sự nghiệp khiến việc khó khăn. Cần hóa giải các hình tướng, đưa Tâm Trí về im lặng: trong im lặng, Tâm Trí tự biết giải pháp và Luật Hấp Dẫn mang thuận lợi đến. Càng nghĩ ngợi càng không giải quyết được gì."}, {"q": "\"Sự đồng hóa\" hình thành điều gì và lối thoát?", "a": "Ý thức bị đồng hóa, cuốn trôi theo cảm xúc, ý nghĩ → hình thành BẢN NGÃ, sinh vô minh và khổ đau. Lối thoát: nhận ra hiện hữu trong nội tâm và tín tâm \"CÁI GÌ NHẬN RA ĐƯỢC THÌ KHÔNG PHẢI LÀ TA\" – kim chỉ nam của Giáo lý."}, {"q": "Phân biệt Giải thoát tương đối và Giải thoát tuyệt đối?", "a": "• Tương đối: người mới khai tâm; bắt đầu nhận diện dao động Tâm Trí, hướng nội, bớt sân si, nhưng Tâm Trí vẫn còn dao động.\n• Tuyệt đối: Trí im lặng thuần khiết, Tâm an lạc sâu thẳm, tạp niệm chấm dứt, ƯNG VÔ SỞ TRỤ, thông thái, hào quang, hạnh phúc không cần duyên khởi."}, {"q": "Sơ đồ \"Lăng kính Tâm Trí\" giữa TA và đối tượng?", "a": "TA → LĂNG KÍNH \"TÂM TRÍ\" sinh khởi các ý niệm (Ý nghĩ 01, Ý nghĩ 02, Cảm xúc 03, Trạng thái 04, Hình tướng 05, Suy diễn 06…) → đối tượng (sự vật hiện tượng, công việc sự nghiệp, người nào đó). Mỗi ý niệm trong lăng kính là một sợi dây ràng buộc.", "d": 1}]}, {"part": 1, "num": 42, "title": "Tĩnh lặng là “sự cân bằng”", "summary": "Tĩnh lặng chính là sự cân bằng; sự cân bằng mang lại mãn nguyện, và mãn nguyện sinh ra từ năng lượng biết ơn chứ không phải từ việc thỏa mãn mọi khát vọng. Cần cân bằng ở cả 3 vòng tròn bản thể lẫn đời sống xã hội, trong đó Tâm thức là quan trọng nhất.", "key": "Hãy mãn nguyện trước, rồi thành công sẽ đến – chứ không phải thành công đến rồi mới mãn nguyện.", "cards": [{"q": "Vì sao đá cuội xếp chồng là biểu tượng của Thiền? Bản chất cốt lõi của sự cân bằng?", "a": "Vì đó là biểu trưng của SỰ CÂN BẰNG. Như mặt hồ cân bằng khi tĩnh lặng: TĨNH LẶNG CHÍNH LÀ SỰ CÂN BẰNG. Thiền định là nghệ thuật điều hướng nội tâm tới SỰ IM LẶNG."}, {"q": "Khi nào sự tĩnh lặng nội tâm xuất hiện?", "a": "• Mọi ham muốn, khát vọng được trút bỏ.\n• Ý nghĩ, tư duy, dòng miên man dừng lại.\n• Cảm xúc tiêu cực lẫn tích cực tan biến.\n• Trí cực sạch ý nghĩ, Tâm cực sạch cảm xúc.\n• Nội tâm \"không chút gợn sóng\"."}, {"q": "Sự tĩnh lặng KHÔNG đến từ đâu?", "a": "Không đến từ nhiều tiền hơn, địa vị cao hơn, bằng cấp nhiều hơn, được khen ngợi thừa nhận, thu lượm nhiều kiến thức Tâm linh, hay tương tác giao tiếp. Nó là hình tướng nguyên thủy đầu tiên của Tâm Trí, nằm ngoài mọi ý nghĩ, tư duy."}, {"q": "Hiểu sai lệch phổ biến về sự mãn
